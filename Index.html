function syncUserFieldSitePerms(userIdx, siteId, allow){
  var u=DB.users[userIdx];
  if(!u) return;
  var uid=u.uid||u.id;
  // تحديث site.allowedUsers
  var site=DB.fieldSites.find(function(s){return s.id===siteId;});
  if(site){
    var allowed=site.allowedUsers?[].concat(site.allowedUsers):[];
    if(allow){if(allowed.indexOf(uid)<0) allowed.push(uid);}
    else{allowed=allowed.filter(function(x){return x!==uid;});}
    fbSet('fieldSites/'+siteId+'/allowedUsers', allowed);
  }
  // تحديث perms.allowedSites في المستخدم
  var curPerms=u.perms||{};
  var curSites=curPerms.allowedSites?[].concat(curPerms.allowedSites):[];
  if(allow){if(curSites.indexOf(siteId)<0) curSites.push(siteId);}
  else{curSites=curSites.filter(function(x){return x!==siteId;});}
  curPerms.allowedSites=curSites;
  fbUpdate('users/'+uid,{perms:curPerms});
  toast(allow?'✅ تمت إضافة الصلاحية':'🚫 تم سحب الصلاحية');
}

function savePerms(i){
  var ALL_KEYS=['inv','faults','notifs','invoices','moves','sites','types','fieldmap','addItem','updFault','importInv','users','radio','radioEdit','uav','uavEdit','maintain','reports','docs','downloadDocs','siteinv','camDrag'];
  var perms={};
  ALL_KEYS.forEach(function(k){
    var el=document.getElementById('pm_'+k);
    perms[k]=(el?el.checked:false);
  });
  // حفظ المواقع الميدانية المصرح بها — لكل الأدوار ما عدا المدير
  var u2=DB.users[i];
  if(u2&&u2.role!=='manager'&&u2.role!=='viewer'){
    var allowedSiteIds=DB.fieldSites
      .filter(function(fs){var el=document.getElementById('site_'+fs.id);return el&&el.checked;})
      .map(function(fs){return fs.id;});
    perms.allowedSites=allowedSiteIds;
    // مزامنة مع allowedUsers في كل موقع ميداني
    var uid2=u2.uid||u2.id;
    DB.fieldSites.forEach(function(fs){
      var allowed=fs.allowedUsers?[].concat(fs.allowedUsers):[];
      var hasIt=allowed.indexOf(uid2)>=0;
      var wantsIt=allowedSiteIds.indexOf(fs.id)>=0;
      if(wantsIt&&!hasIt) allowed.push(uid2);
      else if(!wantsIt&&hasIt) allowed=allowed.filter(function(x){return x!==uid2;});
      fbSet('fieldSites/'+fs.id+'/allowedUsers', allowed);
    });
  }
  if(u2) fbUpdate('users/'+(u2.uid||u2.id),{perms});
  closeModal(); toast('✅ تم حفظ الصلاحيات');
}
function resetPerms(i){ const u=DB.users[i]; if(u) fbUpdate('users/'+(u.uid||u.id),{perms:null}); closeModal(); toast('تم إعادة الصلاحيات للافتراضي'); }

function revokeAll(i){
  ['inv','faults','invoices','moves','sites','types','fieldmap','addItem','updFault','importInv','users','radio','radioEdit','uav','uavEdit','maintain','reports','docs','downloadDocs','siteinv','camDrag'].forEach(k=>{
    const el=document.getElementById('pm_'+k); if(el&&!el.disabled) el.checked=false;

function grantAll(i){

}

function handleImpFile(input){
  const file=input.files[0]; if(!file) return;
  const area=$('imparea');
  area.style.borderColor='var(--gn)';
  area.innerHTML=`<div style="font-size:36px">✅</div><div style="font-weight:700;color:var(--gn)">${esc(file.name)}</div>
    <div style="font-size:12px;color:var(--mt)">${(file.size/1024).toFixed(1)} KB</div>`;
  const reader=new FileReader();
  reader.onload=e=>{
    const content=e.target.result;
    let parsed=null;
    try{
      parsed=JSON.parse(content);
      if(!Array.isArray(parsed)) parsed=[parsed];
    }catch{
      const lines=content.split('\n').filter(l=>l.trim());
      if(lines.length<2){ toast('الملف فارغ أو تنسيق غير صحيح','err'); return; }
      const headers=lines[0].split(',').map(h=>h.trim().replace(/"/g,''));
      parsed=lines.slice(1).map(l=>{
        const vals=l.split(',');
        const obj={};
        headers.forEach((h,i)=>obj[h]=(vals[i]||'').trim().replace(/"/g,''));
        return obj;
      }).filter(o=>Object.values(o).some(v=>v));
    }
    window._impData=parsed;
    const f=parsed[0]||{};
    ['sup','num','dat','amt'].forEach(k=>{
      const el=$('im'+k);
      if(el) el.value=f.supplier||f.مورد||f.sup||
        (k==='num'?(f.invoiceNo||f.num||f.رقم||''):
        (k==='dat'?(f.date||f.تاريخ||''):
        (k==='amt'?(f.amount||f.مبلغ||''):'')));
    });
    if($('imitm')) $('imitm').value=f.items||f.أصناف||f.imitm||'';
    const prev=$('impprev');
    prev.style.display='block';
    prev.innerHTML=`<b style="color:var(--gn)">✅ قُرئ ${parsed.length} سجل من الملف</b>
      <pre style="margin-top:8px;color:var(--mt);overflow:auto;max-height:120px;font-size:11px">${esc(JSON.stringify(parsed.slice(0,2),null,2))}</pre>`;
  };
  reader.readAsText(file,'utf-8');
}

async function doSyncFieldItems(warehouseName){
  const linkedFS = DB.fieldSites.filter(fs=>fs.warehouse===warehouseName);
  let addedCount=0, skippedCount=0;
  const existingItems = DB.inv[warehouseName]||[];

  for(const fs of linkedFS){
    // 1. كاميرات المواقع الميدانية
    const cameras = fs.cameras||[];
    for(const cam of cameras){
      const camName = (cam.name||'').trim().toLowerCase();
      const camSerial = (cam.serial||'').trim().toLowerCase();
      const alreadyExists = existingItems.some(it=>{
        if(it.fieldCamId && it.fieldCamId===(cam.id||cam.serial)) return true;
        if(camSerial && it.serial && it.serial.toLowerCase()===camSerial) return true;
        if(camName && it.name && it.name.trim().toLowerCase()===camName && it.fieldSiteId===fs.id) return true;
        return false;
      });
      if(alreadyExists){ skippedCount++; continue; }
      const newItem = {
        id: gid(), type:'camera',
        name: cam.name||'كاميرا ميدانية',
        serial: cam.serial||'',
        model: cam.model||'',
        mfr: cam.brand||'',
        status: 'deployed',
        installedAt: fs.name+(cam.name?` — ${cam.name}`:''),
        currentSite: warehouseName,
        fieldSiteId: fs.id,
        fieldCamId: cam.id||cam.serial,
        addedBy: CU.name,
        addedAt: ts(),
        _ts: Date.now()
      };
      await FBDB.ref(`cctv/inv/${fbKey(warehouseName)}/${newItem.id}`).set(newItem);
      addedCount++;
    }

    // 2. مواد جرد الموجودات الثابتة (siteInventory)
    const snap = await FBDB.ref(`cctv/siteInventory/${fs.id}`).once('value');
    const points = snap.val() ? Object.values(snap.val()) : [];
    for(const pt of points){
      const ptItems = pt.items ? Object.values(pt.items) : [];
      for(const it of ptItems){
        const alreadyExists = existingItems.some(ex=>
          (it.serial&&ex.serial&&ex.serial===it.serial)||(ex.siteItemId===it.id)
        );
        if(alreadyExists){ skippedCount++; continue; }
        const newItem = {
          id: gid(), type:'other',
          name: it.name||'عنصر ميداني',
          serial: it.serial||'',
          status: 'deployed',
          installedAt: fs.name+' — '+pt.name,
          currentSite: warehouseName,
          fieldSiteId: fs.id,
          siteItemId: it.id,
          qty: it.qty||1,
          notes: it.notes||'',
          addedBy: CU.name,
          addedAt: ts(),
          _ts: Date.now()
        };
        await FBDB.ref(`cctv/inv/${fbKey(warehouseName)}/${newItem.id}`).set(newItem);
        addedCount++;
      }
    }
  }

  toast(`✅ تمت المزامنة — ${addedCount} عنصر جديد${skippedCount?` (${skippedCount} موجود مسبقاً)`:''}`);
  logAct('مزامنة مواد الميدان', warehouseName+' — '+addedCount+' عنصر');
  setTimeout(()=>pgInv(), 800);
}

async function doDedupWarehouse(warehouseName){
  const items = [...(DB.inv[warehouseName]||[])];
  const seen = new Set();
  let deletedCount = 0;
  for(const item of items){
    const nameKey   = (item.name||item.serial||'').trim().toLowerCase();
    const serialKey = (item.serial||'').trim().toLowerCase();
    const siteKey   = item.fieldSiteId||item.fieldCamId||'';
    const key = serialKey ? serialKey+'__'+siteKey : nameKey+'__'+siteKey;
    if(seen.has(key)){
      await FBDB.ref(`cctv/inv/${fbKey(warehouseName)}/${item.id}`).remove();
      deletedCount++;
    } else {
      seen.add(key);
    }
  }
  toast(`✅ تم حذف ${deletedCount} عنصر مكرر`);
  logAct('حذف تكرار', warehouseName+' — '+deletedCount+' عنصر');
  setTimeout(()=>pgInv(), 800);
}

function doAddWarehouse(){
  const n = val('wh-name').trim();

  if(!n){ toast('أدخل اسم المستودع','err'); return; }
  if(DB.sites.includes(n)){ toast('المستودع موجود مسبقاً','err'); return; }
  const key = String(Date.now());
  fbSet('sites/'+key+'_site', n);
  fbSet('inv/'+fbKey(n)+'/___init',{___init:true});
  if(parent){
    if(!window._siteParents) window._siteParents={};

  }
  closeModal(); toast('✅ تم إضافة المستودع: '+n);
  logAct('إضافة مستودع', n+(parent?' ← '+parent:''));
}

function doEditWarehouse(oldName, i){
  const newName = val('wh-edit-name').trim();
  const newParent = val('wh-edit-parent');
  if(!newName){ toast('أدخل الاسم','err'); return; }

  // تحديث الأب
  if(!window._siteParents) window._siteParents={};
  if(newParent) {
    window._siteParents[newName]=newParent;
    fbSet('siteParents/'+fbKey(newName), newParent);
  } else {
    delete window._siteParents[oldName];
    fbDel('siteParents/'+fbKey(oldName));
  }

  // إعادة تسمية إذا تغير الاسم
  if(newName!==oldName){
    const oldItems=DB.inv[oldName]||[];
    oldItems.forEach(it=>fbSet('inv/'+fbKey(newName)+'/'+it.id,{...it,currentSite:newName}));
    fbDel('inv/'+fbKey(oldName));
    const siteKey=window._sitesKeys?.[oldName];
    if(siteKey) fbSet('sites/'+siteKey, newName);
    if(ISITE===oldName) ISITE=newName;
  }
  closeModal(); toast('✅ تم التحديث');
}

function getGPS(latId,lngId,stId){
  const st=$(stId||'gps-status');
  if(!navigator.geolocation){ if(st) st.textContent='المتصفح لا يدعم GPS'; return; }
  if(st){ st.textContent='⏳ جار التحديد...'; st.style.color='var(--yl)'; }
  navigator.geolocation.getCurrentPosition(pos=>{
    const lat=pos.coords.latitude.toFixed(6), lng=pos.coords.longitude.toFixed(6);
    const eL=$(latId||'flat'); if(eL) eL.value=lat;
    const eG=$(lngId||'flng'); if(eG) eG.value=lng;
    if(st){ st.textContent=`✅ ${lat}, ${lng}`; st.style.color='var(--gn)'; }
  },()=>{ if(st){ st.textContent='❌ تعذر التحديد'; st.style.color='var(--rd)'; }},
  {enableHighAccuracy:true,timeout:10000});
}

// ══ طبقات الخريطة ══
var _activeLayers = {cameras:true, towers:false, p2p:false, radio:false, nvr:false, faults:false, boundaries:false, network:false};

function toggleMapLayer(layer, btn){
  _activeLayers[layer] = !_activeLayers[layer];
  var active = _activeLayers[layer];
  var colors = {
    cameras:'#0969da', towers:'#9a6700', p2p:'#8250df',
    radio:'#06b6d4', nvr:'#6f42c1', faults:'#d1242f', boundaries:'#1a7f37', network:'#656d76'
  };
  var col = colors[layer]||'var(--bl)';
  if(btn){
    btn.style.background = active ? col+'22' : 'var(--sf)';
    btn.style.color      = active ? col : 'var(--mt)';
  }
  applyMapLayers();
}

function clearAllMapLayers(){
  Object.keys(_activeLayers).forEach(function(k){ _activeLayers[k]=false; });
  var btns=['cameras','towers','p2p','radio','nvr','faults','boundaries','network'];
  btns.forEach(function(id){
    var b=document.getElementById('lyr-'+id);
    if(b){ b.style.background='var(--sf)'; b.style.color='var(--mt)'; }
  });
  applyMapLayers();
}

function applyMapLayers(){
  if(!_map || !window._layerGroups) return;
  Object.keys(window._layerGroups).forEach(function(k){
    var lg = window._layerGroups[k];
    if(_activeLayers[k]){
      if(!_map.hasLayer(lg)) lg.addTo(_map);
    } else {
      if(_map.hasLayer(lg)) lg.remove();
    }
  });
}

function searchCamByIP() {
  const ip = val('ipSearchInput');
  const resultDiv = $('ipSearchResult');
  const visibleSites = getVisibleFieldSites();
  
  if(!ip) {
    resultDiv.innerHTML = '<span style="color:var(--yl)">⚠️ الرجاء إدخال عنوان IP</span>';
    return;
  }
  
  let foundCam = null;
  let foundSite = null;
  
  for(const site of visibleSites) {
    for(const cam of site.cameras) {
      if(cam.ip && cam.ip === ip) {
        foundCam = cam;
        foundSite = site;
        break;
      }
    }
    if(foundCam) break;
  }
  
  if(foundCam) {
    fieldSearchResult = { cam: foundCam, site: foundSite };
    resultDiv.innerHTML = `<span style="color:var(--gn)">✅ تم العثور على الكاميرا في موقع: ${esc(foundSite.name)}</span>`;
    
    pgFieldMap();
    
    setTimeout(() => {
      if(foundCam.lat && foundCam.lng) {
        fmFlyTo(foundCam.lat, foundCam.lng, `${foundSite.id}_${foundSite.cameras.indexOf(foundCam)}`);
      }
    }, 500);
  } else {
    fieldSearchResult = null;
    resultDiv.innerHTML = `<span style="color:var(--rd)">❌ لا توجد كاميرا بهذا العنوان IP في المواقع المتاحة لك</span>`;
  }
}

function loadCustomMap(inp){
  const file=inp.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    window._pendingMapImg=e.target.result;
    const area=$('mapimgarea');
    area.innerHTML=`<img src="${e.target.result}" style="max-height:150px;border-radius:7px;max-width:100%">`;
    $('mapimgprev').innerHTML=`<div style="font-size:12px;color:var(--gn);margin-top:8px;text-align:center">✅ ${esc(file.name)}</div>`;
  };
  reader.readAsDataURL(file);
}
function applyCustomMap(){
  if(!window._pendingMapImg){ toast('اختر صورة أولاً','err'); return; }
  _customMapUrl=window._pendingMapImg;
  _mapLayer='custom';
  closeModal(); pgFieldMap();
}

function saveSitePermissions(siteId) {
  const site = DB.fieldSites.find(s => s.id === siteId);
  if(!site) return;
  const allowedUsers = [];
  DB.users.forEach(user => {
    const uid = user.uid||user.id;
    const cb = document.getElementById('usr_'+uid);
    if(cb && cb.checked) allowedUsers.push(uid);
  });
  fbUpdate('fieldSites/'+siteId, {allowedUsers});
  if(_FSITE === siteId) _FSITE = '';
  closeModal();
  toast('تم حفظ صلاحيات الموقع');
  pgFieldMap();
}

  setTimeout(()=>{
    const locEl = document.getElementById('floc');
    if(locEl){ locEl.value=fs.name; }
    const ptEl = document.getElementById('fpt');
    if(ptEl){ ptEl.value=c.name||c.serial||''; }
  }, 200);
}

function initFieldMap(){
  if(_map){ _map.remove(); _map=null; }
  _markers=[]; _distanceMeasure=null;
  const el=$('fld-map'); if(!el) return;
  // ارتفاع ثلثي الشاشة
  el.style.height = Math.round(window.innerHeight * 0.62) + 'px';

  const visibleSites = getVisibleFieldSites();
  const sites = _FSITE ? visibleSites.filter(fs=>fs.id===_FSITE) : visibleSites;
  
  let allCams=[];
  sites.forEach(fs=>fs.cameras.forEach((c,ci)=>{
    if(c.lat&&c.lng&&!isNaN(parseFloat(c.lat)))
      allCams.push({...c,_fsId:fs.id,_fsName:fs.name,_ci:ci});
  }));

  // ── تجميع المعدات الأخرى (أبراج/P2P/راديو/NVR) من كل المواقع المرئية ──
  let allEquip=[];
  sites.forEach(fs=>{
    Object.values(fs.equipment||{}).forEach(eq=>{
      if(eq.lat&&eq.lng&&!isNaN(parseFloat(eq.lat)))
        allEquip.push({...eq,_fsId:fs.id,_fsName:fs.name});
    });
  });

  const defLat=33.3152, defLng=44.3661;
  const cLat=allCams.length?allCams.reduce((s,c)=>s+parseFloat(c.lat),0)/allCams.length:defLat;
  const cLng=allCams.length?allCams.reduce((s,c)=>s+parseFloat(c.lng),0)/allCams.length:defLng;

  _map=L.map('fld-map',{maxZoom:22,tap:true,tapTolerance:15}).setView([cLat,cLng],allCams.length?18:7);

  const _googleTiles = {
    satellite: 'https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',
    hybrid:    'https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}',
    gmap:      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    geo:       'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
  };

  if(_mapLayer==='custom'&&_customMapUrl){
    const bounds=[[cLat-0.02,cLng-0.03],[cLat+0.02,cLng+0.03]];
    L.imageOverlay(_customMapUrl,bounds,{opacity:1,interactive:false}).addTo(_map);
    L.tileLayer(_googleTiles.geo,{opacity:0.15,attribution:'© OSM'}).addTo(_map);
  } else if(_mapLayer==='hybrid'){
    L.tileLayer(_googleTiles.hybrid,{attribution:'© Google',maxZoom:22,maxNativeZoom:21}).addTo(_map);
  } else if(_mapLayer==='satellite'){
    L.tileLayer(_googleTiles.satellite,{attribution:'© Google',maxZoom:22,maxNativeZoom:21}).addTo(_map);
  } else if(_mapLayer==='gmap'){
    L.tileLayer(_googleTiles.gmap,{attribution:'© OpenStreetMap',maxZoom:19}).addTo(_map);
  } else {
    L.tileLayer(_googleTiles.geo,{attribution:'© OpenStreetMap',maxZoom:19}).addTo(_map);
  }

  // ══ طبقة حركة المرور ══
  if(window._trafficLayer){
    L.tileLayer('https://mt1.google.com/vt/lyrs=h&x={x}&y={y}&z={z}',
      {attribution:'© Google Traffic',maxZoom:22,maxNativeZoom:21,opacity:0.7}).addTo(_map);
  }

  // ══ إنشاء LayerGroups للطبقات ══
  window._layerGroups = {
    cameras    : L.layerGroup(),
    towers     : L.layerGroup(),
    p2p        : L.layerGroup(),
    radio      : L.layerGroup(),
    nvr        : L.layerGroup(),
    faults     : L.layerGroup(),
    boundaries : L.layerGroup(),
    network    : L.layerGroup(),
  };

  // تطبيق الطبقات النشطة فقط
  Object.keys(window._layerGroups).forEach(k=>{
    if(_activeLayers[k]) window._layerGroups[k].addTo(_map);
  });

  allCams.forEach(c=>{
    const lat=parseFloat(c.lat), lng=parseFloat(c.lng);
    const stColor=getCamDisplayColor(c);
    const angle=parseFloat(c.beamAngle)||70;
    const rot=parseFloat(c.beamRot)||0;
    const mid=`${c._fsId}_${c._ci}`;
    const viewDist=parseFloat(c.viewDist)||50;
    const mPerLat = 111320;
    const mPerLng = 111320 * Math.cos(lat * Math.PI/180);
    const halfRad  = (angle/2) * Math.PI/180;
    const rotRad   = rot       * Math.PI/180;
    const steps    = Math.max(24, Math.round(angle));
    const camGroup = window._layerGroups.cameras;

    if(angle >= 358){
      L.circle([lat,lng],{radius:viewDist,color:'#ff4400',fillColor:'transparent',fillOpacity:0,weight:2.5,opacity:0.9,dashArray:'8,4'}).addTo(camGroup);
      const numRays = 16;
      for(let r=0;r<numRays;r++){
        const theta=(r/numRays)*2*Math.PI;
        const dLat=(viewDist*Math.cos(theta))/mPerLat;
        const dLng=(viewDist*Math.sin(theta))/mPerLng;
        const rayColor=r%2===0?'#ff3300':'#ff7700';
        L.polyline([[lat,lng],[lat+dLat,lng+dLng]],{color:rayColor,weight:1.8,opacity:0.75,dashArray:'10,6'}).addTo(camGroup);
      }
      L.circle([lat,lng],{radius:viewDist*0.05,color:'#ff4400',fillColor:'#ff6600',fillOpacity:0.8,weight:1}).addTo(camGroup);
    } else {
      const pts=[[lat,lng]];
      for(let i=0;i<=steps;i++){
        const theta=rotRad-halfRad+(i/steps)*2*halfRad;
        const dLat=(viewDist*Math.cos(theta))/mPerLat;
        const dLng=(viewDist*Math.sin(theta))/mPerLng;
        pts.push([lat+dLat,lng+dLng]);
      }
      pts.push([lat,lng]);
      L.polygon(pts,{color:stColor,fillColor:stColor,fillOpacity:0.20,weight:1.8,opacity:0.80}).addTo(camGroup);
    }

    const sz=32;
    const svgIcon=`<svg width="${sz}" height="${sz}" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <circle cx="16" cy="16" r="15" fill="${stColor}" opacity="0.15" stroke="${stColor}" stroke-width="1.5"/>
      <rect x="5" y="11" width="14" height="10" rx="2.5" fill="${stColor}"/>
      <polygon points="19,13 27,10 27,22 19,19" fill="${stColor}" opacity="0.85"/>
      <circle cx="11" cy="16" r="3.5" fill="white" opacity="0.9"/>
      <circle cx="11" cy="16" r="2" fill="${stColor}"/>
    </svg>`;
    const icon=L.divIcon({html:svgIcon,className:'',iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]});
    const isDraggable=CU&&(CU.role==='manager'||p('camDrag'));
    const marker=L.marker([lat,lng],{icon,zIndexOffset:500,draggable:isDraggable}).addTo(camGroup);

    if(isDraggable){
      marker.on('dragstart',()=>{toast('📍 اسحب لتصحيح الموقع','warn');marker.closePopup();});
      marker.on('dragend',function(e){
        const nl=e.target.getLatLng();
        const dist=Math.round(_map.distance([lat,lng],[nl.lat,nl.lng]));
        window._pendingCamMove={fsId:c._fsId,ci:c._ci,lat:nl.lat,lng:nl.lng};
        openModal(mhd('📍 تأكيد تعديل موقع الكاميرا')
          +'<div style="background:var(--bg);border-radius:10px;padding:12px;margin-bottom:14px">'
          +'<div style="font-weight:700;margin-bottom:6px">📷 '+esc(c.name||c.serial||'كاميرا')+'</div>'
          +'<div style="font-size:14px;color:var(--mt)">تم إزاحة الكاميرا <b style="color:var(--yl)">'+dist+' متر</b></div>'
          +'<div style="font-size:12px;color:var(--mt);margin-top:4px;direction:ltr">'+nl.lat.toFixed(6)+', '+nl.lng.toFixed(6)+'</div></div>'
          +'<div style="display:flex;gap:8px">'
          +'<button class="btn btn-gy" style="flex:1" onclick="closeModal();initFieldMap()">↩️ إلغاء</button>'
          +'<button class="btn btn-bl" style="flex:1" onclick="confirmCamMove()">✅ حفظ الموقع</button>'
          +'</div>');
      });
    }

    const popup=`<div style="min-width:230px;direction:rtl;font-family:inherit">
      <div style="font-weight:800;font-size:18px;color:${stColor};margin-bottom:6px">📷 ${esc(c.name||c.serial||'كاميرا')}</div>
      <div style="font-size:12px;color:#7d8590;margin-bottom:8px">📍 ${esc(c._fsName)}</div>
      ${c.camType?`<div style="font-size:12px;margin-bottom:3px"><b>النوع:</b> ${esc(c.camType)}</div>`:''}
      ${c.res?`<div style="font-size:12px;margin-bottom:3px"><b>الدقة:</b> ${esc(c.res)}</div>`:''}
      ${c.ip?`<div style="font-size:12px;margin-bottom:3px"><b>IP:</b> <span style="direction:ltr;display:inline-block">${esc(c.ip)}</span></div>`:''}
      ${c.serial?`<div style="font-size:12px;margin-bottom:3px"><b>السيريال:</b> ${esc(c.serial)}</div>`:''}
      <div style="font-size:12px;margin-bottom:6px"><b>الحالة:</b> ${c.status==='active'?'🟢 تعمل':c.status==='maintenance'?'🟡 صيانة':'⚪ مجهول'}</div>
      <div style="font-size:10px;color:#555;direction:ltr;margin-bottom:8px">${lat.toFixed(6)}, ${lng.toFixed(6)}</div>
      ${p('fieldmap')?`<button onclick="openEditFieldCam('${c._fsId}',${c._ci});_map&&_map.closePopup()" style="background:#58a6ff22;border:1px solid #58a6ff44;color:#58a6ff;padding:5px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;font-family:inherit;width:100%">✏️ تعديل</button>`:''}
    </div>`;
    marker.bindPopup(L.popup({maxWidth:300}).setContent(popup));
    _markers.push({id:mid,marker,cam:c,_layerType:'cameras'});
  });

  // ── رسم المعدات الأخرى (أبراج/P2P/راديو/NVR) على الخريطة ──
  const EQUIP_ICONS = {tower:'🗼', p2p:'📡', radio:'📻', nvr:'💾'};
  const EQUIP_LAYER_KEY = {tower:'towers', p2p:'p2p', radio:'radio', nvr:'nvr'};
  const EQUIP_STATUS_COLOR = {active:'#3fb950', maintenance:'#d29922', down:'#8b949e'};
  allEquip.forEach(eq=>{
    const eLat=parseFloat(eq.lat), eLng=parseFloat(eq.lng);
    const layerKey = EQUIP_LAYER_KEY[eq.equipType] || 'towers';
    const targetGroup = window._layerGroups[layerKey];
    if(!targetGroup) return;
    const eColor = EQUIP_STATUS_COLOR[eq.status] || '#3fb950';
    const eIcon = L.divIcon({
      className:'', html:`<div style="background:${eColor};width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 1px 4px rgba(0,0,0,.4);border:2px solid #fff">${EQUIP_ICONS[eq.equipType]||'📍'}</div>`,
      iconSize:[30,30], iconAnchor:[15,15]
    });
    const eMarker = L.marker([eLat,eLng],{icon:eIcon}).addTo(targetGroup);
    const statusLabel = {active:'✅ يعمل', maintenance:'🔧 صيانة', down:'❌ معطل'}[eq.status]||eq.status||'';
    const eqPopup = `<div style="min-width:160px;text-align:right;direction:rtl">
      <div style="font-weight:700;margin-bottom:4px">${EQUIP_ICONS[eq.equipType]||''} ${esc(eq.name||'')}</div>
      ${eq.model?`<div style="font-size:12px;color:#555">${esc(eq.model)}</div>`:''}
      ${eq.detail?`<div style="font-size:12px;color:#555">${esc(eq.detail)}</div>`:''}
      <div style="font-size:12px;margin-top:4px">${statusLabel}</div>
    </div>`;
    eMarker.bindPopup(eqPopup);
  });

  if(allCams.length>1){
    const g=L.featureGroup(_markers.map(m=>m.marker));
    _map.fitBounds(g.getBounds().pad(0.15));
  }

  // ══ 4. موقعي الحالي ══
  addMyLocationToMap();
  // ══ تحميل الحدود المحفوظة ══
  loadBoundaries();
  // ══ الضغط المطول لإضافة عنصر جديد بسرعة (كاميرا/برج/P2P/راديو/NVR) ══
  setupLongPressAddMenu(_map);
  // ══ مفتاح الخريطة (Legend) ══
  injectMapLegend();
  // ══ listener لرسم الحدود ══
  _map.on('click', e=>{
    if(!_drawingBoundary) return;
    _boundaryPoints.push([e.latlng.lat, e.latlng.lng]);
    const dot = L.circleMarker(e.latlng,{radius:5,color:'#f85149',fillColor:'#f85149',fillOpacity:1}).addTo(_map);
    _boundaryMarkers.push(dot);
    if(_boundaryLine){ _boundaryLine.remove(); }
    if(_boundaryPoints.length>1){
      _boundaryLine = L.polyline(_boundaryPoints,{color:'#f85149',weight:2,dashArray:'6,4'}).addTo(_map);
    }
  });

  // ══ 6. قياس المسافة ══
  addDistanceMeasureTool();
}

let _myLocationMarker = null;
let _distanceMeasure = null;
let _measurePoints = [];
let _measureLines = [];
let _measuringMode = false;


function confirmCamMove(){
  const p = window._pendingCamMove;
  if(!p) return;
  saveCamNewPos(p.fsId, p.ci, p.lat, p.lng);
  window._pendingCamMove = null;
}

function saveCamNewPos(fsId, ci, newLat, newLng){
  const fs = DB.fieldSites.find(s=>s.id===fsId);
  if(!fs||!fs.cameras[ci]){ toast('خطأ','err'); return; }
  fs.cameras[ci].lat = newLat;
  fs.cameras[ci].lng = newLng;
  // حفظ في Firebase
  const camsObj = {};
  fs.cameras.forEach((c,i)=>{ camsObj[i]=c; });
  FBDB.ref('cctv/fieldSites/'+fsId+'/cameras').set(camsObj);
  logAct('تصحيح موقع كاميرا', (fs.cameras[ci].name||'كاميرا')+' — إزاحة');
  closeModal();
  toast('✅ تم حفظ الموقع الجديد');
  setTimeout(initFieldMap, 300);
}

function addMyLocationToMap(){
  if(!navigator.geolocation || !_map) return;
  navigator.geolocation.getCurrentPosition(pos=>{
    const lat=pos.coords.latitude, lng=pos.coords.longitude;
    const myIcon = L.divIcon({
      html:`<div style="width:20px;height:20px;background:#0084ff;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 4px rgba(0,132,255,.3)"></div>`,
      className:'', iconSize:[20,20], iconAnchor:[10,10]
    });
    if(_myLocationMarker){ _myLocationMarker.remove(); }
    _myLocationMarker = L.marker([lat,lng],{icon:myIcon,zIndexOffset:1000})
      .addTo(_map)
      .bindPopup(`<div style="text-align:center;font-family:inherit">
        <div style="font-size:18px">📍 موقعك الحالي</div>
        <div style="font-size:12px;color:#666;direction:ltr">${lat.toFixed(6)}, ${lng.toFixed(6)}</div>
        <div style="font-size:12px;color:#666">الدقة: ±${Math.round(pos.coords.accuracy)}م</div>
      </div>`);

    // دائرة دقة الموقع
    L.circle([lat,lng],{
      radius: pos.coords.accuracy,
      color:'#0084ff', fillColor:'#0084ff', fillOpacity:0.08, weight:1.5, dashArray:'5,5'
    }).addTo(_map);

    // زر للتوجه لموقعي
    const locBtn = document.getElementById('btn-my-loc');
    if(locBtn){
      locBtn.style.opacity='1';
      locBtn.onclick=()=>_map.flyTo([lat,lng],19,{duration:1});
    }
  }, ()=>{}, {enableHighAccuracy:true, timeout:8000});
}

function addDistanceMeasureTool(){
  if(!_map) return;
  _map.on('click', e=>{
    if(!_measuringMode) return;
    _measurePoints.push(e.latlng);
    L.circleMarker(e.latlng,{radius:5,color:'#ff6b00',fillColor:'#ff6b00',fillOpacity:1}).addTo(_map);

    if(_measurePoints.length>1){
      const p1=_measurePoints[_measurePoints.length-2];
      const p2=_measurePoints[_measurePoints.length-1];
      const line=L.polyline([p1,p2],{color:'#ff6b00',weight:2.5,dashArray:'6,4'}).addTo(_map);
      _measureLines.push(line);
      const dist=_map.distance(p1,p2);
      const total=_measurePoints.reduce((s,_,i)=>i===0?0:s+_map.distance(_measurePoints[i-1],_measurePoints[i]),0);
      const midLat=(p1.lat+p2.lat)/2, midLng=(p1.lng+p2.lng)/2;
      L.marker([midLat,midLng],{
        icon:L.divIcon({
          html:`<div style="background:#ff6b00;color:#fff;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:700;white-space:nowrap;font-family:inherit">${dist<1000?Math.round(dist)+'م':( dist/1000).toFixed(2)+'كم'}</div>`,
          className:'', iconAnchor:[30,10]
        }), interactive:false
      }).addTo(_map);
      if(_measurePoints.length>2){
        const totLbl=document.getElementById('measure-total');
        if(totLbl) totLbl.textContent='المجموع: '+(total<1000?Math.round(total)+'م':(total/1000).toFixed(2)+'كم');
      }
    }
  });
}

function toggleMeasure(){
  _measuringMode = !_measuringMode;
  const btn=document.getElementById('btn-measure');
  if(btn){
    btn.style.background = _measuringMode?'#ff6b00':'var(--sf)';
    btn.style.color = _measuringMode?'#fff':'var(--tx)';
    btn.title = _measuringMode?'إيقاف القياس (انقر لإضافة نقاط)':'قياس المسافة';
  }
  const lbl=document.getElementById('measure-total');
  if(lbl) lbl.style.display = _measuringMode?'inline':'none';
  if(!_measuringMode){
    // مسح خطوط القياس
    _measureLines.forEach(l=>l.remove());
    _measureLines=[]; _measurePoints=[];
    const totLbl=document.getElementById('measure-total');
    if(totLbl) totLbl.textContent='';
  }
  if(_map) _map.getContainer().style.cursor = _measuringMode?'crosshair':'';
  toast(_measuringMode?'📏 وضع القياس — انقر على الخريطة لإضافة نقاط':'تم إيقاف القياس');
}

function fmFlyTo(lat,lng,mid){
  if(!_map) return;
  _map.flyTo([lat,lng],19,{duration:1.2});
  const m=_markers.find(x=>x.id===mid);
  if(m) setTimeout(()=>m.marker.openPopup(),1300);
}
function fmFitAll(){
  if(!_map) return;
  if(_markers.length){
    const g=L.featureGroup(_markers.map(m=>m.marker));
    _map.fitBounds(g.getBounds().pad(0.2));
  } else { _map.setView([33.3152,44.3661],7); }
}

function saveFieldSite(fsId){
  const nm=val('fsn'); if(!nm){ toast('أدخل اسم الموقع','err'); return; }
  const warehouse = val('fs-warehouse')||'';
  const allowedUsers = DB.users
    .filter(u=>u.role!=='manager')
    .map(u=>u.uid||u.id)
    .filter(uid=>document.getElementById('fsu_'+uid)?.checked);

  if(fsId){
    fbUpdate('fieldSites/'+fsId,{name:nm, desc:val('fsd'), warehouse, allowedUsers});
    toast('✅ تم التحديث');
  } else {
    const id=gid();
    fbSet('fieldSites/'+id,{id,name:nm,desc:val('fsd'),cameras:{},allowedUsers,warehouse});
    pushN('📍 موقع ميداني جديد: '+nm);
    toast('✅ تم إضافة الموقع');
  }
  closeModal();
}
function delFieldSite(fsId){
  const fs=DB.fieldSites.find(x=>x.id===fsId);
  if(!fs) return;
  const camCount = fs.cameras ? fs.cameras.length : 0;

function setBeamAngle(deg){
  const sl = document.getElementById('fcba');
  const lbl = document.getElementById('fcba_v');
  if(sl){ sl.value = deg; }
  if(lbl){ lbl.textContent = deg + (deg===360?' 🔄':'') + '°'; }
  // تحديث البوصلة لإظهار القوس الجديد
  const canvas = document.getElementById('compass-canvas');
  if(canvas && window._compassDraw) window._compassDraw();
}

function onBeamAngleChange(val){
  const lbl = document.getElementById('fcba_v');
  const v = parseInt(val);
  if(lbl){ lbl.textContent = v + (v===360?' 🔄':'') + '°'; }
  if(window._compassDraw) window._compassDraw();
}

function doSaveBoundary(){
  const name  = val('boundary-name')||'حدود '+fmtDate(new Date().toISOString());

function clearBoundaryDraw(){
  _boundaryMarkers.forEach(m=>m.remove()); _boundaryMarkers=[];
  if(_boundaryLine){ _boundaryLine.remove(); _boundaryLine=null; }
  _boundaryPoints=[];

function loadBoundaries(){
  if(!_map) return;
  if(!window._layerGroups) return;
  const lg = window._layerGroups.boundaries;
  lg.clearLayers();
  FBDB.ref('cctv/boundaries').once('value').then(snap=>{
    if(!snap.val()) return;
    Object.values(snap.val()).forEach(b=>{
      if(!b.points||b.points.length<3) return;
      const poly = L.polygon(b.points,{
        color:b.color||'#f85149', fillColor:b.color||'#f85149',
        fillOpacity:0.1, weight:2.5
      }).bindPopup(`<div style="font-family:inherit">
          <div style="font-weight:700;margin-bottom:4px">${esc(b.name)}</div>
          <div style="font-size:12px;color:#666">بواسطة: ${esc(b.by||'')} — ${esc(b.date||'')}</div>

          </div>`:''}
        </div>`);
      lg.addLayer(poly);
    });
  });
}

// ── استيراد KML ──
function importKML(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const parser = new DOMParser();
      const kml = parser.parseFromString(e.target.result, 'text/xml');
      const placemarks = kml.querySelectorAll('Placemark');
      if(!placemarks.length){ toast('لا بيانات في الملف','err'); return; }

      let added=0;
      placemarks.forEach(pm=>{
        const name = pm.querySelector('name')?.textContent||'نقطة';
        // نقاط Point
        const coord = pm.querySelector('Point coordinates')?.textContent?.trim();
        if(coord){
          const [lng,lat] = coord.split(',').map(Number);
          if(!isNaN(lat)&&!isNaN(lng)){
            const icon = L.divIcon({
              html:`<div style="background:#bc8cff;border:2px solid #fff;border-radius:50%;width:14px;height:14px;box-shadow:0 2px 4px rgba(0,0,0,.4)"></div>`,
              className:'', iconSize:[14,14], iconAnchor:[7,7]
            });
            L.marker([lat,lng],{icon}).addTo(_map)
              .bindPopup(`<div style="font-family:inherit"><b>${esc(name)}</b></div>`);
            added++;
          }
        }
        // خطوط LineString
        const lineCoords = pm.querySelector('LineString coordinates')?.textContent?.trim();
        if(lineCoords){
          const pts = lineCoords.split(/\s+/).map(c=>{ const[lg,lt]=c.split(',').map(Number); return [lt,lg]; }).filter(p=>!isNaN(p[0]));
          if(pts.length>1){
            L.polyline(pts,{color:'#bc8cff',weight:2.5}).addTo(_map)
              .bindPopup(`<b>${esc(name)}</b>`);
            added++;
          }
        }
        // مضلعات Polygon
        const polyCoords = pm.querySelector('Polygon outerBoundaryIs coordinates')?.textContent?.trim()
          || pm.querySelector('Polygon coordinates')?.textContent?.trim();
        if(polyCoords){
          const pts = polyCoords.split(/\s+/).map(c=>{ const[lg,lt]=c.split(',').map(Number); return [lt,lg]; }).filter(p=>!isNaN(p[0]));
          if(pts.length>2){
            L.polygon(pts,{color:'#bc8cff',fillColor:'#bc8cff',fillOpacity:0.1,weight:2}).addTo(_map)
              .bindPopup(`<b>${esc(name)}</b>`);
            added++;
          }
        }
      });
      toast('✅ تم استيراد '+added+' عنصر من KML');
    }catch(err){
      toast('❌ خطأ في قراءة الملف: '+err.message,'err');
    }
  };
  reader.readAsText(file);
  input.value='';
}

    +'<div style="font-size:12px;color:var(--mt)">سيتم رسم الكاميرات والشعاع والحدود على الصورة</div>');
}

function doExportMap(type){
  toast('📸 جار رسم الخريطة...','warn');
  window._exportTileType = type;

  const center  = _map.getCenter();
  const zoom    = Math.min(_map.getZoom(), 18);
  const size    = _map.getSize();
  const W       = size.x, H = size.y;
  const canvas  = document.createElement('canvas');
  canvas.width  = W * 2;
  canvas.height = H * 2;
  const ctx     = canvas.getContext('2d');
  ctx.scale(2, 2);

  // حساب النطاق الجغرافي للخريطة
  const bounds = _map.getBounds();
  const nw = bounds.getNorthWest();
  const se = bounds.getSouthEast();

  // دالة تحويل إحداثيات جغرافية → pixel
  const latlngToXY = (lat, lng) => {
    const x = (lng - nw.lng) / (se.lng - nw.lng) * W;
    const y = (nw.lat - lat) / (nw.lat - se.lat) * H;
    return [x, y];
  };

  // تحميل tiles من OSM (مسموح للاستخدام)
  const tileSize = 256;
  const numTiles = Math.pow(2, zoom);
  const toTile = (lat, lng) => {
    const x = Math.floor((lng + 180) / 360 * numTiles);
    const latR = lat * Math.PI / 180;
    const y = Math.floor((1 - Math.log(Math.tan(latR) + 1/Math.cos(latR)) / Math.PI) / 2 * numTiles);
    return {x, y};
  };

  const nwTile = toTile(nw.lat, nw.lng);
  const seTile = toTile(se.lat, se.lng);

  // حساب offset للـ tile الأول
  const nwExact = {
    x: (nw.lng + 180) / 360 * numTiles,
    y: (1 - Math.log(Math.tan(nw.lat*Math.PI/180) + 1/Math.cos(nw.lat*Math.PI/180))/Math.PI)/2 * numTiles
  };
  const tileOffsetX = (nwExact.x - nwTile.x) * tileSize;
  const tileOffsetY = (nwExact.y - nwTile.y) * tileSize;
  const scaleX = W / ((seTile.x - nwTile.x + 1) * tileSize);
  const scaleY = H / ((seTile.y - nwTile.y + 1) * tileSize);

  // خلفية
  ctx.fillStyle = '#1a2332';
  ctx.fillRect(0, 0, W, H);

  let tilesTotal = 0, tilesLoaded = 0;
  const tilesArr = [];

  for(let tx = nwTile.x; tx <= seTile.x + 1; tx++){
    for(let ty = nwTile.y; ty <= seTile.y + 1; ty++){
      tilesTotal++;
      const px = (tx - nwTile.x) * tileSize * scaleX - tileOffsetX * scaleX;
      const py = (ty - nwTile.y) * tileSize * scaleY - tileOffsetY * scaleY;
      tilesArr.push({tx, ty, px, py});
    }
  }

  let _drawAllCalled = false;
  const drawAll = () => {
    if(_drawAllCalled) return; _drawAllCalled = true;
    // اجمع الكاميرات من _markers أو من DB مباشرة
    const cams = [];
    if(window._markers && _markers.length){
      _markers.forEach(m=>{ if(m.cam && m.marker) cams.push({cam:m.cam, ll:m.marker.getLatLng()}); });
    }
    // إذا فارغ — اجمع من DB
    if(!cams.length && DB.fieldSites){
      DB.fieldSites.forEach(fs=>{
        (fs.cameras||[]).forEach(c=>{
          if(c.lat&&c.lng&&!isNaN(parseFloat(c.lat))){
            cams.push({cam:c, ll:{lat:parseFloat(c.lat),lng:parseFloat(c.lng)}});
          }
        });
      });
    }

    // ارسم الشعاع لكل كاميرا
    cams.forEach(({cam:c, ll})=>{
        const [cx,cy] = latlngToXY(ll.lat, ll.lng);
        const stColor = getCamDisplayColor(c);
        const angle   = parseFloat(c.beamAngle)||70;
        const rot     = parseFloat(c.beamRot)||0;
        const viewDist= parseFloat(c.viewDist)||50;

        // حساب طول الشعاع بالـ pixels
        const mPerLat = 111320;
        const mPerLng = 111320 * Math.cos(ll.lat * Math.PI/180);
        const [ex,ey] = latlngToXY(ll.lat + viewDist/mPerLat, ll.lng);
        const beamPx  = Math.abs(ey - cy);

        if(angle >= 358){
          ctx.beginPath();
          ctx.arc(cx, cy, beamPx, 0, Math.PI*2);
          ctx.fillStyle = stColor+'25';
          ctx.strokeStyle = stColor+'90';
          ctx.lineWidth = 1.5;
          ctx.fill(); ctx.stroke();
        } else {
          const halfRad = (angle/2) * Math.PI/180;
          const rotRad  = (rot - 90) * Math.PI/180;
          const steps   = 20;
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          for(let i=0; i<=steps; i++){
            const theta = rotRad - halfRad + (i/steps)*2*halfRad;
            ctx.lineTo(cx + beamPx*Math.cos(theta), cy + beamPx*Math.sin(theta));
          }
          ctx.closePath();
          ctx.fillStyle = stColor+'25';
          ctx.strokeStyle = stColor+'90';
          ctx.lineWidth = 1.5;
          ctx.fill(); ctx.stroke();
        }

        // أيقونة الكاميرا
        ctx.fillStyle = stColor;
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(cx-8,cy-5,16,10,3) : ctx.rect(cx-8,cy-5,16,10);
        ctx.fill();
        ctx.fillStyle='#ffffff60';
        ctx.beginPath(); ctx.arc(cx-1,cy,3,0,Math.PI*2); ctx.fill();

        // اسم
        const name = c.name||c.serial||'';
        if(name){
          ctx.font = 'bold 10px Arial';
          ctx.fillStyle = '#fff';
          ctx.textAlign = 'center';
          ctx.shadowColor='#000'; ctx.shadowBlur=3;
          ctx.fillText(name, cx, cy+16);
          ctx.shadowBlur=0;
        }
    });

    // ارسم الحدود المحفوظة
    if(window._boundaryLayers){
      window._boundaryLayers.forEach(poly=>{
        if(!poly.getLatLngs) return;
        const latlngs = poly.getLatLngs()[0];
        if(!latlngs||!latlngs.length) return;
        const color = poly.options.color||'#f85149';
        ctx.beginPath();
        latlngs.forEach((ll,i)=>{
          const [x,y] = latlngToXY(ll.lat, ll.lng);
          i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
        });
        ctx.closePath();
        ctx.fillStyle = color+'20';
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.fill(); ctx.stroke();
      });
    }

    // overlay
    ctx.fillStyle='rgba(0,0,0,0.6)';
    ctx.fillRect(0,H-40,W,40);
    ctx.fillStyle='#fff';
    ctx.font='bold 13px Arial';
    ctx.textAlign='right';
    const site = typeof _FSITE!=='undefined'&&_FSITE?(DB.fieldSites.find(s=>s.id===_FSITE)?.name||''):'';
    ctx.fillText('CCTV Manager'+(site?' — '+site:''), W-10, H-22);
    ctx.font='11px Arial'; ctx.fillStyle='#aaa';
    ctx.fillText(fmtDateTime(new Date().toISOString()), W-10, H-8);

    // ── رسم مفتاح الخريطة (Legend) على الصورة المصدَّرة ──
    drawLegendOnCanvas(ctx, W, H);

    // تصدير
    ctx.setTransform(1,0,0,1,0,0);
    const link = document.createElement('a');
    link.download = 'خريطة_'+(site||'CCTV')+'_'+Date.now()+'.png';
    link.href = canvas.toDataURL('image/png',1.0);
    link.click();
    toast('✅ تم تصدير الخريطة');
  };

  // تحميل الـ tiles
  tilesArr.forEach(({tx,ty,px,py})=>{
    const img = new Image();
    img.crossOrigin='anonymous';
    img.onload = ()=>{
      ctx.drawImage(img, px, py, tileSize*scaleX, tileSize*scaleY);
      tilesLoaded++;
      if(tilesLoaded >= tilesTotal) drawAll();
    };
    img.onerror = ()=>{ tilesLoaded++; if(tilesLoaded>=tilesTotal) drawAll(); };
    const tileX = ((tx % numTiles) + numTiles) % numTiles;
    // اختيار نوع الخريطة
    if(window._exportTileType === 'osm'){
      img.src = 'https://tile.openstreetmap.org/'+zoom+'/'+tileX+'/'+ty+'.png';
    } else if(window._exportTileType === 'hybrid'){
      img.src = 'https://mt1.google.com/vt/lyrs=y&x='+tileX+'&y='+ty+'&z='+zoom;
    } else {
      // satellite — Google
      img.src = 'https://mt1.google.com/vt/lyrs=s&x='+tileX+'&y='+ty+'&z='+zoom;
    }
  });

  // timeout احتياطي
  setTimeout(()=>{ if(tilesLoaded<tilesTotal){ tilesLoaded=tilesTotal; drawAll(); } }, 5000);
}

function doLeafletImageExport(){

}


// رسم مفتاح الخريطة (Legend) على canvas التصدير — نسخة مطابقة لمحتوى الـ Legend الحي
function drawLegendOnCanvas(ctx, W, H){
  const rows = [];
  FLOOR_TYPES.forEach(function(f){ rows.push({color:f.color, label:f.label}); });
  rows.push({color:'#d29922', label:'🔧 صيانة'});
  rows.push({color:'#8b949e', label:'⚪ معطل / مجهول'});
  rows.push({color:'#f85149', label:'⚠️ يحتاج ضبط موقع'});

  const equipRows = [
    {icon:'🗼', label:'برج'}, {icon:'📡', label:'رابط P2P'},
    {icon:'📻', label:'جهاز راديو'}, {icon:'💾', label:'NVR'}
  ];

  const boxW = 175;
  const rowH = 16;
  const headerH = 22;
  const sectionGap = 18;
  const boxH = headerH + (rows.length*rowH) + sectionGap + (equipRows.length*rowH) + 14;
  const boxX = 10, boxY = H - boxH - 50; // فوق شريط العنوان السفلي بقليل

  // خلفية الصندوق
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.strokeStyle = '#d0d7de';
  ctx.lineWidth = 1;
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(boxX, boxY, boxW, boxH, 8); else ctx.rect(boxX, boxY, boxW, boxH);
  ctx.fill(); ctx.stroke();

  ctx.textAlign = 'right';
  let cy = boxY + 16;

  // العنوان
  ctx.fillStyle = '#1f2328';
  ctx.font = 'bold 12px Arial';
  ctx.fillText('🗝️ مفتاح الخريطة', boxX+boxW-10, cy);
  cy += headerH-4;

  // صفوف الكاميرات
  ctx.font = '10px Arial';
  rows.forEach(function(r){
    ctx.fillStyle = r.color;
    ctx.beginPath();
    ctx.arc(boxX+boxW-12, cy-4, 5, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#333';
    ctx.fillText(r.label, boxX+boxW-24, cy);
    cy += rowH;
  });

  cy += 4;
  ctx.font = 'bold 9px Arial';
  ctx.fillStyle = '#666';
  ctx.fillText('🗼 معدات أخرى', boxX+boxW-10, cy);
  cy += rowH;

  ctx.font = '10px Arial';
  equipRows.forEach(function(r){
    ctx.fillStyle = '#333';
    ctx.fillText(r.icon+' '+r.label, boxX+boxW-10, cy);
    cy += rowH;
  });
}

function finishExport(canvas){
  const ctx = canvas.getContext('2d');
  const mapContainer = _map.getContainer();
  const mapRect = mapContainer.getBoundingClientRect();
  const scaleX = canvas.width  / mapRect.width;
  const scaleY = canvas.height / mapRect.height;

  // ارسم الكاميرات يدوياً على الـ canvas
  if(window._markers && _markers.length){
    _markers.forEach(m=>{
      const latlng = m.marker.getLatLng();
      const pt = _map.latLngToContainerPoint(latlng);
      const x = pt.x * scaleX;
      const y = pt.y * scaleY;
      const c = m.cam;
      const stColor = getCamDisplayColor(c);
      const angle   = parseFloat(c.beamAngle)||70;
      const rot     = parseFloat(c.beamRot)||0;
      const viewDist= parseFloat(c.viewDist)||50;

      // رسم الشعاع
      if(angle < 358){
        const mPerLat = 111320;
        const mPerLng = 111320 * Math.cos(latlng.lat * Math.PI/180);
        const halfRad = (angle/2) * Math.PI/180;
        const rotRad  = rot * Math.PI/180;
        const steps   = 24;

        // حوّل نقطة الطرف لـ pixel
        const getPt = (theta) => {
          const dLat = (viewDist * Math.cos(theta)) / mPerLat;
          const dLng = (viewDist * Math.sin(theta)) / mPerLng;
          const p = _map.latLngToContainerPoint([latlng.lat+dLat, latlng.lng+dLng]);
          return [p.x * scaleX, p.y * scaleY];
        };

        ctx.beginPath();
        ctx.moveTo(x, y);
        for(let i=0; i<=steps; i++){
          const theta = rotRad - halfRad + (i/steps)*2*halfRad;
          const [px,py] = getPt(theta);
          i===0 ? ctx.lineTo(px,py) : ctx.lineTo(px,py);
        }
        ctx.closePath();
        ctx.fillStyle   = stColor+'33';
        ctx.strokeStyle = stColor+'bb';
        ctx.lineWidth   = 1.5 * scaleX;
        ctx.fill();
        ctx.stroke();
      } else {
        // PTZ 360°
        const edgePt = _map.latLngToContainerPoint([latlng.lat + viewDist/111320, latlng.lng]);
        const r = Math.abs(edgePt.y - _map.latLngToContainerPoint(latlng).y) * scaleY;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI*2);
        ctx.fillStyle   = stColor+'22';
        ctx.strokeStyle = stColor+'88';
        ctx.lineWidth   = 1.5;
        ctx.fill();
        ctx.stroke();
      }

      // رسم أيقونة الكاميرا
      const r = 10 * scaleX;
      ctx.fillStyle = stColor;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(x-r, y-r*0.7, r*2, r*1.4, r*0.3)
                    : ctx.rect(x-r, y-r*0.7, r*2, r*1.4);
      ctx.fill();

      // عدسة
      ctx.fillStyle = '#ffffff88';
      ctx.beginPath();
      ctx.arc(x-r*0.2, y, r*0.4, 0, Math.PI*2);
      ctx.fill();

      // اسم الكاميرا
      const name = c.name||c.serial||'';
      if(name){
        ctx.font = `bold ${Math.round(11*scaleX)}px Arial`;
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = 3;
        ctx.fillText(name, x, y + r*1.8);
        ctx.shadowBlur = 0;
      }
    });
  }

  // overlay معلومات في الأسفل
  const site = typeof _FSITE !== 'undefined' && _FSITE
    ? (DB.fieldSites.find(s=>s.id===_FSITE)?.name||'')
    : '';
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(0, canvas.height-56, canvas.width, 56);
  ctx.fillStyle = '#ffffff';
  ctx.font = `bold ${Math.round(18*scaleX)}px Arial`;
  ctx.textAlign = 'right';
  ctx.fillText('CCTV Manager' + (site?' — '+site:''), canvas.width-16, canvas.height-28);
  ctx.font = `${Math.round(13*scaleX)}px Arial`;
  ctx.fillStyle = '#aaaaaa';
  ctx.fillText(fmtDateTime(new Date().toISOString()), canvas.width-16, canvas.height-10);

  const link = document.createElement('a');
  link.download = 'خريطة_' + (site||'CCTV') + '_' + Date.now() + '.png';
  link.href = canvas.toDataURL('image/png', 1.0);
  link.click();
  toast('✅ تم تصدير الخريطة مع الكاميرات');
}

let _faultMarkers = [];
let _faultsLayerOn = false;

function toggleFaultsLayer(){
  _faultsLayerOn = !_faultsLayerOn;
  const btn = document.getElementById('btn-faults-layer');
  if(btn){
    btn.style.background = _faultsLayerOn ? '#f8514922' : 'var(--sf)';
    btn.style.color = _faultsLayerOn ? '#f85149' : 'var(--tx)';
    btn.style.borderColor = _faultsLayerOn ? '#f8514944' : 'var(--br)';
  }
  if(_faultsLayerOn) showFaultsOnMap();
  else {
    if(window._layerGroups?.faults) window._layerGroups.faults.clearLayers();
    _faultMarkers=[];
  }
}

function showFaultsOnMap(){
  if(!_map||!window._layerGroups) return;
  const lg = window._layerGroups.faults;
  lg.clearLayers(); _faultMarkers=[];
  const activeFaults = getVisibleFaults().filter(f=>f.status!=='resolved');
  activeFaults.forEach(f=>{
    const site = DB.fieldSites.find(s=>s.id===f.fieldSiteId||s.name===f.location);
    if(!site) return;
    const cam = site.cameras?.find(c=>c.name===f.pointId||c.serial===f.camSN);
    const lat = cam?.lat ? parseFloat(cam.lat) : null;
    const lng = cam?.lng ? parseFloat(cam.lng) : null;
    if(!lat||!lng||isNaN(lat)||isNaN(lng)) return;
    const pri = f.priority==='high'?'#f85149':f.priority==='medium'?'#d29922':'#58a6ff';
    const icon = L.divIcon({
      html:`<div onclick="go('faults')" style="width:22px;height:22px;background:${pri};border:3px solid #fff;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.4);cursor:pointer;animation:pulse 1.5s infinite"></div>`,
      className:'', iconSize:[22,22], iconAnchor:[11,11]
    });
    const m = L.marker([lat,lng],{icon,zIndexOffset:900})
      .bindPopup(`<div style="font-family:inherit;min-width:160px">
        <div style="font-weight:700;color:${pri};margin-bottom:4px">${f.priority==='high'?'🔴 عاجل':'🟡 متوسط'}</div>
        <div style="font-weight:700">${esc(f.location)}</div>
        <div style="font-size:12px;color:#666">${esc(f.pointId)}</div>
        <div style="font-size:12px;margin-top:4px">${esc(f.reason)}</div>
      </div>`);
    lg.addLayer(m);
    _faultMarkers.push(m);
  });
  if(_faultMarkers.length===0) toast('لا أعطال نشطة لها إحداثيات','warn');
  else toast('🔴 '+_faultMarkers.length+' عطل على الخريطة');
}

function initCompass(){
  const canvas = document.getElementById('compass-canvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  let dragging = false;
  let _rot = parseFloat(document.getElementById('fcbr')?.value)||0;

  const dirNames = ['شمال','شمال شرق','شرق','جنوب شرق','جنوب','جنوب غرب','غرب','شمال غرب'];

  function drawCompass(deg){
    const W=160,H=160,cx=80,cy=80,R=72;
    ctx.clearRect(0,0,W,H);
    const grad=ctx.createRadialGradient(cx,cy,10,cx,cy,R);
    grad.addColorStop(0,'#1a2332'); grad.addColorStop(1,'#0d1117');
    ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2);
    ctx.fillStyle=grad; ctx.fill();
    ctx.strokeStyle='#30363d'; ctx.lineWidth=2; ctx.stroke();
    for(let i=0;i<360;i+=10){
      const a=(i-90)*Math.PI/180;
      const inner=i%90===0?R-18:i%45===0?R-14:R-9;
      ctx.beginPath();
      ctx.moveTo(cx+inner*Math.cos(a), cy+inner*Math.sin(a));
      ctx.lineTo(cx+(R-3)*Math.cos(a), cy+(R-3)*Math.sin(a));
      ctx.strokeStyle=i%90===0?'#58a6ff':i%45===0?'#8b949e':'#30363d';
      ctx.lineWidth=i%90===0?2:1; ctx.stroke();
    }
    const lblMap={0:'N',90:'E',180:'S',270:'W'};
    [0,90,180,270].forEach(a=>{
      const rad=(a-90)*Math.PI/180;
      const lx=cx+(R-28)*Math.cos(rad), ly=cy+(R-28)*Math.sin(rad);
      ctx.fillStyle=a===0?'#f85149':'#58a6ff';
      ctx.font='bold 13px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(lblMap[a],lx,ly);
    });
    const needleRad=(deg-90)*Math.PI/180;
    ctx.beginPath(); ctx.moveTo(cx,cy);
    ctx.lineTo(cx-(R-22)*Math.cos(needleRad), cy-(R-22)*Math.sin(needleRad));
    ctx.strokeStyle='#7d8590'; ctx.lineWidth=3; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx,cy);
    ctx.lineTo(cx+(R-14)*Math.cos(needleRad), cy+(R-14)*Math.sin(needleRad));
    ctx.strokeStyle='#f85149'; ctx.lineWidth=3; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx,cy,5,0,Math.PI*2);
    ctx.fillStyle='#fff'; ctx.fill();
    const beamAngle=parseFloat(document.getElementById('fcba')?.value)||70;
    if(beamAngle>=358){
      // PTZ 360° — دائرة كاملة في البوصلة
      ctx.beginPath(); ctx.arc(cx,cy,R-6,0,Math.PI*2);
      ctx.fillStyle='rgba(188,140,255,0.15)';
      ctx.strokeStyle='#bc8cff'; ctx.lineWidth=1.5;
      ctx.fill(); ctx.stroke();
      // نص PTZ
      ctx.fillStyle='#bc8cff'; ctx.font='bold 11px sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('PTZ 360°',cx,cy+20);
    } else {
      const half=(beamAngle/2)*Math.PI/180;
      const bRad=(deg-90)*Math.PI/180;
      ctx.beginPath(); ctx.moveTo(cx,cy);
      ctx.arc(cx,cy,R-6,bRad-half,bRad+half);
      ctx.closePath();
      ctx.fillStyle='rgba(88,166,255,0.15)';
      ctx.strokeStyle='#58a6ff'; ctx.lineWidth=1.5;
      ctx.fill(); ctx.stroke();
    }
  }

  function updateLabel(deg){
    const d=((deg%360)+360)%360;
    const el=document.getElementById('compass-deg-label');
    const dl=document.getElementById('compass-dir-label');
    const hi=document.getElementById('fcbr');
    if(el) el.textContent=Math.round(deg)+'°';
    if(dl) dl.textContent=dirNames[Math.round(d/45)%8];
    if(hi) hi.value=Math.round(deg);
  }

  function angleFromCenter(e){
    const rect=canvas.getBoundingClientRect();
    const ex=e.touches?e.touches[0].clientX:e.clientX;
    const ey=e.touches?e.touches[0].clientY:e.clientY;
    return Math.atan2(ex-rect.left-80,-(ey-rect.top-80))*180/Math.PI;
  }

  canvas.addEventListener('mousedown',  ()=>{ dragging=true; canvas.style.cursor='grabbing'; });
  canvas.addEventListener('mousemove',  e=>{ if(!dragging) return; _rot=angleFromCenter(e); drawCompass(_rot); updateLabel(_rot); });
  canvas.addEventListener('mouseup',    ()=>{ dragging=false; canvas.style.cursor='grab'; });
  canvas.addEventListener('mouseleave', ()=>{ dragging=false; canvas.style.cursor='grab'; });
  canvas.addEventListener('touchstart', e=>{ dragging=true; e.preventDefault(); },{passive:false});
  canvas.addEventListener('touchmove',  e=>{ if(!dragging) return; e.preventDefault(); _rot=angleFromCenter(e); drawCompass(_rot); updateLabel(_rot); },{passive:false});
  canvas.addEventListener('touchend',   ()=>{ dragging=false; });

  window.setCompass = function(deg){ _rot=parseFloat(deg); drawCompass(_rot); updateLabel(_rot); };

  const fcba=document.getElementById('fcba');
  if(fcba) fcba.addEventListener('input',()=>drawCompass(_rot));

  drawCompass(_rot);
  updateLabel(_rot);
}

function saveFieldCam(fsId,ci){
  const nm=val('fcnm');
  if(!nm){ toast('أدخل اسم الكاميرا','err'); return; }
  // فحص خلفي إجباري (طبقة حماية إضافية، بغض النظر عن حالة الزر بالواجهة)
  let installChecklist = null;
  if(ci<0){
    const ids = ['chk-mount','chk-cable','chk-test','chk-photo'];
    const allChecked = ids.every(function(id){
      const el = document.getElementById(id);
      return el && el.checked;
    });
    if(!allChecked){ toast('⚠️ أكمل كل بنود قائمة التحقق أولاً','err'); return; }
    installChecklist = {
      mounted:true, wired:true, tested:true, photographed:true,
      confirmedBy: CU.name, confirmedAt: ts()
    };
  }
  const fs=DB.fieldSites.find(x=>x.id===fsId); if(!fs) return;
  const cam={
    id:(ci>=0&&fs.cameras[ci]?.id)||gid(),
    name:nm, serial:val('fcsr'), camType:val('fccT'), res:val('fcrs'),
    angle:val('fcan'), model:val('fcmd'), mfr:val('fcmf'), ip:val('fcip'),
    installDesc:val('fcdc'), dir:val('fcdir'), status:val('fcst'),
    floor:val('fcfloor')||'',
    lat:val('fclat'), lng:val('fclng'),
    beamAngle:$('fcba')?.value||70, beamRot:$('fcbr')?.value||0, viewDist:parseFloat($('fcvd')?.value)||50,
    addedBy:CU.name, addedAt:(ci>=0&&fs.cameras[ci]?.addedAt)||ts(),
    installChecklist: installChecklist || (fs.cameras[ci]?.installChecklist||null),
    fromWarehouse: false
  };
  // احفظ الكاميرا في مكانها الصحيح في الـ array
  if(ci>=0){
    fs.cameras[ci] = cam;
  } else {
    fs.cameras.push(cam);
  }
  const camsObj = {};
  fs.cameras.forEach((c,i)=>{ camsObj[i]=c; });
  FBDB.ref('cctv/fieldSites/'+fsId+'/cameras').set(camsObj);
  pushFieldN('📷 '+(ci>=0?'تعديل':'إضافة')+' كاميرا: '+nm+' ← '+fs.name, fsId);
  closeModal(); toast(ci>=0?'تم التعديل':'تم الإضافة');
}

function delFieldCam(fsId,ci){
  const fs=DB.fieldSites.find(x=>x.id===fsId);
  if(!fs||!confirm('حذف الكاميرا نهائياً؟')) return;
  // احذف من الـ array محلياً
  fs.cameras.splice(ci,1);
  // أعد حفظ الـ array كاملاً في Firebase
  const camsObj = {};
  fs.cameras.forEach((c,i)=>{ camsObj[i]=c; });
  FBDB.ref('cctv/fieldSites/'+fsId+'/cameras').set(
    fs.cameras.length ? camsObj : null
  );
  logAct('حذف كاميرا', fs.name);
  toast('✅ تم الحذف');
  closeModal();
  setTimeout(initFieldMap, 300);
}

      oninput="doSearch(this.value)" autofocus>

  </div>`;

function doSearch(q){
  if(!q||q.length<2){ $('srch-res').innerHTML='<div style="text-align:center;color:var(--mt);padding:30px">أدخل كلمتين على الأقل</div>'; return; }
  q=q.toLowerCase();
  const res=[];

  // البحث في المخزن — فقط المواقع المصرح بها
  const visibleSites = getVisibleSites();
  visibleSites.forEach(site=>{
    (DB.inv[site]||[]).forEach(it=>{
      if([it.name,it.serial,it.type,it.currentSite].some(x=>x&&x.toLowerCase().includes(q))){
        res.push({type:'inv',icon:'📦',title:it.name,sub:it.type+' — '+it.currentSite,badge:it.status,id:it.id});
      }
    });
  });

  // البحث في الأعطال — فقط المصرح بها
  getVisibleFaults().forEach(f=>{
    if([f.location,f.pointId,f.reason,f.desc,f.by].some(x=>x&&x.toLowerCase().includes(q))){
      res.push({type:'fault',icon:'⚠️',title:f.location+' — '+f.pointId,sub:f.reason,badge:f.status,id:f.id});
    }
  });

  // البحث في الحركات — فقط إذا لديه صلاحية moves
  if(p('moves')){
    DB.moves.forEach(m=>{
      if([m.name,m.from,m.to,m.by].some(x=>x&&x.toLowerCase().includes(q))){
        res.push({type:'move',icon:'🔄',title:m.name,sub:m.from+' ← '+m.to,badge:m.date,id:m.id});
      }
    });
  }

  // البحث في الفواتير — فقط إذا لديه صلاحية invoices
  if(p('invoices')){
    DB.invoices.forEach(inv=>{
      if([inv.supplier,inv.num,inv.site,inv.notes].some(x=>x&&x.toLowerCase().includes(q))){
        res.push({type:'invoice',icon:'🧾',title:inv.supplier,sub:'فاتورة رقم: '+inv.num,badge:inv.date,id:inv.id});
      }
    });
  }

  // البحث في المواقع الميدانية — فقط المصرح بها
  getVisibleFieldSites().forEach(fs=>{
    if(fs.name.toLowerCase().includes(q)||fs.desc?.toLowerCase().includes(q)){
      res.push({type:'field',icon:'📍',title:fs.name,sub:fs.desc||'',badge:fs.cameras.length+' كاميرا',id:fs.id});
    }
    fs.cameras.forEach(c=>{
      if([c.name,c.serial,c.model,c.ip].some(x=>x&&x.toLowerCase().includes(q))){
        res.push({type:'cam',icon:'📷',title:c.name,sub:fs.name+' — '+c.serial,badge:c.status,id:c.id});
      }
    });
  });

  const el=$('srch-res');
  if(!res.length){ el.innerHTML='<div style="text-align:center;color:var(--mt);padding:30px">لا نتائج لـ "'+q+'"</div>'; return; }
  el.innerHTML=`<div style="color:var(--mt);font-size:12px;margin-bottom:12px">${res.length} نتيجة</div>`+
    res.map(r=>`
    <div class="panel" style="margin-bottom:8px;display:flex;align-items:center;gap:12px">
      <div style="font-size:26px">${r.icon}</div>
      <div style="flex:1">
        <div style="font-weight:600;font-size:17px">${esc(r.title)}</div>
        <div style="font-size:12px;color:var(--mt)">${esc(r.sub)}</div>
      </div>
      <span style="font-size:11px;background:var(--bg);padding:3px 8px;border-radius:5px;color:var(--mt)">${esc(r.badge||'')}</span>
    </div>`).join('');
}

//  📊 التقارير والإحصائيات + ⏱️ SLA
// ═══════════════════════════════════════════════════════
function pgReports(){
  if(!p('reports')&&CU.role!=='manager'){
    $('page').innerHTML='<div class="panel" style="text-align:center;padding:60px"><div style="font-size:40px">⛔</div><div style="margin-top:12px">ليس لديك صلاحية لعرض التقارير</div></div>';
    return;
  }
  // ✅ استخدام الأعطال المصرح بها فقط
  const visibleFaults = getVisibleFaults();
  const totalFaults = visibleFaults.length;
  const openF      = visibleFaults.filter(f=>f.status==='open').length;
  const resolvedF  = visibleFaults.filter(f=>f.status==='resolved').length;
  const highF      = visibleFaults.filter(f=>f.priority==='high').length;

  // ── SLA: حساب متوسط وقت الحل ──
  const resolvedWithTime = visibleFaults.filter(f=>f.status==='resolved'&&f.resolvedAt&&f._ts&&f.date);
  let avgSLA = 0;
  if(resolvedWithTime.length){
    const total = resolvedWithTime.reduce((sum,f)=>{
      // نستخدم _ts إذا متاح، وإلا نتجاهل
      const diffH = f._tsResolved ? (f._tsResolved - f._ts)/(1000*60*60) : 0;
      return sum + Math.max(0, diffH);
    },0);
    avgSLA = (total/resolvedWithTime.length).toFixed(1);
  }

  // ── أكثر المواقع أعطالاً ──
  const byLoc = {};
  visibleFaults.forEach(f=>{ byLoc[f.location]=(byLoc[f.location]||0)+1; });
  const topLocs = Object.entries(byLoc).sort((a,b)=>b[1]-a[1]).slice(0,5);

  // ── أكثر الأسباب تكراراً ──
  const byReason = {};
  visibleFaults.forEach(f=>{ byReason[f.reason]=(byReason[f.reason]||0)+1; });
  const topReasons = Object.entries(byReason).sort((a,b)=>b[1]-a[1]).slice(0,5);

  // ── إحصائيات المخزن — فقط المواقع المصرح بها ──
  let totalItems=0, deployedItems=0, warehouseItems=0;
  getVisibleSites().forEach(s=>{ (DB.inv[s]||[]).forEach(it=>{ totalItems++; if(it.status==='deployed') deployedItems++; if(it.status==='warehouse') warehouseItems++; }); });

  // ── إحصائيات الكاميرات الميدانية — فقط المواقع المصرح بها ──
  const totalCams = getVisibleFieldSites().reduce((s,fs)=>s+fs.cameras.length,0);

  $('page').innerHTML=`
  <div class="ph">
    <div class="pt">📊 التقارير والإحصائيات</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${CU.role==='manager'?`<button class="btn" style="background:#238636;color:#fff" onclick="printFullReport(${totalFaults},${openF},${resolvedF},${highF},${avgSLA},${totalItems},${deployedItems},${totalCams})">🖨️ طباعة / PDF</button>
      <button class="btn btn-bl" onclick="exportReportCSV()">⬇️ تصدير CSV</button>`:''}
    </div>
  </div>

  <!-- SLA بارز -->
  <div style="margin:0 16px 16px;background:linear-gradient(135deg,#1f2d3d,#162032);border:1px solid #58a6ff44;border-radius:14px;padding:20px;text-align:center">
    <div style="font-size:17px;color:var(--mt);margin-bottom:6px">⏱️ متوسط وقت حل الأعطال (SLA)</div>
    <div style="font-size:36px;font-weight:700;color:${avgSLA>24?'var(--rd)':avgSLA>8?'var(--yl)':'var(--gn)'}">${avgSLA} <span style="font-size:18px;color:var(--mt)">ساعة</span></div>

function fmtDate(val){
  if(!val) return '';
  var d = new Date(val);
  if(isNaN(d.getTime())) return String(val);
  var dd=String(d.getDate()).padStart(2,'0');
  var mm=String(d.getMonth()+1).padStart(2,'0');
  return d.getFullYear()+'-'+mm+'-'+dd;
}
function fmtDateTime(val){
  if(!val) return '';
  var d = new Date(val);
  if(isNaN(d.getTime())) return String(val);
  var dd=String(d.getDate()).padStart(2,'0');
  var mm=String(d.getMonth()+1).padStart(2,'0');
  var hh=String(d.getHours()).padStart(2,'0');
  var mi=String(d.getMinutes()).padStart(2,'0');
  return d.getFullYear()+'-'+mm+'-'+dd+' '+hh+':'+mi;
}

function toDMSFull(deg, isLat){
  if(deg===undefined||deg===null||isNaN(deg)) return '';
  var abs=Math.abs(deg);
  var d=Math.floor(abs);
  var mf=(abs-d)*60;
  var m=Math.floor(mf);
  var s=((mf-m)*60).toFixed(1);
  var dir=isLat?(deg<0?'S':'N'):(deg<0?'W':'E');
  return d+"°"+m+"'"+s+'"'+dir;
}

function filterInvTable(){
  // فلترة الجدول بدون إعادة رسم الصفحة — يحافظ على الكيبورد
  const q = (ISQ||'').toLowerCase();
  const rows = document.querySelectorAll('#inv-table-body tr');
  let visible = 0;
  rows.forEach(row=>{
    const name   = (row.dataset.name||'').toLowerCase();
    const serial = (row.dataset.serial||'').toLowerCase();
    const model  = (row.dataset.model||'').toLowerCase();
    const mfr    = (row.dataset.mfr||'').toLowerCase();
    const type   = row.dataset.type||'';
    const status = row.dataset.status||'';
    const matchQ = !q || [name,serial,model,mfr].some(v=>v.includes(q));
    const matchT = !ITYP || type===ITYP;
    const matchS = !ISTS || status===ISTS;
    const show   = matchQ && matchT && matchS;
    row.style.display = show ? '' : 'none';
    if(show) visible++;
  });
  const countEl = document.getElementById('inv-count');
  if(countEl){
    const total = rows.length;
    countEl.textContent = `📋 يعرض ${visible} من ${total} عنصر`;
  }
  const clearBtn = document.getElementById('inv-clear-btn');
  if(clearBtn) clearBtn.style.display = (ISQ||ITYP||ISTS)?'':'none';
}

  DB.faults.forEach(f=>rows.push([f.location,f.pointId,f.reason,f.priority==='high'?'عاجل':'عادي',f.status,f.by,f.date,f.resolvedAt||'']));
  const csv=rows.map(r=>r.map(v=>'"'+(v||'').split('"').join('""')+'"').join(',')).join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='تقرير_الأعطال_'+new Date().toISOString().split('T')[0]+'.csv';
  a.click();
  toast('تم تصدير التقرير');
  logAct('تصدير تقرير CSV','الأعطال');
}

// ═══════════════════════════════════════════════════════
//  🗓️ جدول الصيانة الدورية + تقويم
// ═══════════════════════════════════════════════════════
function pgMaintain(){
  if(!p('maintain')&&CU.role!=='manager'){
    $('page').innerHTML='<div class="panel" style="text-align:center;padding:60px"><div style="font-size:40px">⛔</div><div style="margin-top:12px">ليس لديك صلاحية لعرض الصيانة</div></div>';
    return;
  }
  const tasks = DB.maintain || [];
  const today = new Date();
  const overdue = tasks.filter(t=>!t.done && new Date(t.dueDate) < today);
  const upcoming = tasks.filter(t=>!t.done && new Date(t.dueDate) >= today).sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate));
  const done = tasks.filter(t=>t.done);

  $('page').innerHTML=`
  <div class="ph">
    <div><div class="pt">🗓️ جدول الصيانة الدورية</div>
    ${overdue.length?`<div class="ps" style="color:var(--rd)">⚠️ ${overdue.length} مهمة متأخرة</div>`:''}
    </div>
    <button class="btn btn-bl" onclick="openAddMaintain()">+ إضافة مهمة</button>
  </div>

  ${overdue.length?`
  <div style="margin:0 16px 16px">
    <div style="color:var(--rd);font-weight:700;margin-bottom:8px">🔴 متأخرة (${overdue.length})</div>
    ${overdue.map((t,i)=>`
    <div class="panel" style="border-right:3px solid var(--rd);margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="font-weight:600">${esc(t.title)}</div>
          <div style="font-size:12px;color:var(--mt)">📍 ${esc(t.location)} — كانت بتاريخ: <span style="color:var(--rd)">${t.dueDate}</span></div>
          ${t.notes?`<div style="font-size:12px;color:var(--mt)">${esc(t.notes)}</div>`:''}
        </div>
        <div style="display:flex;gap:5px">
          <button class="btn btn-sm btn-gn" onclick="doneMaintain('${t.id}')">✅ تم</button>
          <button class="btn btn-sm btn-rd" onclick="delMaintain('${t.id}')">🗑</button>
        </div>
      </div>
    </div>`).join('')}
  </div>`:''}

  ${upcoming.length?`
  <div style="margin:0 16px 16px">
    <div style="color:var(--gn);font-weight:700;margin-bottom:8px">📅 القادمة (${upcoming.length})</div>
    ${upcoming.map(t=>{
      const daysLeft = Math.ceil((new Date(t.dueDate)-today)/(1000*60*60*24));
      const color = daysLeft<=3?'var(--rd)':daysLeft<=7?'var(--yl)':'var(--gn)';
      return `
    <div class="panel" style="border-right:3px solid ${color};margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="font-weight:600">${esc(t.title)}</div>
          <div style="font-size:12px;color:var(--mt)">📍 ${esc(t.location)} — 📅 ${t.dueDate}</div>
          ${t.notes?`<div style="font-size:12px;color:var(--mt)">${esc(t.notes)}</div>`:''}
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px">
          <span style="font-size:12px;font-weight:700;color:${color}">${daysLeft===0?'اليوم':daysLeft+' يوم'}</span>
          <div style="display:flex;gap:5px">
            <button class="btn btn-sm btn-gn" onclick="doneMaintain('${t.id}')">✅</button>
            <button class="btn btn-sm btn-rd" onclick="delMaintain('${t.id}')">🗑</button>
          </div>
        </div>
      </div>
    </div>`;}).join('')}
  </div>`:''}

  ${done.length?`
  <div style="margin:0 16px 16px">
    <div style="color:var(--mt);font-weight:700;margin-bottom:8px">✅ منجزة (${done.length})</div>
    ${done.slice(0,5).map(t=>`
    <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--br);opacity:.6">
      <div><div style="font-size:17px;text-decoration:line-through">${esc(t.title)}</div>
      <div style="font-size:11px;color:var(--mt)">${esc(t.location)} — ${t.doneAt||t.dueDate}</div></div>
      <button class="btn btn-sm btn-rd" onclick="delMaintain('${t.id}')">🗑</button>
    </div>`).join('')}
  </div>`:''}

  ${!tasks.length?`<div style="text-align:center;padding:60px;color:var(--mt)"><div style="font-size:48px">🗓️</div><div style="margin-top:12px">لا مهام صيانة مجدولة</div></div>`:''}`;

function openAddMaintain(){
  openModal(`${mhd('🗓️ إضافة مهمة صيانة')}
  <div class="field"><label>عنوان المهمة *</label><input id="mt-ttl" placeholder="فحص دوري للكاميرات"></div>
  <div class="field"><label>الموقع *</label>
    <select id="mt-loc">
      ${DB.fieldSites.map(fs=>`<option value="${esc(fs.name)}">${esc(fs.name)}</option>`).join('')}
      ${DB.sites.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('')}
    </select>
  </div>
  <div class="field"><label>تاريخ الاستحقاق *</label><input id="mt-date" type="date" value="${new Date().toISOString().split('T')[0]}"></div>
  <div class="field"><label>التكرار</label>
    <select id="mt-rep">
      <option value="once">مرة واحدة</option>

    </select>

  ${mft('💾 حفظ','saveMaintain()')}`);

function saveMaintain(){
  const title=val('mt-ttl'), loc=val('mt-loc'), dueDate=val('mt-date');
  if(!title||!dueDate){ toast('العنوان والتاريخ مطلوبان','err'); return; }
  const id=gid();
  fbSet('maintain/'+id,{id,title,location:loc,dueDate,repeat:val('mt-rep'),notes:val('mt-notes')||'',done:false,by:CU.name,createdAt:ts(),_ts:Date.now()});
  logAct('إضافة مهمة صيانة',title+' — '+loc+' — '+dueDate);
  // إشعار
  pushN('🗓️ مهمة صيانة جديدة: '+title+' في '+loc+' بتاريخ '+dueDate,'info');
  closeModal(); toast('تم إضافة المهمة');
}

function doneMaintain(id){
  const t = (DB.maintain||[]).find(x=>x.id===id);
  if(!t) return;
  fbUpdate('maintain/'+id,{done:true,doneAt:ts(),doneBy:CU.name});
  // إذا متكرر أضف المهمة القادمة تلقائياً
  if(t.repeat&&t.repeat!=='once'){
    const d=new Date(t.dueDate);
    if(t.repeat==='weekly') d.setDate(d.getDate()+7);
    else if(t.repeat==='monthly') d.setMonth(d.getMonth()+1);
    else if(t.repeat==='quarterly') d.setMonth(d.getMonth()+3);
    const newId=gid();
    fbSet('maintain/'+newId,{...t,id:newId,done:false,dueDate:d.toISOString().split('T')[0],createdAt:ts(),_ts:Date.now()});
  }
  logAct('إنجاز مهمة صيانة',t.title+' — '+t.location);
  toast('✅ تم تسجيل الإنجاز');
}

function delMaintain(id){
  confirmDel('حذف مهمة الصيانة نهائياً؟', `fbDel('maintain/${id}');toast('تم الحذف','err')`);
}


// ═══════════════════════════════════════════════════════
//  📱 QR Code للكاميرات والمخزن
// ═══════════════════════════════════════════════════════
function showQR(data, title){
  openModal(`${mhd('📱 QR Code — '+esc(title))}
  <div style="display:flex;flex-direction:column;align-items:center;gap:16px;padding:10px">
    <div id="qr-box" style="background:#fff;padding:16px;border-radius:12px"></div>
    <div style="font-size:12px;color:var(--mt);text-align:center;max-width:220px;word-break:break-all">${esc(data)}</div>
    ${CU.role==='manager'?`<button class="btn btn-bl" onclick="downloadQR('${esc(title)}')">⬇️ تحميل</button>`:''}
  </div>`);
  setTimeout(()=>{
    const box = document.getElementById('qr-box');
    if(box && typeof QRCode !== 'undefined'){
      box.innerHTML = '';
      new QRCode(box, {text: data, width:200, height:200, colorDark:'#000', colorLight:'#fff'});
    }
  }, 100);
}

function downloadQR(title){
  if(CU.role!=='manager'){toast('التصدير محصور بالمدير فقط','err');return;}
  const canvas = document.querySelector('#qr-box canvas');
  if(!canvas){ toast('QR غير جاهز','err'); return; }
  const a = document.createElement('a');
  a.download = 'QR_'+title+'.png';
  a.href = canvas.toDataURL();
  a.click();
  toast('تم تحميل QR Code');
}

function showCamQR(fsId, camId){
  const fs = DB.fieldSites.find(x=>x.id===fsId);
  const cam = fs?.cameras.find(x=>x.id===camId);
  if(!cam) return;
  const data = JSON.stringify({
    type:'CCTV_CAM',
    id: cam.id,
    name: cam.name,
    serial: cam.serial||'',
    site: fs.name,
    model: cam.model||'',
    ip: cam.ip||''
  });
  showQR(data, cam.name);
}

function showItemQR(item){
  const data = JSON.stringify({
    type:'CCTV_ITEM',
    id: item.id||item.serial,
    name: item.name,
    serial: item.serial||'',
    type2: item.type||'',
    site: item.currentSite||''
  });
  showQR(data, item.name);
}

function openFaultPhotos(faultId){
  const f = DB.faults.find(x=>x.id===faultId);
  if(!f) return;
  const photos = f.photos||[];
  openModal(`${mhd('📸 صور العطل: '+esc(f.location)+' — '+esc(f.pointId))}
  <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;max-height:250px;overflow-y:auto">
    ${photos.map((ph,i)=>`
    <div style="position:relative">
      <img src="${ph.url}" style="width:90px;height:90px;object-fit:cover;border-radius:8px;border:1px solid var(--br)" onclick="viewPhoto('${ph.url}')">
      ${p('updFault')?`<button onclick="delFaultPhoto('${faultId}',${i})" style="position:absolute;top:2px;right:2px;background:#f8514999;border:none;border-radius:50%;width:20px;height:20px;color:#fff;cursor:pointer;font-size:11px">✕</button>`:''}
    </div>`).join('')}
    ${!photos.length?'<div style="color:var(--mt);padding:20px;text-align:center;width:100%">لا صور بعد</div>':''}
  </div>
  ${p('updFault')||p('faults')?`
  <div style="border:2px dashed var(--br);border-radius:10px;padding:16px;text-align:center;cursor:pointer" onclick="document.getElementById('photo-inp').click()">
    <div style="font-size:26px">📷</div>
    <div style="font-size:17px;color:var(--mt)">اضغط لرفع صورة</div>
    <input id="photo-inp" type="file" accept="image/*" style="display:none" onchange="uploadFaultPhoto('${faultId}',this)">
  </div>`:''}
  <div class="mft" style="margin-top:12px">
    <button class="btn btn-gy" onclick="closeModal()">إغلاق</button>
  </div>`);
}

function uploadFaultPhoto(faultId, input){
  const file = input.files[0];
  if(!file) return;
  if(file.size > 500*1024){ toast('الصورة كبيرة جداً (الحد 500KB)','err'); return; }
  toast('⏳ جار الرفع...');
  const reader = new FileReader();
  reader.onload = e=>{
    const url = e.target.result;
    const f = DB.faults.find(x=>x.id===faultId);
    const photos = [...(f?.photos||[]), {url, by:CU.name, time:ts()}];
    fbUpdate('faults/'+faultId, {photos});
    logAct('رفع صورة عطل', f?.location+'/'+f?.pointId);
    closeModal();
    toast('✅ تم رفع الصورة');
  };
  reader.readAsDataURL(file);
}

function delFaultPhoto(faultId, idx){
  confirmDel('حذف هذه الصورة نهائياً؟', `(()=>{const f=DB.faults.find(x=>x.id==='${faultId}');const photos=(f?.photos||[]).filter((_,i)=>i!==${idx});fbUpdate('faults/${faultId}',{photos});closeModal();toast('تم الحذف','err')})()`);
}

function viewPhoto(url){
  openModal(`<div style="text-align:center">
    <img src="${url}" style="max-width:100%;max-height:70vh;border-radius:8px">
    <div class="mft" style="margin-top:12px">
      <button class="btn btn-gy" onclick="closeModal()">إغلاق</button>
    </div>
  </div>`);
}

    <input style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--br);background:var(--sf);color:var(--tx);margin-bottom:16px"
      placeholder="بحث..." oninput="filterBarcodes(this.value)">
    <div id="barcode-list">
      ${allItems.map(it=>`
      <div class="panel" style="display:flex;align-items:center;gap:12px;margin-bottom:8px">

function filterBarcodes(q){
  q=q.toLowerCase();
  const allItems=[];
  DB.sites.forEach(s=>{ (DB.inv[s]||[]).forEach(it=>{ if(!q||it.name?.toLowerCase().includes(q)||it.serial?.toLowerCase().includes(q)) allItems.push(it); }); });
  document.getElementById('barcode-list').innerHTML=allItems.map(it=>`
  <div class="panel" style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
    <div style="flex:1">
      <div style="font-weight:600;font-size:17px">${esc(it.name)}</div>
      <div style="font-size:11px;color:var(--mt)">${esc(it.serial||'بدون سيريال')} — ${esc(it.currentSite||'')}</div>
    </div>
    <button class="btn btn-sm btn-bl" onclick="showItemQR(${JSON.stringify(it).split('"').join('&quot;')})">📱 QR</button>
  </div>`).join('') || '<div style="text-align:center;padding:40px;color:var(--mt)">لا نتائج</div>';
}

function printAllBarcodes(){
  if(CU.role!=='manager'){toast('التصدير محصور بالمدير فقط','err');return;}
  toast('جار التجهيز للطباعة...','warn');
  // فتح نافذة طباعة
  setTimeout(()=>window.print(), 500);
}
