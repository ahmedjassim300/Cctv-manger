//  🗺️ تصدير خريطة الكاميرات PDF (نص)
// ═══════════════════════════════════════════════════════
function exportMapReport(){
  if(CU.role!=='manager'){toast('التصدير محصور بالمدير فقط','err');return;}
  const lines = [];
  lines.push('تقرير المواقع الميدانية والكاميرات');
  lines.push('تاريخ التقرير: '+fmtDate(new Date().toISOString()));
  lines.push('='.repeat(50));
  lines.push('');
  DB.fieldSites.forEach(fs=>{
    lines.push('📍 '+fs.name+(fs.desc?' — '+fs.desc:''));
    lines.push('   عدد الكاميرات: '+fs.cameras.length);
    fs.cameras.forEach(c=>{
      lines.push('   📷 '+c.name+' | '+(c.serial||'-')+' | '+(c.status||'-')+' | IP: '+(c.ip||'-'));
      if(c.lat&&c.lng) lines.push('      GPS: '+c.lat+', '+c.lng);
    });
    lines.push('');
  });
  const blob = new Blob([lines.join('\n')], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'تقرير_المواقع_'+new Date().toISOString().split('T')[0]+'.txt';
  a.click();
  toast('تم تصدير التقرير');
  logAct('تصدير تقرير المواقع','');
}


// ═══════════════════════════════════════════════════════
//  🔄 تحديث تلقائي للصفحة عند تغيير البيانات
// ═══════════════════════════════════════════════════════
let _lastDataHash = '';
function getDataHash(){
  return JSON.stringify({
    faults: DB.faults.length,
    notifs: DB.notifs.length,
    moves: DB.moves.length,
    maintain: (DB.maintain||[]).length,
    faultsOpen: DB.faults.filter(f=>f.status==='open').length
  });
}
function checkAutoRefresh(){
  const hash = getDataHash();
  if(_lastDataHash && _lastDataHash !== hash){
    // البيانات تغيرت — أعد تحميل الصفحة الحالية
    if(PAGE) go(PAGE);
  }
  _lastDataHash = hash;
}

// ═══════════════════════════════════════════════════════
//  🔐 نسخة احتياطية تلقائية
// ═══════════════════════════════════════════════════════
function buildFullBackupPayload(){
  return {
    date: new Date().toISOString(),
    version: '2.0',
    data: {
      faults:        DB.faults||[],
      moves:         DB.moves||[],
      invoices:      DB.invoices||[],
      fieldSites:    DB.fieldSites||[],
      maintain:      DB.maintain||[],
      sites:         DB.sites||[],
      inv:           DB.inv||{},
      users:         (DB.users||[]).map(function(u){
                        // لا نُصدّر أي شيء حسّاس زائد؛ الأدوار والصلاحيات فقط
                        return {uid:u.uid||u.id, name:u.name, role:u.role, perms:u.perms||null};
                      }),
      radioDevices:  DB.radioDevices||[],
      uavDevices:    DB.uavDevices||[],
      notifs:        DB.notifs||[],
      actlog:        DB.actlog||[],
      siteInventory: DB.siteInventory||{},
      customTypes:   DB.customTypes||{},
      mainSite:      DB.mainSite||'',
      // ⚠️ سجل كلمات المرور (pwVault) عمداً غير مُضمَّن هنا لأسباب أمنية —
      // نسخته الاحتياطية تتم يدوياً ومنفصلة من داخل القسم نفسه إذا احتجتها
    }
  };
}

function doBackup(){
  const backup = buildFullBackupPayload();
  const json = JSON.stringify(backup, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'CCTV_Backup_'+new Date().toISOString().split('T')[0]+'.json';
  a.click();
  toast('✅ تم تصدير نسخة احتياطية شاملة');
  logAct('نسخة احتياطية يدوية', fmtDate(new Date().toISOString()));
}

function restoreBackup(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const backup = JSON.parse(e.target.result);
      if(!backup.data){ toast('ملف غير صحيح','err'); return; }
      confirmDel('⚠️ هذا سيستبدل البيانات الحالية بالنسخة الاحتياطية.<br><small style="color:var(--rd)">لا يمكن التراجع عن هذا الإجراء</small>',
        `(()=>{const d=${JSON.stringify('__BACKUP__')};`
        +`const b=JSON.parse(localStorage.getItem('__lastBackup__')||'{}');`
        +`if(!b.data){toast('خطأ: البيانات غير موجودة','err');return;}`
        +`const bd=b.data;`
        +`if(bd.faults)bd.faults.forEach(f=>fbSet('faults/'+f.id,f));`
        +`if(bd.moves)bd.moves.forEach(m=>fbSet('moves/'+m.id,m));`
        +`if(bd.invoices)bd.invoices.forEach(i=>fbSet('invoices/'+i.id,i));`
        +`if(bd.fieldSites)bd.fieldSites.forEach(fs=>fbSet('fieldSites/'+fs.id,fs));`
        +`if(bd.maintain)bd.maintain.forEach(t=>fbSet('maintain/'+t.id,t));`
        +`toast('✅ تم استعادة النسخة الاحتياطية');`

// ══════════════════════════════════════════════════════
//  🔄 نسخة احتياطية أسبوعية حقيقية — تُخزَّن داخل Firebase نفسه
//  (أرشيف دوّار: نحتفظ بآخر 4 نسخ فقط لتوفير المساحة)
// ══════════════════════════════════════════════════════
const BACKUP_INTERVAL_MS = 7*24*60*60*1000; // أسبوع
const BACKUP_KEEP_COUNT = 4; // آخر شهر تقريباً (4 نسخ أسبوعية)

function autoBackupCheck(){
  if(!CU || CU.role!=='manager') return; // فقط المدير يُشغّل النسخ التلقائي
  // ⚠️ نؤخّرها لثانيتين بعد تحميل الصفحة، حتى لا تنافس رسم الواجهة على موارد الجهاز
  // (خصوصاً بالهواتف الأضعف، حيث نسخ بيانات ضخمة بنفس لحظة الرسم قد يجمّد الشاشة لحظياً)
  setTimeout(function(){
    try{
      FBDB.ref('cctv/backups/_meta/lastAutoBackup').once('value').then(function(snap){
        const last = snap.val();
        const now = Date.now();
        if(!last || (now - last) > BACKUP_INTERVAL_MS){
          runAutoBackup(now);
        }
      }).catch(function(err){
        console.warn('Auto-backup check failed:', err.message);
      });
    }catch(e){
      console.warn('Auto-backup check exception:', e.message);
    }
  }, 2000);
}

function runAutoBackup(now){
  try{
    const backup = buildFullBackupPayload();
    const backupId = 'backup_'+now;
    // فحص الحجم قبل الرفع — Firebase RTDB يرفض أي كتابة تتجاوز 10MB لكل عملية
    const sizeCheck = JSON.stringify(backup).length;
    if(sizeCheck > 8*1024*1024){ // نتوقف عند 8MB كهامش أمان قبل حد الـ10MB
      console.warn('Auto-backup skipped: payload too large ('+(sizeCheck/1024/1024).toFixed(1)+'MB)');
      // نسجّل وقت المحاولة بأي حال حتى لا يعيد المحاولة كل دقيقة بلا فائدة
      fbSet('backups/_meta/lastAutoBackup', now).catch(function(){});
      return;
    }
    fbSet('backups/'+backupId, backup).then(function(){
      fbSet('backups/_meta/lastAutoBackup', now);
      logAct('نسخة احتياطية تلقائية (أسبوعية)', fmtDate(new Date(now).toISOString()));
      cleanupOldBackups();
    }).catch(function(err){
      console.warn('Auto-backup save failed:', err.message);
    });
  }catch(e){
    console.warn('Auto-backup exception (caught safely):', e.message);
  }
}

function cleanupOldBackups(){
  FBDB.ref('cctv/backups').once('value').then(function(snap){
    const data = snap.val()||{};
    const ids = Object.keys(data).filter(function(k){return k.startsWith('backup_');});
    if(ids.length <= BACKUP_KEEP_COUNT) return;
    // ترتيب تصاعدي حسب الرقم الزمني بالمعرّف، وحذف الأقدم
    ids.sort(function(a,b){
      return parseInt(a.replace('backup_','')) - parseInt(b.replace('backup_',''));
    });
    const toDelete = ids.slice(0, ids.length - BACKUP_KEEP_COUNT);
    toDelete.forEach(function(id){ fbDel('backups/'+id); });
  }).catch(function(err){
    console.warn('cleanupOldBackups failed:', err.message);
  });
}

// عرض قائمة النسخ الاحتياطية التلقائية المتوفرة (للمدير فقط)
function listAutoBackups(){
  return FBDB.ref('cctv/backups').once('value').then(function(snap){
    const data = snap.val()||{};
    return Object.keys(data)
      .filter(function(k){return k.startsWith('backup_');})
      .map(function(k){return {id:k, date:data[k].date, ts:parseInt(k.replace('backup_',''))};})
      .sort(function(a,b){return b.ts-a.ts;});
  });
}

function downloadAutoBackup(backupId){
  FBDB.ref('cctv/backups/'+backupId).once('value').then(function(snap){
    const backup = snap.val();
    if(!backup){ toast('النسخة غير موجودة','err'); return; }
    const json = JSON.stringify(backup, null, 2);
    const blob = new Blob([json], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'CCTV_AutoBackup_'+backup.date.split('T')[0]+'.json';
    a.click();
    toast('✅ تم تنزيل النسخة');
  });
}

function pgPerformance(){
  if(CU.role !== 'manager'){ $('page').innerHTML='<div style="text-align:center;padding:60px;color:var(--mt)">⛔ للمدير فقط</div>'; return; }

  // حساب إحصائيات كل فني
  const stats = {};
  DB.users.filter(u=>u.role==='technician'||u.role==='engineer'||u.role==='field').forEach(u=>{
    stats[u.name] = { name:u.name, role:u.role, resolved:0, inprog:0, comments:0, avgTime:0, times:[] };
  });

  DB.faults.forEach(f=>{
    // من أغلق العطل
    if(f.log){
      f.log.forEach(l=>{
        if(l.label==='تم الحل'||l.label==='محلول'){
          if(stats[l.by]) stats[l.by].resolved++;
        }
      });
    }
    if(f.status==='inprogress' && stats[f.by]) stats[f.by].inprog++;
    // وقت الحل
    if(f.status==='resolved' && f._ts && f._tsResolved && stats[f.by]){
      const h = (f._tsResolved - f._ts)/(1000*60*60);
      stats[f.by].times.push(h);
    }
    // التعليقات
    (f.comments||[]).forEach(c=>{ if(stats[c.by]) stats[c.by].comments++; });
  });

  // حساب متوسط وقت الحل
  Object.values(stats).forEach(s=>{
    s.avgTime = s.times.length ? (s.times.reduce((a,b)=>a+b,0)/s.times.length).toFixed(1) : '-';
  });

  // أشهر لاختيار الفترة
  const now = new Date();
  const months = [];
  for(let i=0;i<6;i++){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push({ label: d.toLocaleDateString('ar',{month:'long',year:'numeric'}), y:d.getFullYear(), m:d.getMonth() });
  }

  const sorted = Object.values(stats).sort((a,b)=>b.resolved-a.resolved);
  const medals = ['🥇','🥈','🥉'];

  $('page').innerHTML=`
  <div class="ph">
    <div class="pt">🏆 أداء الفنيين</div>
    <select id="perf-month" onchange="renderPerfMonth()" style="padding:8px 12px;border-radius:10px;border:1.5px solid var(--br);background:var(--bg);color:var(--tx);font-size:15px;font-family:inherit">
      ${months.map((m,i)=>`<option value="${i}">${m.label}</option>`).join('')}
    </select>
  </div>
  <div id="perf-body" style="padding:0 16px"></div>`;

  // تخزين البيانات للفلترة
  window._perfData = { stats, sorted, medals, months, DB_faults: DB.faults };
  renderPerfMonth();
}

function renderPerfMonth(){
  const sel = document.getElementById('perf-month');
  const mi = sel ? parseInt(sel.value)||0 : 0;
  const { stats, sorted, medals, months } = window._perfData;
  const {y, m} = months[mi];

  // فلترة الأعطال للشهر المختار
  const monthFaults = DB.faults.filter(f=>{
    if(!f.resolvedBy || f.status!=='resolved') return false;
    const d = new Date(f._tsResolved||0);
    return d.getFullYear()===y && d.getMonth()===m;
  });

  // إحصائيات الشهر لكل فرد
  const monthStats = {};
  Object.values(stats).forEach(s=>{ monthStats[s.name]={ ...s, mResolved:0, mFaults:[] }; });

  monthFaults.forEach(f=>{
    if(monthStats[f.resolvedBy]){
      monthStats[f.resolvedBy].mResolved++;
      monthStats[f.resolvedBy].mFaults.push(f);
    }
  });

  const msorted = Object.values(monthStats).sort((a,b)=>b.mResolved-a.mResolved);
  const el = document.getElementById('perf-body');
  if(!el) return;

  el.innerHTML = !msorted.filter(s=>s.mResolved>0).length
  ? `<div style="text-align:center;padding:40px;color:var(--mt)">لا أعطال محلولة هذا الشهر</div>`
  + msorted.map((s,i)=> renderPerfCard(s,i,medals,false)).join('')
  : msorted.map((s,i)=> renderPerfCard(s,i,medals,true)).join('');
}

let _gpsWatcher = null;

function startGPSTracking(){
  if(!navigator.geolocation){ toast('GPS غير مدعوم في هذا الجهاز','err'); return; }

  // طلب الموقع فوراً
  navigator.geolocation.getCurrentPosition(
    pos => updateTechLocation(pos),
    err => handleGPSError(err),
    {enableHighAccuracy:true, timeout:10000}
  );

  // تتبع مستمر كل 30 ثانية
  _gpsWatcher = navigator.geolocation.watchPosition(
    pos => updateTechLocation(pos),
    err => handleGPSError(err),
    {enableHighAccuracy:true, maximumAge:30000, timeout:15000}
  );
}

function stopGPSTracking(){
  if(_gpsWatcher !== null){
    navigator.geolocation.clearWatch(_gpsWatcher);
    _gpsWatcher = null;
  }
}

function updateTechLocation(pos){
  const uid = CU.uid||CU.id;
  fbSet('techLocations/'+uid, {
    uid, name:CU.name, role:CU.role,
    lat: pos.coords.latitude,
    lng: pos.coords.longitude,
    accuracy: Math.round(pos.coords.accuracy),
    updatedAt: ts(),
    _ts: Date.now(),
    online: true
  });
}

function handleGPSError(err){
  console.log('GPS error:', err.code, err.message);
}

function fmtAgo(ts){
  if(!ts) return '—';
  var m=Math.round((Date.now()-ts)/60000);
  if(m<1) return 'الآن';
  if(m<60) return m+' دقيقة';
  var h=Math.floor(m/60);
  if(h<24) return h+' ساعة'+(m%60?' و'+(m%60)+' د':'');
  var d=Math.floor(h/24);
  if(d<7) return d+' يوم'+(h%24?' و'+(h%24)+' س':'');
  return Math.floor(d/7)+' أسبوع'+(d%7?' و'+(d%7)+' ي':'');
}

    <div id="qr-status" style="font-size:17px;color:var(--mt);margin-bottom:12px">جار تشغيل الكاميرا...</div>
    <div class="mft">
      <button class="btn btn-rd" onclick="stopQRScanner()">إيقاف</button>
    </div>
  </div>`);
  setTimeout(startQRScanner, 300);
}

function startQRScanner(){
  const video = document.getElementById('qr-video');
  if(!video) return;

  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})
  .then(stream=>{
    video.srcObject = stream;
    _qrScanner = stream;
    scanQRFrame(video);
  })
  .catch(err=>{
    const el = document.getElementById('qr-status');
    if(el) el.textContent = '❌ لا يمكن الوصول للكاميرا';
  });
}

function scanQRFrame(video){
  if(!document.getElementById('qr-video')) return; // Modal مغلق
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');

  function tick(){
    if(!document.getElementById('qr-video')){ stopQRScanner(); return; }
    if(video.readyState === video.HAVE_ENOUGH_DATA){
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);
      try{
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        // استخدام jsQR إذا متاح
        if(typeof jsQR !== 'undefined'){
          const code = jsQR(imageData.data, imageData.width, imageData.height);
          if(code){
            stopQRScanner();
            handleQRResult(code.data);
            return;
          }
        }
      }catch(e){}
    }
    requestAnimationFrame(tick);
  }
  tick();
}

function stopQRScanner(){
  if(_qrScanner){
    _qrScanner.getTracks().forEach(t=>t.stop());
    _qrScanner = null;
  }
  closeModal();
}

function handleQRResult(data){
  try{
    const obj = JSON.parse(data);
    if(obj.type === 'CCTV_CAM'){
      // فتح بيانات الكاميرا
      const fs = DB.fieldSites.find(s=>s.name===obj.site);
      const cam = fs?.cameras.find(c=>c.id===obj.id||c.serial===obj.serial);
      if(cam&&fs){
        toast('✅ تم التعرف على الكاميرا: '+cam.name);
        openModal(`${mhd('📷 '+esc(cam.name))}
        <div style="display:flex;flex-direction:column;gap:8px;font-size:17px">
          <div class="panel"><b>الموقع:</b> ${esc(fs.name)}</div>
          <div class="panel"><b>السيريال:</b> ${esc(cam.serial||'—')}</div>
          <div class="panel"><b>النوع:</b> ${esc(cam.camType||'—')}</div>
          <div class="panel"><b>IP:</b> ${esc(cam.ip||'—')}</div>
          <div class="panel"><b>الحالة:</b> ${esc(cam.status||'—')}</div>
          ${cam.lat&&cam.lng?`<a href="https://maps.google.com/?q=${cam.lat},${cam.lng}" target="_blank" class="btn btn-bl">🗺️ الموقع</a>`:''}
        </div>
        <div class="mft" style="margin-top:12px">
          <button class="btn btn-gy" onclick="closeModal()">إغلاق</button>
          <button class="btn btn-rd" onclick="closeModal();openAddFault()">⚠️ إبلاغ عطل</button>
        </div>`);
      } else {

      }
    } else if(obj.type === 'CCTV_ITEM'){
      toast('✅ تم التعرف على الجهاز: '+obj.name);
      openModal(`${mhd('📦 '+esc(obj.name))}
      <div style="display:flex;flex-direction:column;gap:8px;font-size:17px">

      </div>`);
    } else {
      toast('QR: '+data.substring(0,50),'warn');
    }
  } catch(e){
    // QR نصي عادي
    toast('📋 QR: '+data.substring(0,60));
  }
}

//  📴 وضع Offline — حفظ البيانات محلياً
// ═══════════════════════════════════════════════════════
let _isOnline = navigator.onLine;
let _offlineQueue = JSON.parse(localStorage.getItem('cctv_offline_queue')||'[]');

window.addEventListener('online', ()=>{
  _isOnline = true;
  updateOnlineStatus(true);
  syncOfflineQueue();
});
window.addEventListener('offline', ()=>{
  _isOnline = false;
  updateOnlineStatus(false);
});

function updateOnlineStatus(online){
  const ind = document.getElementById('online-ind');
  if(ind){
    ind.textContent = online ? '🟢' : '🔴';
    ind.title = online ? 'متصل' : 'غير متصل — البيانات محفوظة محلياً';
  }
  if(!online) toast('📴 وضع offline — البيانات ستُزامن عند الاتصال','warn');
  else if(_offlineQueue.length) toast('🔄 جار مزامنة '+_offlineQueue.length+' عملية...');
}

// إضافة عملية للقائمة المؤجلة
function queueOfflineOp(op, path, data){
  _offlineQueue.push({op, path, data, time: Date.now()});
  localStorage.setItem('cctv_offline_queue', JSON.stringify(_offlineQueue));
  // حفظ البيانات محلياً فوراً
  const local = JSON.parse(localStorage.getItem('cctv_local_db')||'{}');
  local[path] = data;
  localStorage.setItem('cctv_local_db', JSON.stringify(local));
}

// مزامنة القائمة عند عودة الاتصال
function syncOfflineQueue(){
  if(!_offlineQueue.length) return;
  const queue = [..._offlineQueue];
  _offlineQueue = [];
  localStorage.setItem('cctv_offline_queue', '[]');
  
  queue.forEach(item=>{
    try{
      if(item.op==='set') FBDB.ref('cctv/'+item.path).set(item.data);
      else if(item.op==='push') FBDB.ref('cctv/'+item.path).push(item.data);
      else if(item.op==='update') FBDB.ref('cctv/'+item.path).update(item.data);
      else if(item.op==='delete') FBDB.ref('cctv/'+item.path).remove();
    }catch(e){ console.warn('Sync failed:', item.path); }
  });
  toast('✅ تمت المزامنة ('+queue.length+' عملية)');
}

// حفظ البيانات محلياً عند المزامنة
function cacheLocalDB(data){
  try{
    const mini = {
      faults:     data.faults     ||{},
      notifs:     data.notifs     ||{},
      fieldSites: data.fieldSites ||{},
      maintain:   data.maintain   ||{},
      users:      data.users      ||{},
      sites:      data.sites      ||[],
      inv:        data.inv        ||{},
      tasks:      data.tasks      ||{},
    };
    // تجنب تجاوز حد localStorage (5MB) — نحذف القديم إذا فشل
    try{
      localStorage.setItem('cctv_local_db', JSON.stringify(mini));
    }catch(quota){
      // إذا كان الحجم كبيراً، احفظ الأساسيات فقط
      localStorage.setItem('cctv_local_db', JSON.stringify({
        faults: data.faults||{}, fieldSites: data.fieldSites||{}, maintain: data.maintain||{}
      }));
    }
  }catch(e){}
}

// تحميل البيانات المحلية عند offline
function loadLocalDB(){
  try{
    const local = JSON.parse(localStorage.getItem('cctv_local_db')||'{}');
    if(local.faults)     DB.faults     = Object.values(local.faults).sort((a,b)=>(b._ts||0)-(a._ts||0));
    if(local.notifs)     DB.notifs     = Object.values(local.notifs).sort((a,b)=>(b._ts||0)-(a._ts||0));
    if(local.fieldSites) DB.fieldSites = Object.values(local.fieldSites).map(fs=>({...fs,cameras:fs.cameras?Object.values(fs.cameras):[]}));
    if(local.maintain)   DB.maintain   = Object.values(local.maintain);
    if(local.users)      DB.users      = Object.values(local.users);
    if(local.sites)      DB.sites      = Array.isArray(local.sites) ? local.sites : Object.values(local.sites);
    if(local.tasks)      DB.tasks      = Object.values(local.tasks).sort((a,b)=>(b._ts||0)-(a._ts||0));
    if(local.inv){
      DB.inv={};
      Object.entries(local.inv).forEach(([k,items])=>{
        const siteName=decodeURIComponent(k.replace(/_dot_/g,'.').replace(/_sl_/g,'/'));
        DB.inv[siteName]=Object.values(items).filter(i=>!i.___init);
      });
    }
    toast('📴 عرض بيانات محفوظة — غير متصل','warn');
    if(PAGE) go(PAGE); else go('dashboard');
  }catch(e){ console.warn('loadLocalDB error:',e); }
}

//  🔐 صلاحية الوصول للعطل بناءً على الموقع
// ═══════════════════════════════════════════════════════
function canAccessFault(f){
  if(!CU) return false;
  if(CU.role==='manager') return true;
  if(CU.role==='viewer') return true;

  // عطل مرتبط بموقع ميداني — يراه فقط من لديه وصول لذلك الموقع
  if(f.fieldSiteId){
    const site = DB.fieldSites.find(s => s.id === f.fieldSiteId);
    if(!site) return false;
    return canUserSeeFieldSite(site);
  }

  // عطل بدون موقع ميداني (موقع مخزن عادي)
  // الفني والصاعود يرون فقط أعطال المواقع المصرح لهم
  if(CU.role==='technician' || CU.role==='field'){
    if(!CU.perms?.allowedSites) return false; // إذا ما في مواقع محددة لا يرى شيء
    const allowed = CU.perms.allowedSites; // مصفوفة أسماء المواقع المصرح بها
    return allowed.includes(f.location);
  }

  // المهندس يرى كل الأعطال
  return p('faults');
}

function getVisibleFaults(){
  return DB.faults.filter(f => canAccessFault(f));
}

let _qfPri = 'low';
function setQFPri(p){
  _qfPri = p;
  document.getElementById('qf-low').classList.toggle('act', p==='low');
  document.getElementById('qf-high').classList.toggle('act', p==='high');
}

function submitQuickFault(){
  const loc = val('qf-loc'), pt = val('qf-pt'), rsn = val('qf-rsn');
  if(!loc||!pt||!rsn){ toast('يرجى تعبئة الحقول المطلوبة','err'); return; }
  const relatedSite = DB.fieldSites.find(s=>s.name===loc);
  fbPush('faults',{
    location:loc, pointId:pt, reason:rsn, priority:_qfPri,
    by:CU.name, date:ts(), status:'open', log:[],
    fieldSiteId: relatedSite?.id||null, _ts:Date.now()
  });
  if(relatedSite) pushFieldN((_qfPri==='high'?'🔴':'🟡')+' عطل في '+loc+' — '+pt, relatedSite.id, 'error');
  else pushN((_qfPri==='high'?'🔴':'🟡')+' عطل في '+loc+' — '+pt, 'error');
  logAct('بلاغ عطل سريع', loc+' — '+pt);
  closeModal();
  toast('✅ تم إرسال البلاغ');
  _qfPri = 'low';
}

let _chatListener = null;

function pgChat(){
  const myUid = CU.uid||CU.id;
  $('page').innerHTML=`
  <div style="display:flex;flex-direction:column;height:calc(100vh - 58px)">
    <!-- هيدر الدردشة -->
    <div style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--sf);border-bottom:1px solid var(--br);flex-shrink:0">
      <div style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#0084ff,#00c6ff);display:flex;align-items:center;justify-content:center;font-size:20px">💬</div>
      <div>
        <div style="font-weight:700;font-size:16px">دردشة الفريق</div>
        <div style="font-size:12px;color:var(--gn)">● متصل</div>
      </div>
    </div>
    <!-- الرسائل -->
    <div id="chat-msgs" style="flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:4px;background:var(--bg)">
      <div style="text-align:center;color:var(--mt);padding:40px">⏳</div>
    </div>
    <!-- حقل الإدخال -->
    <div style="display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--sf);border-top:1px solid var(--br);flex-shrink:0">
      <input id="chat-inp" 
        style="flex:1;padding:10px 16px;border-radius:22px;border:1.5px solid var(--br);background:var(--bg);color:var(--tx);font-size:16px;outline:none;font-family:inherit" 
        placeholder="رسالة..." onkeydown="if(event.key==='Enter')sendChat()">
      <button onclick="sendChat()" style="width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#0084ff,#0099ff);border:none;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 8px rgba(0,132,255,.4)">↑</button>
    </div>
  </div>`;

  if(_chatListener) FBDB.ref('cctv/chat').off('value', _chatListener);
  _chatListener = FBDB.ref('cctv/chat').limitToLast(60).on('value', snap=>{
    const msgs = snap.val() ? Object.values(snap.val()).sort((a,b)=>(a._ts||0)-(b._ts||0)) : [];
    const el = document.getElementById('chat-msgs');
    if(!el) return;

    if(!msgs.length){
      el.innerHTML='<div style="text-align:center;color:var(--mt);padding:40px;font-size:15px">لا رسائل بعد 👋</div>';
      return;
    }

    let html = '';
    let lastDate = '';
    msgs.forEach((m,i)=>{
      const isMe = m.uid === myUid;
      const prev = msgs[i-1];
      const isFirst = !prev || prev.uid !== m.uid;
      const isLast  = !msgs[i+1] || msgs[i+1].uid !== m.uid;

      // فاصل التاريخ
      const msgDate = (m.time||'').split(' ')[0];
      if(msgDate && msgDate !== lastDate){
        lastDate = msgDate;
        html += `<div style="text-align:center;margin:12px 0 8px">
          <span style="background:var(--sf);border:1px solid var(--br);border-radius:20px;padding:4px 14px;font-size:12px;color:var(--mt)">${msgDate}</span>
        </div>`;
      }

      // أفاتار ملون
      const av = m.name?m.name[0]:'?';
      const avColor = RC[m.role]||'var(--bl)';

      html += `<div style="display:flex;flex-direction:${isMe?'row-reverse':'row'};align-items:flex-end;gap:6px;margin-bottom:${isLast?'8':'2'}px">
        ${!isMe&&isLast?`<div style="width:32px;height:32px;border-radius:50%;background:${avColor};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex-shrink:0">${av}</div>`
        :!isMe?'<div style="width:32px"></div>':''}
        <div style="max-width:72%;display:flex;flex-direction:column;align-items:${isMe?'flex-end':'flex-start'}">
          ${!isMe&&isFirst?`<div style="font-size:12px;color:${avColor};font-weight:700;margin-bottom:2px;padding:0 4px">${esc(m.name)}</div>`:''}
          <div style="background:${isMe?'linear-gradient(135deg,#0084ff,#0066cc)':'var(--sf)'};color:${isMe?'#fff':'var(--tx)'};
            padding:10px 14px;
            border-radius:${isMe
              ? (isFirst?'18px 4px 18px 18px':'18px 4px 4px 18px')
              : (isFirst?'4px 18px 18px 18px':'4px 18px 18px 4px')};
            font-size:16px;line-height:1.5;
            box-shadow:0 1px 4px rgba(0,0,0,.15);
            word-break:break-word">
            ${esc(m.text)}
          </div>
          ${isLast?`<div style="font-size:11px;color:var(--mt);margin-top:3px;padding:0 4px">${esc(m.time||'')}</div>`:''}
        </div>
      </div>`;
    });

    el.innerHTML = html;
    el.scrollTop = el.scrollHeight;
  });
}

function sendChat(){
  const txt = val('chat-inp');
  if(!txt?.trim()) return;
  fbPush('chat',{
    uid: CU.uid||CU.id,
    name: CU.name,
    role: CU.role,
    text: txt.trim(),
    time: ts(),
    _ts: Date.now()
  });
  document.getElementById('chat-inp').value='';
}

function pgDocs(){
  if(!p('docs')&&CU.role!=='manager'){
    $('page').innerHTML='<div class="panel" style="text-align:center;padding:60px"><div style="font-size:40px">⛔</div><div style="margin-top:12px">ليس لديك صلاحية لعرض المستندات</div></div>';
    return;
  }
  // المدير فقط دائماً، أو من يمنحه المدير صلاحية
  const canViewDocs = CU.role==='manager' || CU.perms?.docs;
  if(!canViewDocs){
    $('page').innerHTML='<div style="text-align:center;padding:60px;color:var(--mt)"><div style="font-size:48px">🔒</div><div style="margin-top:12px">غير مصرح بعرض المستندات</div></div>';
    return;
  }
  const canDownload = CU.role==='manager' || CU.perms?.downloadDocs;
  const canUpload   = CU.role==='manager';
  const canDelete   = CU.role==='manager';

  FBDB.ref('cctv/docs').once('value').then(snap=>{
    const docs = snap.val() ? Object.values(snap.val()).sort((a,b)=>(b._ts||0)-(a._ts||0)) : [];
    $('page').innerHTML=`
    <div class="ph">
      <div class="pt">📁 المستندات والعقود</div>
      ${canUpload?`<button class="btn btn-bl" onclick="openAddDoc()">+ رفع مستند</button>`:''}
    </div>
    <div style="padding:0 16px">
      ${docs.length?`
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">
        ${['الكل','عقد','تقرير','تصريح','صورة','أخرى'].map(t=>
          `<button class="btn btn-sm btn-gy" onclick="filterDocs('${t}',this)">${t}</button>`
        ).join('')}
      </div>
      <div id="docs-list">
        ${renderDocsList(docs, canDownload, canDelete)}
      </div>`
      :'<div style="text-align:center;padding:60px;color:var(--mt)"><div style="font-size:48px">📁</div><div style="margin-top:12px">لا مستندات بعد</div></div>'}
    </div>`;
  });
}

function renderDocsList(docs, canDownload, canDelete){
  if(canDownload===undefined) canDownload = CU.role==='manager' || CU.perms?.downloadDocs;
  if(canDelete===undefined)   canDelete   = CU.role==='manager';
  const icons = {عقد:'📄',تقرير:'📊',تصريح:'📋',صورة:'🖼️',أخرى:'📎'};
  return docs.map(d=>`
  <div class="panel" style="margin-bottom:8px;display:flex;align-items:center;gap:12px">
    <div style="font-size:28px">${icons[d.category]||'📎'}</div>
    <div style="flex:1">
      <div style="font-weight:600;font-size:17px">${esc(d.name)}</div>
      <div style="font-size:11px;color:var(--mt)">${esc(d.category)} — ${esc(d.site||'عام')} — ${esc(d.date)}</div>
      ${d.notes?`<div style="font-size:11px;color:var(--mt)">${esc(d.notes)}</div>`:''}
    </div>
    <div style="display:flex;gap:5px">
      ${canDownload?`<a href="${d.url}" target="_blank" download="${esc(d.name)}" class="btn btn-sm btn-bl">⬇️</a>`:'<span style="font-size:11px;color:var(--mt);padding:4px 8px">👁️ عرض فقط</span>'}
      ${canDelete?`<button class="btn btn-sm btn-rd" onclick="delDoc('${d.id}')">🗑</button>`:''}
    </div>
  </div>`).join('');
}

function filterDocs(type, btn){
  document.querySelectorAll('.ph ~ div .btn-gy').forEach(b=>b.classList.remove('act'));
  btn.classList.add('act');
  FBDB.ref('cctv/docs').once('value').then(snap=>{
    let docs = snap.val() ? Object.values(snap.val()).sort((a,b)=>(b._ts||0)-(a._ts||0)) : [];
    if(type!=='الكل') docs = docs.filter(d=>d.category===type);
    const el = document.getElementById('docs-list');
    if(el) el.innerHTML = docs.length ? renderDocsList(docs) : '<div style="text-align:center;padding:30px;color:var(--mt)">لا مستندات</div>';
  });
}

function uploadDoc(){
  const name = val('dc-name');
  const file = document.getElementById('dc-file')?.files[0];
  if(!name||!file){ toast('الاسم والملف مطلوبان','err'); return; }
  if(file.size > 2*1024*1024){ toast('الملف كبير جداً (الحد 2MB)','err'); return; }
  toast('⏳ جار الرفع...');
  const reader = new FileReader();
  reader.onload = e=>{
    const id = gid();
    const doc = {
      id, name, url: e.target.result,
      category: val('dc-cat'),
      site: val('dc-site'),
      notes: val('dc-notes'),
      by: CU.name, date: ts(), _ts: Date.now(),
      fileType: file.type, fileSize: Math.round(file.size/1024)+'KB'
    };
    fbSet('docs/'+id, doc);
    logAct('رفع مستند', name+' — '+doc.category);
    closeModal();
    toast('✅ تم رفع المستند');
    pgDocs();
  };
  reader.readAsDataURL(file);
}

function delDoc(id){
  confirmDel('حذف المستند نهائياً؟', `fbDel('docs/${id}');toast('تم الحذف','err');pgDocs()`);
}

let _bubbleOpen = false;
let _bubbleChatListener = null;
let _lastMsgCount = 0;

function toggleMsgBubble(){
  _bubbleOpen = !_bubbleOpen;
  const panel = document.getElementById('msg-bubble-panel');
  if(panel) panel.classList.toggle('open', _bubbleOpen);
  if(_bubbleOpen){
    hideBubbleBadge();
    loadBubbleChat();
    setTimeout(()=>{ const inp=document.getElementById('bubble-inp'); if(inp) inp.focus(); },200);
  }
}

function loadBubbleChat(){
  const myUid = CU?.uid||CU?.id;
  if(_bubbleChatListener) FBDB.ref('cctv/chat').off('value', _bubbleChatListener);
  _bubbleChatListener = FBDB.ref('cctv/chat').limitToLast(30).on('value', snap=>{
    const msgs = snap.val() ? Object.values(snap.val()).sort((a,b)=>(a._ts||0)-(b._ts||0)) : [];
    const el = document.getElementById('bubble-msgs');
    if(!el) return;

    // إشعار رسائل جديدة
    if(!_bubbleOpen && msgs.length > _lastMsgCount && _lastMsgCount > 0){
      showBubbleBadge(msgs.length - _lastMsgCount);
    }
    _lastMsgCount = msgs.length;

    if(!msgs.length){ el.innerHTML='<div style="text-align:center;color:var(--mt);font-size:13px;padding:20px">لا رسائل</div>'; return; }

    el.innerHTML = msgs.map(m=>{
      const isMe = m.uid === myUid;
      const av = m.name?m.name[0]:'?';
      const avColor = RC[m.role]||'var(--bl)';
      return `<div style="display:flex;flex-direction:${isMe?'row-reverse':'row'};align-items:flex-end;gap:5px;margin-bottom:4px">
        ${!isMe?`<div style="width:26px;height:26px;border-radius:50%;background:${avColor};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;flex-shrink:0">${av}</div>`:''}
        <div style="max-width:75%">
          ${!isMe?`<div style="font-size:11px;color:${avColor};font-weight:700;margin-bottom:1px;padding-right:4px">${esc(m.name)}</div>`:''}
          <div style="background:${isMe?'linear-gradient(135deg,#0084ff,#0066cc)':'var(--sf)'};color:${isMe?'#fff':'var(--tx)'};
            padding:8px 12px;border-radius:${isMe?'16px 16px 4px 16px':'16px 16px 16px 4px'};
            font-size:14px;line-height:1.4;box-shadow:0 1px 3px rgba(0,0,0,.15);word-break:break-word">
            ${esc(m.text)}
          </div>
          <div style="font-size:10px;color:var(--mt);margin-top:2px;padding:0 4px;text-align:${isMe?'left':'right'}">${esc(m.time||'')}</div>
        </div>
      </div>`;
    }).join('');
    el.scrollTop = el.scrollHeight;
  });
}

function sendBubbleChat(){
  const inp = document.getElementById('bubble-inp');
  const txt = inp?.value?.trim();
  if(!txt) return;
  fbPush('chat',{ uid:CU.uid||CU.id, name:CU.name, role:CU.role, text:txt, time:ts(), _ts:Date.now() });
  inp.value = '';
}

function showBubbleBadge(count){
  const badge = document.getElementById('msg-bubble-badge');
  if(badge){ badge.style.display='flex'; badge.textContent=count>9?'9+':count; }
}
function hideBubbleBadge(){
  const badge = document.getElementById('msg-bubble-badge');
  if(badge){ badge.style.display='none'; badge.textContent=''; }
}

function showMsgBubble(){
  const wrap = document.getElementById('msg-bubble-wrap');
  if(wrap) wrap.style.display='flex';
  loadBubbleChat();
}
function hideMsgBubble(){
  const wrap = document.getElementById('msg-bubble-wrap');
  if(wrap) wrap.style.display='none';
  if(_bubbleChatListener){ FBDB.ref('cctv/chat').off('value',_bubbleChatListener); _bubbleChatListener=null; }
}

function pgSiteInventory(){
  if(!p('siteinv')&&CU.role!=='manager'){
    $('page').innerHTML='<div class="panel" style="text-align:center;padding:60px"><div style="font-size:40px">⛔</div><div style="margin-top:12px">ليس لديك صلاحية لعرض جرد الموجودات</div></div>';
    return;
  }
  const sites = getVisibleFieldSites();
  if(!sites.length){
    $('page').innerHTML=`<div style="text-align:center;padding:60px;color:var(--mt)">لا مواقع متاحة</div>`;
    return;
  }

  const selSite = window._invSite || sites[0].id;
  window._invSite = selSite;
  const site = sites.find(s=>s.id===selSite) || sites[0];

  // المستودع المرتبط بالموقع
  const linkedWarehouse = site.warehouse || '';
  const whItems = linkedWarehouse ? (DB.inv[linkedWarehouse]||[]) : [];
  // فقط المواد المنصوبة في هذا الموقع الميداني تحديداً (بـ fieldSiteId أو installedAt)
  const deployedHere = whItems.filter(it=>
    it.status==='deployed' && (
      it.fieldSiteId === site.id ||
      (it.installedAt && it.installedAt.startsWith(site.name))
    )
  );

  FBDB.ref('cctv/siteInventory/'+site.id).once('value').then(snap=>{
    const points = snap.val() ? Object.values(snap.val()).sort((a,b)=>(a.order||0)-(b.order||0)) : [];
    const totalItems = points.reduce((s,pt)=>(s + (pt.items ? Object.values(pt.items).length : 0)), 0);
    const working = points.reduce((s,pt)=>(s + (pt.items ? Object.values(pt.items).filter(i=>i.status==='يعمل').length : 0)), 0);
    const broken  = points.reduce((s,pt)=>(s + (pt.items ? Object.values(pt.items).filter(i=>i.status==='معطل').length : 0)), 0);

    $('page').innerHTML=`
    <div class="ph">
      <div>
        <div class="pt">📦 جرد الموجودات الثابتة</div>
        <div class="ps" style="display:flex;gap:12px;flex-wrap:wrap;margin-top:4px">
          <span>📍 ${points.length} نقطة</span>
          <span>📋 ${totalItems} عنصر</span>
          <span style="color:var(--gn)">✅ ${working} يعمل</span>
          <span style="color:var(--rd)">❌ ${broken} معطل</span>
        </div>
        ${linkedWarehouse?`<div style="font-size:12px;color:var(--bl);margin-top:4px">🏭 مرتبط بـ: ${esc(linkedWarehouse)} (${deployedHere.length} عنصر منصوب)</div>`:'<div style="font-size:11px;color:var(--mt);margin-top:4px">⚠️ غير مرتبط بمستودع — عدّل الموقع لتحديد المستودع</div>'}
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${CU.role==='manager'?`<button class="btn btn-gy" onclick="openEditFieldSite('${site.id}')">⚙️ ربط مستودع</button>`:''}
        ${CU.role==='manager'||p('addItem')?`<button class="btn btn-bl" onclick="openAddSitePoint('${site.id}')">+ نقطة</button>`:''}
        ${CU.role==='manager'?`<button class="btn btn-gy" onclick="exportSiteInventory('${site.id}','${esc(site.name)}')">⬇️ تصدير</button>`:''}
        ${CU.role==='manager'?`<button class="btn btn-pu" onclick="openBulkExcelImport('siteinv')">📥 استيراد جماعي</button>`:''}
      </div>
    </div>

    <!-- تبويبات المواقع مع المستودع الأب -->
    <div class="tabs" style="margin-bottom:14px">
      ${sites.map(s=>`
        <button class="tb${s.id===site.id?' act':''}" onclick="window._invSite='${s.id}';pgSiteInventory()">
          📍 ${esc(s.name)}
          ${s.warehouse?`<span style="font-size:10px;opacity:.6;display:block">🏭 ${esc(s.warehouse)}</span>`:''}
        </button>`).join('')}
    </div>

    ${linkedWarehouse&&deployedHere.length?`
    <div class="panel" style="margin-bottom:12px;padding:0;overflow:hidden;border-right:3px solid var(--bl)">
      <div onclick="const b=document.getElementById('dep-wh-list');const a=document.getElementById('dep-wh-arr');const open=b.style.display!=='none';b.style.display=open?'none':'block';a.style.transform=open?'':'rotate(90deg)'"
        style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;cursor:pointer;user-select:none">
        <div style="display:flex;align-items:center;gap:10px">
          <span id="dep-wh-arr" style="font-size:16px;transition:transform .25s;color:var(--mt)">▶</span>
          <div>
            <span style="font-weight:700">📦 مواد منصوبة من ${esc(linkedWarehouse)}</span>
            <span style="font-size:11px;color:var(--mt);margin-right:8px">${deployedHere.length} عنصر</span>
          </div>
        </div>
      </div>
      <div id="dep-wh-list" style="display:none;padding:0 14px 12px;border-top:1px solid var(--br)">
        ${deployedHere.map(it=>`
          <div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--br)">
            <div>
              <span style="font-size:13px;font-weight:600">${esc(it.name||it.serial)}</span>
              ${it.installedAt?`<span style="font-size:11px;color:var(--mt);margin-right:6px">@ ${esc(it.installedAt)}</span>`:''}
            </div>
            ${badge(it.status)}
          </div>`).join('')}
      </div>
    </div>`:''}

    <!-- النقاط -->
    <div id="inv-points">
      ${points.length
        ? points.map(pt=>renderSitePoint(pt, site.id)).join('')
        : `<div class="panel" style="text-align:center;padding:50px;color:var(--mt)">
            <div style="font-size:48px">📦</div>
            <div style="margin-top:12px;font-size:17px">لا نقاط بعد — أضف أول نقطة جرد</div>
          </div>`
      }
    </div>`;
  });
}

function renderSitePoint(pt, siteId){
  const items = pt.items ? Object.values(pt.items) : [];
  const working = items.filter(i=>i.status==='يعمل').length;
  const broken  = items.filter(i=>i.status==='معطل').length;
  const maint   = items.filter(i=>i.status==='صيانة').length;
  const canEdit = CU.role==='manager' || p('addItem');
  const pid = 'pt-'+pt.id;

  return `<div class="panel" style="margin-bottom:10px;padding:0;overflow:hidden">
    <!-- هيدر النقطة — قابل للضغط -->
    <div onclick="toggleSitePoint('${pid}')"
      style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;cursor:pointer;user-select:none">
      <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0">
        <span id="${pid}-arrow" style="font-size:18px;transition:transform .25s;display:inline-block">▶</span>
        <div>
          <div style="font-weight:700;font-size:16px">📌 ${esc(pt.name)}</div>
          ${pt.desc?`<div style="font-size:12px;color:var(--mt)">${esc(pt.desc)}</div>`:''}
          <div style="display:flex;gap:8px;margin-top:3px;font-size:12px">
            <span style="color:var(--mt)">${items.length} عنصر</span>
            ${working?`<span style="color:var(--gn)">✅ ${working}</span>`:''}
            ${broken?`<span style="color:var(--rd)">❌ ${broken}</span>`:''}
            ${maint?`<span style="color:var(--yl)">🔧 ${maint}</span>`:''}
          </div>
        </div>
      </div>
      <!-- أزرار التحكم -->
      ${canEdit?`<div style="display:flex;gap:5px;flex-shrink:0" onclick="event.stopPropagation()">
        <button class="btn btn-sm btn-bl" onclick="openAddSiteItem('${siteId}','${pt.id}')">+ عنصر</button>
        <button class="btn btn-sm btn-gy" onclick="openEditSitePoint('${siteId}','${pt.id}')">✏️</button>
        <button class="btn btn-sm btn-rd" onclick="delSitePoint('${siteId}','${pt.id}')">🗑️</button>
      </div>`:''}
    </div>
    <!-- عناصر النقطة — مخفية افتراضياً -->
    <div id="${pid}" style="display:none;padding:0 14px 12px;border-top:1px solid var(--br)">
      ${items.length?`
      <div style="display:flex;flex-direction:column;gap:6px;margin-top:10px">
        ${items.map(item=>renderSiteItem(item, siteId, pt.id, canEdit)).join('')}
      </div>`:`<div style="text-align:center;padding:16px;color:var(--mt);font-size:13px">لا عناصر — اضغط "+ عنصر"</div>`}
    </div>
  </div>`;
}

function toggleSitePoint(pid){
  const body  = document.getElementById(pid);
  const arrow = document.getElementById(pid+'-arrow');
  if(!body) return;
  const isOpen = body.style.display !== 'none';
  body.style.display  = isOpen ? 'none' : 'block';
  if(arrow) arrow.style.transform = isOpen ? '' : 'rotate(90deg)';
}

function renderSiteItem(item, siteId, ptId, canEdit){
  const stColors = {'يعمل':'var(--gn)','معطل':'var(--rd)','صيانة':'var(--yl)'};
  const stIcons  = {'يعمل':'✅','معطل':'❌','صيانة':'🔧'};
  const col = stColors[item.status]||'var(--mt)';
  const ico = stIcons[item.status]||'❓';
  const AT = allT();
  const typeLabel = item.itemType && AT[item.itemType] ? AT[item.itemType].icon+' '+AT[item.itemType].label : '';

  return `<div style="display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:10px;padding:10px 12px;border:1px solid var(--br)">
    <!-- أيقونة النوع أو صورة مصغرة -->
    ${item.photo
      ?`<div onclick="viewPhoto('${item.photo}')" style="width:40px;height:40px;border-radius:8px;overflow:hidden;cursor:pointer;flex-shrink:0;border:1px solid var(--br)">
          <img src="${item.photo}" style="width:100%;height:100%;object-fit:cover">
        </div>`
      :`<div style="width:40px;height:40px;border-radius:8px;background:var(--sf);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;border:1px solid var(--br)">
          ${AT[item.itemType]?.icon||'📦'}
        </div>`}
    <!-- التفاصيل -->
    <div style="flex:1;min-width:0">
      <div style="font-weight:700;font-size:15px">${esc(item.name)}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:3px;font-size:12px;color:var(--mt)">
        ${typeLabel?`<span style="color:var(--bl)">${typeLabel}</span>`:''}
        <span>الكمية: <b style="color:var(--tx)">${item.qty||1}</b></span>
        ${item.serial?`<span>SN: <b style="color:var(--bl)">${esc(item.serial)}</b></span>`:''}
        <span style="color:${col};font-weight:700">${ico} ${esc(item.status||'—')}</span>
      </div>
      ${item.notes?`<div style="font-size:11px;color:var(--mt);margin-top:2px">${esc(item.notes)}</div>`:''}
    </div>
    <!-- أزرار -->
    ${canEdit?`<div style="display:flex;gap:4px;flex-shrink:0">
      <button class="btn btn-sm btn-gy" onclick="openEditSiteItem('${siteId}','${ptId}','${item.id}')">✏️</button>
      <button class="btn btn-sm btn-rd" onclick="delSiteItem('${siteId}','${ptId}','${item.id}')">🗑️</button>
    </div>`:''}
  </div>`;
}

function openAddSitePoint(siteId){
  openModal(`${mhd('📌 إضافة نقطة جرد')}
  <div style="display:flex;flex-direction:column;gap:10px">
    <div class="field"><label>اسم النقطة *</label><input id="sp-name" placeholder="مثال: المدخل الرئيسي، غرفة المراقبة..."></div>
    <div class="field"><label>وصف (اختياري)</label><input id="sp-desc" placeholder="وصف مختصر"></div>
  </div>
  <div class="mft" style="margin-top:14px">
    <button class="btn btn-gy" onclick="closeModal()">إلغاء</button>
    <button class="btn btn-bl" onclick="saveSitePoint('${siteId}')">💾 حفظ</button>
  </div>`);

function saveSitePoint(siteId, ptId){
  const name = val('sp-name');
  if(!name){ toast('اسم النقطة مطلوب','err'); return; }
  const id = ptId || gid();
  const data = { id, name, desc: val('sp-desc')||'', order: Date.now(), _ts: Date.now() };
  fbSet('siteInventory/'+siteId+'/'+id, data);
  logAct('نقطة جرد', name);
  closeModal();
  toast('✅ تم الحفظ');
  pgSiteInventory();
}

function openEditSitePoint(siteId, ptId){
  FBDB.ref('cctv/siteInventory/'+siteId+'/'+ptId).once('value').then(snap=>{
    const pt = snap.val();
    if(!pt) return;
    openModal(`${mhd('✏️ تعديل النقطة')}

  });
}

function delSitePoint(siteId, ptId){

  </div>
  <div class="mft" style="margin-top:14px">
    <button class="btn btn-gy" onclick="closeModal()">إلغاء</button>

function saveSiteItem(siteId, ptId, itemId){
  const name = val('si-name');
  if(!name){ toast('اسم العنصر مطلوب','err'); return; }
  const file = document.getElementById('si-photo')?.files[0];

  function doSave(photoData){
    const id = itemId || gid();
    const data = {
      id, name,
      itemType: val('si-type')||'',
      qty: parseInt(val('si-qty'))||1,
      serial: val('si-serial')||'',
      status: val('si-status')||'يعمل',
      notes: val('si-notes')||'',
      photo: photoData||'',
      by: CU.name, date: ts(), _ts: Date.now()
    };
    fbSet('siteInventory/'+siteId+'/'+ptId+'/items/'+id, data);
    logAct('جرد ثابت', name+' — '+data.status);
    closeModal();
    toast('✅ تم الحفظ');
    pgSiteInventory();
  }

  if(file){
    if(file.size > 500*1024){ toast('الصورة كبيرة — الحد 500KB','err'); return; }
    const reader = new FileReader();
    reader.onload = e => doSave(e.target.result);
    reader.readAsDataURL(file);
  } else {
    doSave('');
  }
}

// ── تصدير الجرد ──
function exportSiteInventory(siteId, siteName){
  if(CU.role!=='manager'){toast('التصدير محصور بالمدير فقط','err');return;}
  FBDB.ref('cctv/siteInventory/'+siteId).once('value').then(snap=>{
    const points = snap.val() ? Object.values(snap.val()) : [];

    // بناء مصفوفة البيانات
    const headers = ['الموقع','النقطة','العنصر','الكمية','الرقم التسلسلي','الحالة','ملاحظات','التاريخ'];
    const rows = [headers];
    points.forEach(pt=>{
      const items = pt.items ? Object.values(pt.items) : [];
      items.forEach(item=>{
        rows.push([
          siteName, pt.name||'', item.name||'', item.qty||1,
          item.serial||'', item.status||'', item.notes||'', fmtDate(item.date)
        ]);
      });
    });

    if(rows.length === 1){ toast('لا يوجد بيانات للتصدير','warn'); return; }

    // بناء HTML Table يفتحه Excel بشكل صحيح كجداول
    let html = '<html dir="rtl" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel">';
    html += '<head><meta charset="utf-8">';
    html += '<style>table{border-collapse:collapse}th,td{border:1px solid #999;padding:8px 12px;font-family:Arial;font-size:16px}th{background:#1e3a5f;color:#fff;font-weight:600;font-size:18px}tr:nth-child(even) td{background:#f0f4f8}</style>';
    html += '</head><body><table>';
    rows.forEach((row, ri)=>{
      html += '<tr>';
      row.forEach(cell=>{
        if(ri===0) html += `<th>${cell}</th>`;
        else html += `<td>${cell}</td>`;
      });
      html += '</tr>';
    });
    html += '</table></body></html>';

    const blob = new Blob(['\uFEFF'+html], {type:'application/vnd.ms-excel;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'جرد_'+siteName+'_'+new Date().toISOString().split('T')[0]+'.xls';
    a.click();
    URL.revokeObjectURL(url);
    toast('✅ تم التصدير كجدول Excel');
  });
}

//  ⏱️ مؤقت الأعطال
// ═══════════════════════════════════════════════════════
function faultAge(f){
  if(!f._ts) return '';
  const ms = Date.now() - f._ts;
  const h  = Math.floor(ms / 3600000);
  const m  = Math.floor((ms % 3600000) / 60000);
  if(h >= 72) return { txt: Math.floor(h/24)+'ي', color:'#f85149', urgent:true };
  if(h >= 24) return { txt: h+'س', color:'#f85149', urgent:true };
  if(h >= 1)  return { txt: h+'س '+m+'د', color:'#d29922', urgent:false };
  return { txt: m+'د', color:'var(--gn)', urgent:false };
}

// ═══════════════════════════════════════════════════════
function pgMyTasks(){
  const myFaults = getVisibleFaults().filter(f=>
    f.status!=='resolved' && (
      f.assignedTo===CU.name ||
      f.by===CU.name ||
      CU.role==='manager' ||
      CU.role==='engineer'
    )
  ).sort((a,b)=>{
    const pri = {high:0,medium:1,low:2};
    return (pri[a.priority]||1)-(pri[b.priority]||1);
  });

  const done  = getVisibleFaults().filter(f=>f.status==='resolved'&&f.resolvedBy===CU.name);
  const today = new Date().toDateString();
  const todayDone = done.filter(f=>f._tsResolved && new Date(f._tsResolved).toDateString()===today);

  $('page').innerHTML = `
  <div class="ph">
    <div>
      <div class="pt">📋 مهامي</div>
      <div class="ps" style="display:flex;gap:12px;margin-top:4px">
        <span style="color:var(--rd)">🔴 ${myFaults.filter(f=>f.priority==='high').length} عاجل</span>
        <span style="color:var(--yl)">🟡 ${myFaults.filter(f=>f.status==='inprogress').length} جاري</span>
        <span style="color:var(--gn)">✅ ${todayDone.length} أنجزت اليوم</span>
      </div>
    </div>
  </div>

  ${myFaults.length===0
    ? `<div class="panel" style="text-align:center;padding:50px;color:var(--mt)">
        <div style="font-size:48px">✅</div>
        <div style="margin-top:12px;font-size:17px">لا مهام معلقة — أحسنت!</div>
       </div>`
    : myFaults.map(f=>{
        const age = faultAge(f);
        const pri = f.priority==='high'?'🔴':f.priority==='medium'?'🟡':'🟢';
        const st  = FAULT_ST.find(x=>x.k===f.status)||FAULT_ST[0];
        const ri  = DB.faults.indexOf(f);
        return `<div class="panel" style="margin-bottom:10px;border-right:4px solid ${st.c}">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
            <div style="flex:1">
              <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px">
                <span>${pri}</span>
                <span style="font-weight:700;font-size:16px">${esc(f.location)}</span>
                <span style="font-size:13px;color:var(--mt)">— ${esc(f.pointId)}</span>
              </div>
              <div style="font-size:14px;color:var(--mt);margin-bottom:4px">${esc(f.reason)}</div>
              <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
                <span style="font-size:12px;background:${st.c}22;color:${st.c};padding:2px 8px;border-radius:10px">${st.ico} ${st.l}</span>
                ${age?`<span style="font-size:12px;color:${age.color};font-weight:700">${age.urgent?'🔴':'🟡'} ${age.txt}</span>`:''}
              </div>
            </div>
            ${p('updFault')&&canAccessFault(f)?`
            <div style="display:flex;flex-direction:column;gap:5px;flex-shrink:0">
              ${f.status==='open'?`<button class="btn btn-sm" style="background:#d2992222;color:var(--yl);border:1px solid #d2992244" onclick="doUpdFault(${ri},'inprogress')">🔧 بدء</button>`:''}
              ${f.status==='inprogress'?`<button class="btn btn-sm btn-gn" onclick="doUpdFault(${ri},'resolved')">✅ إنهاء</button>`:''}
            </div>`:''}
          </div>
        </div>`;
      }).join('')
  }`;
}


// ═══════════════════════════════════════════════════════
//  📊 رسم بياني للأعطال
// ═══════════════════════════════════════════════════════
function renderFaultChart(){
  const el = document.getElementById('fault-chart');
  if(!el) return;
  // آخر 6 أشهر
  const months = [];
  for(let i=5;i>=0;i--){
    const d = new Date(); d.setMonth(d.getMonth()-i);
    months.push({ y:d.getFullYear(), m:d.getMonth(),
      label: d.toLocaleDateString('ar-IQ',{month:'short'}) });
  }
  const counts = months.map(mo=>
    DB.faults.filter(f=>{
      const d = f._ts ? new Date(f._ts) : null;
      return d && d.getFullYear()===mo.y && d.getMonth()===mo.m;
    }).length
  );
  const resolved = months.map(mo=>
    DB.faults.filter(f=>{
      const d = f._tsResolved ? new Date(f._tsResolved) : null;
      return d && d.getFullYear()===mo.y && d.getMonth()===mo.m;
    }).length
  );
  const max = Math.max(...counts, ...resolved, 1);
  el.innerHTML = `
  <div style="font-size:13px;font-weight:700;color:var(--tx);margin-bottom:10px">📊 الأعطال — آخر 6 أشهر</div>
  <div style="display:flex;align-items:flex-end;gap:8px;height:80px">
    ${months.map((mo,i)=>`
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px">
      <div style="font-size:10px;color:var(--mt)">${counts[i]||''}</div>
      <div style="width:100%;background:#f8514966;border-radius:4px 4px 0 0;height:${Math.round((counts[i]/max)*64)+4}px;min-height:4px"></div>
      <div style="width:100%;background:#3fb95066;border-radius:4px 4px 0 0;height:${Math.round((resolved[i]/max)*64)+4}px;min-height:4px;margin-top:2px"></div>
      <div style="font-size:10px;color:var(--mt)">${mo.label}</div>
    </div>`).join('')}
  </div>
  <div style="display:flex;gap:12px;margin-top:8px;font-size:11px">
    <span><span style="display:inline-block;width:10px;height:10px;background:#f8514966;border-radius:2px;margin-left:4px"></span>مُبلَّغ</span>
    <span><span style="display:inline-block;width:10px;height:10px;background:#3fb95066;border-radius:2px;margin-left:4px"></span>محلول</span>
  </div>`;
}


// ═══════════════════════════════════════════════════════
//  📋 نظام المهام

function pgTasks(){
  const isManager = CU.role==='manager'||CU.role==='engineer';
  const allTasks = DB.tasks||[];
  const myTasks  = isManager ? allTasks : allTasks.filter(t=>
    t.assignedTo===CU.name||(t.assignedToId&&t.assignedToId===(CU.uid||CU.id)));
  const open = myTasks.filter(t=>t.status!=='done');
  const done = myTasks.filter(t=>t.status==='done');

  $('page').innerHTML = `
  <div class="ph">
    <div>
      <div class="pt">📋 المهام</div>
      <div class="ps" style="display:flex;gap:12px;margin-top:4px">
        <span style="color:var(--rd)">${open.filter(t=>t.priority==='high').length} عاجل</span>
        <span style="color:var(--yl)">${open.filter(t=>t.status==='inprogress').length} جاري</span>
        <span style="color:var(--gn)">✅ ${done.length} منجز</span>
      </div>
    </div>
    ${isManager?`<button class="btn btn-bl" onclick="openAddTask()">+ مهمة جديدة</button>`:''}
  </div>

  ${open.length===0&&done.length===0
    ?`<div class="panel" style="text-align:center;padding:50px;color:var(--mt)">
        <div style="font-size:48px">📋</div>
        <div style="margin-top:12px;font-size:17px">لا مهام — ${isManager?'اضغط + لإضافة مهمة':'لا مهام معينة لك'}</div>
      </div>`
    :`<div style="display:flex;flex-direction:column;gap:8px">
        ${open.map(t=>renderTaskCard(t,isManager)).join('')}
        ${done.length?`
        <div style="font-size:13px;color:var(--mt);margin:10px 0 4px;font-weight:700">✅ المنجزة (${done.length})</div>
        ${done.slice(0,5).map(t=>renderTaskCard(t,isManager)).join('')}
        ${done.length>5?`<div style="text-align:center;font-size:13px;color:var(--mt);padding:8px">${done.length-5} مهمة منجزة أخرى</div>`:''}
        `:''}
      </div>`
  }`;
  }

function renderTaskCard(t, isManager){
  const pri   = t.priority==='high'?{c:'#f85149',ic:'🔴'}:t.priority==='medium'?{c:'#d29922',ic:'🟡'}:{c:'#3fb950',ic:'🟢'};
  const stMap = {open:{l:'مفتوحة',c:'var(--mt)'},inprogress:{l:'جاري',c:'var(--yl)'},done:{l:'منجزة',c:'var(--gn)'}};
  const st    = stMap[t.status]||stMap.open;
  const age   = faultAge({_ts:t._ts,status:t.status==='done'?'resolved':'open'});
  const overdue = t.dueDate && t.status!=='done' && new Date(t.dueDate)<new Date();

  return `<div class="panel" style="border-right:4px solid ${pri.c};padding:14px">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
      <div style="flex:1;min-width:0">
        <div style="display:flex;gap:6px;align-items:center;margin-bottom:5px;flex-wrap:wrap">
          <span>${pri.ic}</span>
          <span style="font-weight:700;font-size:16px">${esc(t.title)}</span>
          <span style="font-size:12px;background:${st.c}22;color:${st.c};padding:2px 8px;border-radius:10px">${st.l}</span>
        </div>
        ${t.desc?`<div style="font-size:13px;color:var(--mt);margin-bottom:4px">${esc(t.desc)}</div>`:''}
        <div style="display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mt)">
          <span>👤 ${esc(t.assignedTo)}</span>
          ${t.location?`<span>📍 ${esc(t.location)}</span>`:''}
          ${t.dueDate?`<span style="color:${overdue?'var(--rd)':'var(--mt)'}">${overdue?'⚠️ ':''} 📅 ${t.dueDate}</span>`:''}
          ${age&&t.status!=='done'?`<span style="color:${age.color};font-weight:700">${age.urgent?'🔴':'🟡'} ${age.txt}</span>`:''}
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0">
        ${t.status==='open'&&!isManager?`<button class="btn btn-sm" style="background:#d2992222;color:var(--yl);border:1px solid #d2992244" onclick="updTask('${t.id}','inprogress')">🔧 بدء</button>`:''}
        ${t.status==='inprogress'?`<button class="btn btn-sm btn-gn" onclick="updTask('${t.id}','done')">✅ إنجاز</button>`:''}
        ${t.status==='done'?`<button class="btn btn-sm btn-gy" onclick="updTask('${t.id}','open')">↩️ إعادة</button>`:''}
        ${isManager?`
        <button class="btn btn-sm btn-gy" onclick="openEditTask('${t.id}')">✏️</button>
        <button class="btn btn-sm btn-rd" onclick="delTask('${t.id}')">🗑️</button>`:''}
      </div>
    </div>
  </div>`;
}

function saveTask(taskId){
  const title = val('tk-title');
  if(!title){ toast('عنوان المهمة مطلوب','err'); return; }
  const assignRaw = val('tk-assign');
  const [assignName, assignId] = assignRaw ? assignRaw.split('|') : ['',''];
  if(!assignName){ toast('يجب تعيين المهمة لشخص','err'); return; }

  const data = {
    title, desc: val('tk-desc')||'',
    assignedTo: assignName, assignedToId: assignId||'',
    location: val('tk-loc')||'',
    priority: val('tk-pri')||'medium',
    dueDate: val('tk-due')||'',
    status: 'open', by: CU.name,
    _ts: Date.now(), date: ts()
  };

  if(taskId){
    fbUpdate('tasks/'+taskId, data);
    toast('✅ تم تحديث المهمة');
  } else {
    data.id = gid();
    fbSet('tasks/'+data.id, data);
    // إشعار للمعين
    // إشعار للشخص المعين فقط
    pushToUser('📋 مهمة جديدة: '+title+' — من '+CU.name, [assignId], 'info');
    toast('✅ تمت إضافة المهمة');
    logAct('مهمة جديدة', title+' → '+assignName);
  }
  closeModal();
  setTimeout(pgTasks, 300);
}

function openEditTask(taskId){
  FBDB.ref('cctv/tasks/'+taskId).once('value').then(snap=>{
    const t = snap.val(); if(!t) return;
    const users = DB.users.filter(u=>u.active&&u.role!=='manager'&&u.role!=='viewer');
    const sites = getVisibleFieldSites();
    openModal(mhd('✏️ تعديل المهمة')
    +`<div class="fg">
      <div class="s2 field"><label>عنوان المهمة *</label><input id="tk-title" value="${esc(t.title)}"></div>
      <div class="s2 field"><label>الوصف</label><textarea id="tk-desc" rows="2">${esc(t.desc||'')}</textarea></div>
      <div class="field"><label>تعيين إلى *</label>
        <select id="tk-assign">
          ${users.map(u=>`<option value="${esc(u.name)}|${esc(u.uid||u.id)}" ${t.assignedTo===u.name?'selected':''}>${esc(u.name)} (${ROLES[u.role]||u.role})</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>الموقع</label>
        <select id="tk-loc">
          <option value="">— اختياري —</option>
          ${sites.map(s=>`<option ${t.location===s.name?'selected':''}>${esc(s.name)}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>الأولوية</label>
        <select id="tk-pri">
          <option value="low" ${t.priority==='low'?'selected':''}>🟢 منخفض</option>
          <option value="medium" ${t.priority==='medium'?'selected':''}>🟡 متوسط</option>
          <option value="high" ${t.priority==='high'?'selected':''}>🔴 عالي</option>
        </select>
      </div>
      <div class="field"><label>الموعد النهائي</label>
        <input id="tk-due" type="date" value="${t.dueDate||''}">
      </div>
    </div>
    `+mft('💾 حفظ التعديل',`saveTask('${taskId}')`));
  });
}

function updTask(taskId, status){
  fbUpdate('tasks/'+taskId,{status, _tsUpdated:Date.now()});
  if(status==='done'){ logAct('إنجاز مهمة',''); toast('✅ تم إنجاز المهمة'); }
  else if(status==='inprogress') toast('🔄 المهمة قيد التنفيذ');
  else if(status==='pending') toast('⏳ تم إعادة المهمة للانتظار');
  setTimeout(pgTasks,300);
}

function delTask(taskId){
  confirmDel('حذف هذه المهمة نهائياً؟', `fbDel('tasks/${taskId}');setTimeout(pgTasks,300)`);
}


// ═══════════════════════════════════════════════════════
//  🌐 طبقة البنية التحتية للشبكة
// ═══════════════════════════════════════════════════════

let _netLayer = false;
let _netLines  = [];  // خطوط الكابلات والـ P2P
let _netMarkers = []; // أجهزة الشبكة
let _drawingNet = false;
let _netDrawPoints = [];
let _netDrawMarkers = [];
let _netDrawLine = null;

// ── صلاحية الشبكة ──
function canEditNetwork(){
  if(!CU) return false;
  if(CU.role==='manager') return true;
  return !!(CU.perms?.network_edit);
}
function canViewNetwork(){
  if(!CU) return false;
  if(CU.role==='manager'||CU.role==='engineer') return true;
  return !!(CU.perms?.network_view);
}

// ── تبديل طبقة الشبكة ──
function toggleNetworkLayer(){
  _netLayer = !_netLayer;
  const btn = document.getElementById('btn-network');
  if(btn){
    btn.style.background    = _netLayer ? '#58a6ff22' : 'var(--sf)';
    btn.style.color         = _netLayer ? '#58a6ff'   : 'var(--tx)';
    btn.style.borderColor   = _netLayer ? '#58a6ff44' : 'var(--br)';
  }
  if(_netLayer) loadNetworkLayer();
  else clearNetworkLayer();
}

function clearNetworkLayer(){
  if(window._layerGroups?.network) window._layerGroups.network.clearLayers();
  _netLines=[]; _netMarkers=[];
}

// ── تحميل عناصر الشبكة ──
function loadNetworkLayer(){
  if(!_map||!window._layerGroups) return;
  clearNetworkLayer();
  const lg = window._layerGroups.network;
  FBDB.ref('cctv/network').once('value').then(snap=>{
    if(!snap.val()) return;
    const data = snap.val();

    // كابلات وروابط P2P
    if(data.links){
      Object.values(data.links).forEach(link=>{
        if(!link.points||link.points.length<2) return;
        const isP2P   = link.type==='p2p';
        const isFiber = link.type==='fiber';
        const color   = isFiber?'#ff9500':isP2P?'#58a6ff':'#3fb950';
        const dash    = isP2P?'8,5':isFiber?'none':'4,3';
        const weight  = isFiber?3:isP2P?2.5:2;

        const line = L.polyline(link.points,{
          color, weight, opacity:0.85,
          dashArray: dash==='none'?null:dash
        }).addTo(lg);

        line.bindPopup(`<div style="font-family:inherit;min-width:180px">
          <div style="font-weight:700;font-size:15px;margin-bottom:6px">
            ${isFiber?'🔵':'📡'} ${esc(link.name||'رابط')}
          </div>
          <div style="font-size:13px;color:#666;margin-bottom:4px">
            النوع: <b>${esc(link.typeName||link.type)}</b>
          </div>
          ${link.device?`<div style="font-size:13px;color:#666;margin-bottom:4px">الجهاز: <b>${esc(link.device)}</b></div>`:''}
          ${link.length?`<div style="font-size:13px;color:#666;margin-bottom:4px">الطول: <b>${esc(link.length)} م</b></div>`:''}
          ${link.notes?`<div style="font-size:12px;color:#888;margin-top:4px">${esc(link.notes)}</div>`:''}
          ${canEditNetwork()?`<div style="display:flex;gap:6px;margin-top:8px">
            <button onclick="editNetLink('${link.id}')" style="background:#58a6ff22;color:#58a6ff;border:1px solid #58a6ff44;border-radius:6px;padding:4px 10px;cursor:pointer;font-family:inherit;font-size:12px">✏️ تعديل</button>
            <button onclick="delNetLink('${link.id}')" style="background:#f8514922;color:#f85149;border:1px solid #f8514944;border-radius:6px;padding:4px 10px;cursor:pointer;font-family:inherit;font-size:12px">🗑️ حذف</button>
          </div>`:''}
        </div>`);
        _netLines.push(line);
      });
    }

    // أجهزة الشبكة
    if(data.devices){
      Object.values(data.devices).forEach(dev=>{
        if(!dev.lat||!dev.lng) return;
        const devIcons = {
          switch:'🔀', router:'🌐', odf:'📦', ap:'📶',
          p2p:'📡', nvr:'💾', server:'🖥️', other:'⚙️'
        };
        const ico = devIcons[dev.devType]||'⚙️';
        const icon = L.divIcon({
          html:`<div style="background:#1a2332;border:2px solid #58a6ff;border-radius:8px;
            padding:4px 7px;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.5);
            white-space:nowrap;color:#fff;font-family:Arial">${ico}</div>`,
          className:'', iconAnchor:[16,16]
        });
        const marker = L.marker([dev.lat,dev.lng],{icon}).addTo(lg);
        marker.bindPopup(`<div style="font-family:inherit;min-width:180px">
          <div style="font-weight:700;font-size:15px;margin-bottom:6px">${ico} ${esc(dev.name)}</div>
          ${dev.model?`<div style="font-size:13px;color:#666">الموديل: <b>${esc(dev.model)}</b></div>`:''}
          ${dev.ip?`<div style="font-size:13px;color:#666">IP: <b style="direction:ltr">${esc(dev.ip)}</b></div>`:''}
          ${dev.notes?`<div style="font-size:12px;color:#888;margin-top:4px">${esc(dev.notes)}</div>`:''}
          ${canEditNetwork()?`<div style="display:flex;gap:6px;margin-top:8px">
            <button onclick="editNetDevice('${dev.id}')" style="background:#58a6ff22;color:#58a6ff;border:1px solid #58a6ff44;border-radius:6px;padding:4px 10px;cursor:pointer;font-family:inherit;font-size:12px">✏️ تعديل</button>
            <button onclick="delNetDevice('${dev.id}')" style="background:#f8514922;color:#f85149;border:1px solid #f8514944;border-radius:6px;padding:4px 10px;cursor:pointer;font-family:inherit;font-size:12px">🗑️ حذف</button>
          </div>`:''}
        </div>`);
        _netMarkers.push(marker);
      });
    }
  });
}

// ── إضافة رابط/كابل ──
function openAddNetLink(){
  if(!canEditNetwork()){ toast('لا صلاحية','err'); return; }

function startNetDraw(){
  const name = val('nl-name');
  if(!name){ toast('الاسم مطلوب','err'); return; }
  window._pendingNetLink = {
    id: gid(), name, type: val('nl-type'),
    device: val('nl-device')||'',
    length: val('nl-length')||'',
    notes: val('nl-notes')||''
  };
  closeModal();
  _drawingNet = true;
  _netDrawPoints = []; _netDrawMarkers = [];
  if(_netDrawLine){ _netDrawLine.remove(); _netDrawLine=null; }
  _map.getContainer().style.cursor = 'crosshair';
  toast('🖊️ انقر على الخريطة لرسم المسار — اضغط "إنهاء" عند الانتهاء','warn');

  // زر إنهاء الرسم
  const existing = document.getElementById('net-draw-finish');
  if(existing) existing.remove();
  const btn = document.createElement('button');
  btn.id='net-draw-finish';
  btn.innerHTML='✅ إنهاء الرسم';
  btn.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:9999;background:#3fb950;color:#fff;border:none;border-radius:12px;padding:12px 28px;font-size:16px;font-family:inherit;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.4)';
  btn.onclick = finishNetDraw;
  document.body.appendChild(btn);

  // listener للرسم
  if(!_map._netDrawHandler){
    _map._netDrawHandler = (e)=>{
      if(!_drawingNet) return;
      _netDrawPoints.push([e.latlng.lat, e.latlng.lng]);
      const dot = L.circleMarker(e.latlng,{radius:5,color:'#58a6ff',fillColor:'#58a6ff',fillOpacity:1}).addTo(_map);
      _netDrawMarkers.push(dot);
      if(_netDrawLine){ _netDrawLine.remove(); }
      if(_netDrawPoints.length>1){
        _netDrawLine = L.polyline(_netDrawPoints,{color:'#58a6ff',weight:2,dashArray:'6,4'}).addTo(_map);
      }
    };
    _map.on('click', _map._netDrawHandler);
  }
}

function finishNetDraw(){
  _drawingNet = false;
  _map.getContainer().style.cursor='';
  const btn=document.getElementById('net-draw-finish'); if(btn) btn.remove();
  if(_netDrawPoints.length<2){ toast('يجب رسم نقطتين على الأقل','err'); clearNetDraw(); return; }

  const link = window._pendingNetLink;
  link.points = _netDrawPoints;
  link.typeName = {fiber:'كابل ضوئي',p2p:'رابط P2P',utp:'كابل شبكي',coax:'كابل محوري'}[link.type]||link.type;
  fbSet('network/links/'+link.id, link);
  logAct('شبكة — إضافة رابط', link.name);
  clearNetDraw();
  toast('✅ تم حفظ '+link.name);
  loadNetworkLayer();
}

function clearNetDraw(){
  _netDrawMarkers.forEach(m=>m.remove()); _netDrawMarkers=[];
  if(_netDrawLine){ _netDrawLine.remove(); _netDrawLine=null; }
  _netDrawPoints=[];
  window._pendingNetLink=null;
}

async function requestNotifPermission(){
  if(!FBMSG){ toast('FCM غير متاح في هذا المتصفح','warn'); return; }
  try {
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){ toast('الإشعارات غير مسموحة','warn'); return; }
    toast('⏳ جار تفعيل الإشعارات...','warn');
    let swReg = null;
    try {
      swReg = await navigator.serviceWorker.register('/Cctv-manger/firebase-messaging-sw.js', {scope: '/Cctv-manger/'});
      await navigator.serviceWorker.ready;
      window._swReg = swReg;
    } catch(swErr) {
      console.warn('SW register failed, using default:', swErr);
    }
    const tokenOptions = { vapidKey: VAPID_KEY };
    if(swReg) tokenOptions.serviceWorkerRegistration = swReg;
    const token = await FBMSG.getToken(tokenOptions);
    if(token && CU){
      await fbSet('users/'+(CU.uid||CU.id)+'/fcmToken', token);
      // حفظ التوكن محلياً للمقارنة لاحقاً
      localStorage.setItem('fcm_token', token);
      toast('✅ الإشعارات مفعّلة');
      console.log('✅ FCM Token:', token);
    } else {
      toast('❌ فشل الحصول على التوكن — تأكد من إعدادات الإشعارات','err');
      console.warn('No token or CU:', token, CU);
    }
  } catch(e) {
    toast('❌ خطأ FCM: '+e.message,'err');
    console.error('FCM error:', e);
  }
}

function quickSearch(q){
  const res = $('qs-res');
  q = (q||'').trim();
  if(!q){ res.style.display='none'; res.innerHTML=''; return; }
  const ql = q.toLowerCase();

  const results = [];

  // بحث في الأعطال
  (DB.faults||[]).forEach(f=>{
    const hay = ((f.location||'')+(f.pointId||'')+(f.reason||'')+(f.camSN||'')).toLowerCase();
    if(hay.includes(ql)){
      results.push({ico:'⚠️', label:`عطل: ${f.location} — ${f.pointId}`, sub:f.reason||'', action:`go('faults')`});
    }
  });

  // بحث في المخزن — مع حماية من القيم الفارغة أو غير المهيأة
  try{
    Object.values(DB.inv||{}).forEach(siteItems=>{
      (Array.isArray(siteItems)?siteItems:[]).forEach(it=>{
        if(!it||!it.name) return;
        const hay = ((it.name||'')+(it.sn||'')+(it.brand||'')).toLowerCase();
        if(hay.includes(ql)){
          results.push({ico:'📦', label:`مخزن: ${it.name}`, sub:`SN: ${it.sn||'—'}`, action:`go('inventory')`});
        }
      });
    });
  }catch(e){}

  // بحث في المستخدمين
  (DB.users||[]).forEach(u=>{
    if((u.name+(u.email||'')).toLowerCase().includes(ql)){
      results.push({ico:'👤', label:`مستخدم: ${u.name}`, sub:ROLES[u.role]||u.role, action:`go('users')`});
    }
  });

  // بحث في المواقع الميدانية
  (DB.fieldSites||[]).forEach(s=>{
    if(s.name.toLowerCase().includes(ql)){
      results.push({ico:'📍', label:`موقع ميداني: ${s.name}`, sub:`${s.cameras.length} كاميرا`, action:`go('fieldmap')`});
    }
  });

  if(!results.length){
    res.innerHTML=`<div style="padding:12px;text-align:center;color:var(--mt);font-size:13px">لا نتائج</div>`;
  } else {
    res.innerHTML = results.slice(0,8).map(r=>`
      <div onclick="${r.action};$('qs-inp').value='';$('qs-res').style.display='none'"
        style="padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--br);display:flex;gap:10px;align-items:center"
        onmouseover="this.style.background='var(--br)'" onmouseout="this.style.background=''">
        <span style="font-size:18px">${r.ico}</span>
        <div>
          <div style="font-size:13px;font-weight:600">${esc(r.label)}</div>
          ${r.sub?`<div style="font-size:11px;color:var(--mt)">${esc(r.sub)}</div>`:''}
        </div>
      </div>`).join('');
  }
  res.style.display='block';
}

// دالة SHA-256 عبر Web Crypto API (متوفرة أصلاً بكل المتصفحات الحديثة، بدون مكتبات خارجية)
async function sha256Hash(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

let _pwVaultUnlocked = false; // يُعاد لـ false في كل مرة يغادر القسم — القفل يُطلب دائماً

const PWVAULT_DEVICE_TYPES = ['كاميرات','NVR','P2P','راوتر','سويچ','لابتوب','حاسوب','UPS','طابعة','كاميرا حرارية','أخرى'];

function pgPwVault(){
  if(CU.role!=='manager'){
    $('page').innerHTML='<div class="panel" style="text-align:center;padding:60px"><div style="font-size:40px">⛔</div><div style="margin-top:12px">هذا القسم للمدير فقط</div></div>';
    return;
  }
  // القفل يُطلب في كل مرة — لا نتحقق من _pwVaultUnlocked القديمة
  _pwVaultUnlocked = false;
  checkVaultPasswordExists().then(function(exists){
    if(!exists){
      showSetupVaultPassword();
    } else {
      showVaultLockScreen();
    }
  });
}

function checkVaultPasswordExists(){
  return FBDB.ref('cctv/settings/vaultPasswordHash').once('value').then(function(snap){
    return !!snap.val();
  });
}

async function setupVaultPassword(){
  const pw = val('vault-setup-pw')||'';
  const pw2 = val('vault-setup-pw2')||'';
  const errEl = $('vault-setup-err');
  if(pw.length<4){ errEl.style.display='block'; errEl.textContent='كلمة المرور قصيرة جداً (4 أحرف على الأقل)'; return; }
  if(pw!==pw2){ errEl.style.display='block'; errEl.textContent='كلمتا المرور غير متطابقتين'; return; }
  const hash = await sha256Hash(pw);
  await fbSet('settings/vaultPasswordHash', hash);
  logVaultAccess('تم إنشاء كلمة مرور القسم لأول مرة');
  _pwVaultUnlocked = true;
  renderPwVaultList();
}

// شاشة القفل — تُعرض كل مرة يفتح القسم
function showVaultLockScreen(){
  $('page').innerHTML=`
  <div class="ph"><div class="pt">🔐 سجل كلمات المرور</div></div>
  <div style="padding:16px;max-width:420px;margin:0 auto">

      <div class="field"><input type="password" id="vault-unlock-pw" placeholder="كلمة مرور القسم" onkeydown="if(event.key==='Enter')unlockVault()"></div>
      <div id="vault-unlock-err" style="color:var(--rd);font-size:13px;margin-bottom:8px;display:none"></div>
      <button class="btn btn-bl" style="width:100%" onclick="unlockVault()">فتح القسم</button>
    </div>
  </div>`;
  setTimeout(()=>{ const el=$('vault-unlock-pw'); if(el) el.focus(); }, 100);
}

async function unlockVault(){
  const pw = val('vault-unlock-pw')||'';
  const errEl = $('vault-unlock-err');
  const snap = await FBDB.ref('cctv/settings/vaultPasswordHash').once('value');
  const storedHash = snap.val();
  const inputHash = await sha256Hash(pw);
  if(inputHash===storedHash){
    _pwVaultUnlocked = true;
    logVaultAccess('تم فتح قسم كلمات المرور بنجاح');
    renderPwVaultList();
  } else {
    errEl.style.display='block';
    errEl.textContent='كلمة المرور غير صحيحة';
    logVaultAccess('⚠️ محاولة فتح فاشلة لقسم كلمات المرور');
  }
}

          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <span style="font-weight:600">${esc(r.deviceType||'')}${r.itemName?' — '+esc(r.itemName):''}</span>
            <div style="display:flex;gap:6px">
              <button class="btn btn-sm" onclick="openEditPwVault(${r._idx})">✏️</button>
              <button class="btn btn-sm btn-rd" onclick="deletePwVault(${r._idx})">🗑️</button>

function savePwVault(existingId){
  // ⚠️ نعتمد على id ثابت (وليس index متغيّر بالمصفوفة) لتفادي الإشارة لعنصر خاطئ
  //    لو تغيّر ترتيب DB.pwVault بالخلفية أثناء فتح النموذج (نفس نمط الراديو/UAV الآمن)
  const list = DB.pwVault ? [...DB.pwVault] : [];
  const existing = existingId ? list.find(function(r){return r.id===existingId;}) : null;
  const id = existing ? existing.id : gid();
  const rec = {
    id: id,
    site: val('pwv-site')||'',
    deviceType: val('pwv-type')||'',
    itemName: val('pwv-name')||'',
    username: val('pwv-user')||'',
    password: val('pwv-pass')||'',
    notes: val('pwv-notes')||'',
    updatedBy: CU.name,
    updatedAt: ts(),
    _ts: existing ? (existing._ts||Date.now()) : Date.now()
  };
  if(!rec.password){ toast('كلمة المرور مطلوبة','err'); return; }
  const btn = document.querySelector('.mft button.btn-bl, .mft button:not(.btn-gy)');
  if(btn){ btn.disabled = true; btn.textContent = '⏳ جار الحفظ...'; }
  fbSet('pwVault/'+id, rec).then(function(){
    logVaultAccess((existing?'تعديل':'إضافة')+' سجل كلمة مرور — '+rec.site+' / '+rec.deviceType);
    closeModal();
    toast('✅ تم الحفظ');
    setTimeout(renderPwVaultList, 300);
  }).catch(function(err){
    toast('❌ فشل الحفظ: '+err.message,'err');
    if(btn){ btn.disabled = false; btn.textContent = existing?'💾 حفظ التعديل':'💾 حفظ'; }
  });
}

function deletePwVault(idx){
  if(!confirm('هل تريد حذف هذا السجل نهائياً؟')) return;
  const list = DB.pwVault ? [...DB.pwVault] : [];
  const removed = list[idx];
  if(!removed || !removed.id){ toast('السجل لم يعد موجوداً، أعد تحميل الصفحة','err'); setTimeout(renderPwVaultList, 300); return; }
  fbDel('pwVault/'+removed.id).then(function(){
    logVaultAccess('حذف سجل كلمة مرور — '+(removed.site||'')+' / '+(removed.deviceType||''));
    toast('🗑️ تم الحذف');
    setTimeout(renderPwVaultList, 300);
  }).catch(function(err){
