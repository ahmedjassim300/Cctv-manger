async function changeVaultPassword(){
  const cur = val('vault-cur-pw')||'';
  const nw = val('vault-new-pw')||'';
  const nw2 = val('vault-new-pw2')||'';
  const errEl = $('vault-change-err');
  const snap = await FBDB.ref('cctv/settings/vaultPasswordHash').once('value');
  const storedHash = snap.val();
  const curHash = await sha256Hash(cur);
  if(curHash!==storedHash){ errEl.style.display='block'; errEl.textContent='كلمة المرور الحالية غير صحيحة'; return; }
  if(nw.length<4){ errEl.style.display='block'; errEl.textContent='كلمة المرور الجديدة قصيرة جداً'; return; }
  if(nw!==nw2){ errEl.style.display='block'; errEl.textContent='كلمتا المرور الجديدتان غير متطابقتين'; return; }
  const newHash = await sha256Hash(nw);
  await fbSet('settings/vaultPasswordHash', newHash);
  logVaultAccess('تم تغيير كلمة مرور القسم');
  closeModal();
  toast('✅ تم تحديث كلمة مرور القسم');
}


// ══════════════════════════════════════════════════════
//  📜 السجل الكامل (Timeline) لكل معدة — مربوط بالرقم التسلسلي
// ══════════════════════════════════════════════════════

function openItemTimeline(serial){
  if(!serial){ toast('لا يوجد رقم تسلسلي لهذه المادة','warn'); return; }
  const events = [];

  // 1. من المخزن الحالي (كل المستودعات) — حالة "موجود الآن"
  Object.entries(DB.inv||{}).forEach(function([site, items]){
    (items||[]).forEach(function(it){
      if(it.serial===serial){
        events.push({
          type:'current', ts: it._ts || (it.addedAt?new Date(it.addedAt).getTime():0),
          icon:'📍', title:'الحالة الحالية — '+site,
          detail: (STATUS_LABELS[it.status]||it.status||'في المخزن') + (it.installedAt?(' — '+it.installedAt):''),
          by: it.addedBy||''
        });
      }
    });
  });

  // 2. من حركات المواد (صرف/إيداع/إرجاع)
  (DB.moves||[]).forEach(function(m){
    if(m.name && m.name.indexOf(serial)>=0 || (m.serial===serial)){
      events.push({
        type:'move', ts: m._ts||0,
        icon: m.dir==='out'?'📤':'📥',
        title: (m.dir==='out'?'صرف من ':'إيداع في ')+(m.dir==='out'?m.to:m.from),
        detail: (m.notes||'') + (m.receiver?(' — المستلم: '+m.receiver):'') + (m.returnReason?(' — السبب: '+m.returnReason):''),
        by: m.sender||m.by||''
      });
    }
  });

  // 3. من الأعطال (مربوطة بـ camSN)
  (DB.faults||[]).forEach(function(f){
    if(f.camSN===serial){
      events.push({
        type:'fault', ts: f._ts||(f.date?new Date(f.date).getTime():0),
        icon:'⚠️', title:'عطل — '+(f.location||'')+' / '+(f.pointId||''),
        detail: f.reason||'', by: f.by||'',
        status: f.status
      });
      // سجل التحديثات على العطل نفسه (log)
      (f.log||[]).forEach(function(l){
        events.push({
          type:'fault_update', ts: l._ts||0,
          icon:'🔧', title:'تحديث عطل — '+(f.location||''),
          detail: l.label||'', by: l.by||''
        });
      });
    }
  });

  // 4. من الكاميرات المنصوبة بالمواقع الميدانية (fieldSites)
  (DB.fieldSites||[]).forEach(function(fs){
    (fs.cameras||[]).forEach(function(c){
      if(c.serial===serial){
        events.push({
          type:'deployed_cam', ts: c._ts||0,
          icon:'📷', title:'كاميرا منصوبة — '+fs.name,
          detail: (c.installDesc||c.dc||'') + (c.dir?(' — اتجاه '+c.dir+'°'):''),
          by: c.by||''
        });
      }
    });
  });

  // ترتيب زمني تنازلي (الأحدث أولاً)
  events.sort(function(a,b){ return (b.ts||0)-(a.ts||0); });

  renderItemTimeline(serial, events);
}

const STATUS_LABELS = {

  returned:'↩️ راجع للمخزن', maintenance:'🔧 قيد الصيانة'
};

    events.forEach(function(e, i){

      const colorMap = {current:'#0969da', move:'#1a7f37', fault:'#f85149', fault_update:'#d29922', deployed_cam:'#8957e5'};

      html += `<div style="position:relative;margin-bottom:18px;padding-right:20px">
        <div style="position:absolute;right:-4px;top:4px;width:14px;height:14px;border-radius:50%;background:${color};border:3px solid var(--bg)"></div>
        <div class="panel" style="padding:12px;border-right:3px solid ${color}">
          <div style="display:flex;justify-content:space-between;align-items:start;gap:8px">
            <div style="font-weight:700">${e.icon} ${esc(e.title)}</div>
            <div style="font-size:11px;color:var(--mt);white-space:nowrap">${dateStr}</div>
          </div>

          ${e.by?`<div style="font-size:11px;color:var(--mt);margin-top:6px">👤 ${esc(e.by)}</div>`:''}

// ══════════════════════════════════════════════════════
//  💚 Health Score — مؤشر صحة النظام الشامل
// ══════════════════════════════════════════════════════
function calcHealthScore(){
  const ai = Object.values(DB.inv||{}).flat();
  const visibleFaults = getVisibleFaults();
  const openFaults = visibleFaults.filter(f=>f.status!=='resolved');
  const totalFaultsEver = visibleFaults.length || 1; // تفادي القسمة على صفر

  let score = 100;
  const reasons = [];

  // 1. نسبة الأعطال المفتوحة من إجمالي الأعطال المسجّلة (وزن 30)
  const openRatio = openFaults.length / totalFaultsEver;
  const faultsPenalty = Math.min(30, Math.round(openRatio*100*0.3));
  if(faultsPenalty>0){ score -= faultsPenalty; reasons.push({label:'أعطال مفتوحة ('+openFaults.length+')', penalty:faultsPenalty}); }

  // 2. الأعطال المتأخرة (مفتوحة أكثر من 3 أيام) — وزن أعلى لكل واحدة (حتى 25)
  const now = Date.now();
  const overdueFaults = openFaults.filter(function(f){
    const created = f._ts || (f.date?new Date(f.date).getTime():0);
    return created && (now-created) > 3*24*60*60*1000;
  });
  const overduePenalty = Math.min(25, overdueFaults.length*5);
  if(overduePenalty>0){ score -= overduePenalty; reasons.push({label:'أعطال متأخرة +3 أيام ('+overdueFaults.length+')', penalty:overduePenalty}); }

  // 3. أعطال بأولوية عالية غير محلولة (وزن حتى 20)
  const highPriorityOpen = openFaults.filter(function(f){ return f.priority==='high'||f.priority==='عاجل'||f.priority==='urgent'; });
  const priorityPenalty = Math.min(20, highPriorityOpen.length*7);
  if(priorityPenalty>0){ score -= priorityPenalty; reasons.push({label:'أعطال عاجلة غير محلولة ('+highPriorityOpen.length+')', penalty:priorityPenalty}); }

  // 4. صيانة متأخرة (وزن حتى 15)
  const maintainTasks = DB.maintain||[];
  const overdueMaint = maintainTasks.filter(function(t){ return !t.done && new Date(t.dueDate) < new Date(); });
  const maintPenalty = Math.min(15, overdueMaint.length*3);
  if(maintPenalty>0){ score -= maintPenalty; reasons.push({label:'مهام صيانة متأخرة ('+overdueMaint.length+')', penalty:maintPenalty}); }

  // 5. نسبة المعدات بحالة "صيانة/عطل" من إجمالي المنصوب (وزن حتى 10)
  const deployedItems = ai.filter(function(i){ return i.status==='deployed'; });
  const maintenanceItems = ai.filter(function(i){ return i.status==='maintenance'; });
  const deployedTotal = deployedItems.length + maintenanceItems.length || 1;
  const maintRatio = maintenanceItems.length / deployedTotal;
  const equipPenalty = Math.min(10, Math.round(maintRatio*100*0.1));
  if(equipPenalty>0){ score -= equipPenalty; reasons.push({label:'معدات بحالة صيانة ('+maintenanceItems.length+')', penalty:equipPenalty}); }

  score = Math.max(0, Math.min(100, score));
  return {score, reasons};
}

function healthScoreColor(score){
  if(score>=85) return '#3fb950';
  if(score>=65) return '#d29922';
  if(score>=40) return '#ff7b00';
  return '#f85149';
}

function healthScoreLabel(score){
  if(score>=85) return 'ممتاز';
  if(score>=65) return 'جيد';
  if(score>=40) return 'يحتاج انتباه';
  return 'حرج';
}

function renderHealthScoreCard(){
  const {score, reasons} = calcHealthScore();
  const color = healthScoreColor(score);
  const label = healthScoreLabel(score);
  const circumference = 2*Math.PI*40;
  const offset = circumference - (score/100)*circumference;

  return `<div class="panel" style="display:flex;align-items:center;gap:16px;cursor:pointer" onclick="openHealthScoreDetail()">
    <svg width="90" height="90" viewBox="0 0 90 90" style="flex-shrink:0">
      <circle cx="45" cy="45" r="40" fill="none" stroke="var(--br)" stroke-width="8"/>
      <circle cx="45" cy="45" r="40" fill="none" stroke="${color}" stroke-width="8"
        stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"
        stroke-linecap="round" transform="rotate(-90 45 45)" style="transition:stroke-dashoffset .6s"/>
      <text x="45" y="42" text-anchor="middle" font-size="22" font-weight="800" fill="${color}">${score}</text>
      <text x="45" y="60" text-anchor="middle" font-size="11" fill="var(--mt)">%</text>
    </svg>
    <div style="flex:1">
      <div style="font-weight:700;font-size:16px;color:${color}">💚 صحة النظام — ${label}</div>
      <div style="font-size:12px;color:var(--mt);margin-top:4px">
        ${reasons.length===0?'✅ كل المؤشرات ممتازة، لا مشاكل مرصودة':'اضغط لعرض تفاصيل ما يؤثر على النقاط'}
      </div>
    </div>
  </div>`;
}

function openHealthScoreDetail(){
  const {score, reasons} = calcHealthScore();
  const color = healthScoreColor(score);
  openModal(`${mhd('💚 تفاصيل صحة النظام')}
    <div style="text-align:center;font-size:36px;font-weight:800;color:${color};margin-bottom:6px">${score}%</div>
    <div style="text-align:center;color:var(--mt);margin-bottom:16px">${healthScoreLabel(score)}</div>
    ${reasons.length===0
      ?'<div class="panel" style="text-align:center;padding:24px;color:var(--gn)">✅ لا توجد نقاط خصم — النظام بأفضل حالاته</div>'
      :'<div style="display:flex;flex-direction:column;gap:8px">'+
        reasons.map(function(r){
          return '<div class="panel" style="display:flex;justify-content:space-between;padding:10px 14px">'+
            '<span>'+esc(r.label)+'</span><span style="color:var(--rd);font-weight:700">-'+r.penalty+'</span></div>';
        }).join('')+
      '</div>'
    }
    <div class="mft"><button class="btn btn-gy" onclick="closeModal()">إغلاق</button></div>`);
}

function handleBulkExcelFile(input){

  if(!file) return;
  const area = document.getElementById('bulk-imparea');
  area.style.borderColor = 'var(--gn)';
  area.innerHTML = '<div style="font-size:36px">⏳</div><div style="font-weight:700">جاري القراءة...</div>';

  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, {type:'array'});
      const sheetName = workbook.SheetNames[0];
      const sheet = workbook.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});

      // تجاهل السطر الأول (العناوين) إذا كان يحتوي نص وليس بيانات فعلية
      const dataRows = rows.slice(1).filter(function(r){ return r.some(function(c){return String(c).trim()!=='';}); });

      window._bulkImportRows = dataRows.map(function(r){
        return {
          type: String(r[0]||'').trim(),
          name: String(r[1]||'').trim(),
          serial: String(r[2]||'').trim(),
          model: String(r[3]||'').trim(),
          mfr: String(r[4]||'').trim(),
          qty: parseInt(r[5])||1,
          status: String(r[6]||'warehouse').trim()
        };
      });

      area.innerHTML = '<div style="font-size:36px">✅</div><div style="font-weight:700;color:var(--gn)">'+esc(file.name)+'</div>'+
        '<div style="font-size:12px;color:var(--mt)">'+window._bulkImportRows.length+' صف تم قراءته</div>';

      renderBulkPreview();
    }catch(err){
      area.style.borderColor='var(--rd)';
      area.innerHTML = '<div style="font-size:36px">❌</div><div style="font-weight:700;color:var(--rd)">فشل قراءة الملف</div><div style="font-size:12px;color:var(--mt)">'+esc(err.message)+'</div>';
      toast('فشل قراءة الملف — تأكد من الصيغة','err');
    }
  };
  reader.readAsArrayBuffer(file);
}

function confirmBulkImport(){
  const rows = window._bulkImportRows||[];
  const mode = window._bulkImportMode;
  const site = val('bulk-site');
  if(!rows.length){ toast('لا توجد بيانات للاستيراد','err'); return; }
  if(!site){ toast('اختر الموقع/المستودع أولاً','err'); return; }

  if(mode==='warehouse'){
    // كل صف يُضاف كعنصر منفصل بمخزن الـ site المحدد
    const updates = {};
    rows.forEach(function(r){
      const id = gid();
      updates[id] = {
        id: id, type:r.type, name:r.name, serial:r.serial, model:r.model, mfr:r.mfr,
        qty:r.qty, status:r.status||'warehouse',
        addedBy:CU.name, addedAt:ts(), _ts:Date.now(), importedBulk:true
      };
    });
    // بنية DB.inv الحالية array وليست object بمفاتيح — نتبع نفس القيود الموجودة (fbSet كامل الموقع)
    const existing = DB.inv[site] ? [...DB.inv[site]] : [];
    const merged = existing.concat(Object.values(updates));
    fbSet('inv/'+site, merged).then(function(){
      logAct('استيراد جماعي — المخزن', rows.length+' عنصر إلى '+site);
      toast('✅ تم استيراد '+rows.length+' عنصر إلى '+site);
      closeModal();
      setTimeout(pgInv, 300);
    }).catch(function(err){
      toast('❌ فشل الاستيراد: '+err.message,'err');
    });
  } else {
    // جرد الموجودات الثابتة — نضيف كنقطة واحدة جديدة "استيراد Excel" بها كل العناصر
    const fs = DB.fieldSites.find(function(s){return s.id===site;});
    if(!fs){ toast('الموقع غير موجود','err'); return; }
    const ptId = gid();
    const items = {};
    rows.forEach(function(r){
      const itemId = gid();
      items[itemId] = {
        id:itemId, type:r.type, name:r.name, serial:r.serial,
        qty:r.qty, status:r.status||'', notes:'مستورد من Excel', date:ts()
      };
    });
    fbSet('siteInventory/'+site+'/'+ptId, {
      id:ptId, name:'📥 استيراد Excel — '+fmtDate(new Date().toISOString()),
      items: items, addedBy:CU.name, addedAt:ts()
    }).then(function(){
      logAct('استيراد جماعي — جرد الموجودات', rows.length+' عنصر إلى '+fs.name);
      toast('✅ تم استيراد '+rows.length+' عنصر إلى '+fs.name);
      closeModal();
      setTimeout(pgSiteInventory, 300);
    }).catch(function(err){
      toast('❌ فشل الاستيراد: '+err.message,'err');
    });
  }
}


// ══════════════════════════════════════════════════════
//  📅 التقرير الشهري التلقائي — إحصائيات + أداء الفنيين + Health Score
// ══════════════════════════════════════════════════════

function buildMonthlyReportHTML(monthLabel, periodFrom, periodTo){
  const visibleFaults = DB.faults||[];
  const periodFaults = visibleFaults.filter(function(f){
    const t = f._ts||(f.date?new Date(f.date).getTime():0);
    return t>=periodFrom && t<periodTo;
  });
  const openF = periodFaults.filter(function(f){return f.status!=='resolved';}).length;
  const resolvedF = periodFaults.filter(function(f){return f.status==='resolved';}).length;
  const highF = periodFaults.filter(function(f){return f.priority==='high'||f.priority==='عاجل';}).length;

  const {score} = calcHealthScore();
  const scoreColor = healthScoreColor(score);

  // أداء الفنيين خلال الفترة
  const periodLogs = (DB.actlog||[]).filter(function(l){
    const t = l._ts||0;
    return t>=periodFrom && t<periodTo;
  });
  const byUser = {};
  periodLogs.forEach(function(l){
    const name = l.name||'غير محدد';
    if(!byUser[name]) byUser[name] = {name:name, role:l.role||'', count:0};
    byUser[name].count++;
  });
  const perfRows = Object.values(byUser).sort(function(a,b){return b.count-a.count;});

  const ai = Object.values(DB.inv||{}).flat();
  const totalItems = ai.length;
  const deployedItems = ai.filter(function(i){return i.status==='deployed';}).length;

  const now = fmtDateTime(new Date().toISOString());

  let html = '<html dir="rtl"><head><meta charset="utf-8"><title>التقرير الشهري — '+monthLabel+'</title>';
  html += '<style>body{font-family:Arial,sans-serif;padding:28px;color:#111;direction:rtl}';
  html += 'h1{text-align:center;color:#1d4ed8;margin-bottom:4px}.sub{text-align:center;color:#666;margin-bottom:24px;font-size:12px}';
  html += '.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}';
  html += '.card{border:1px solid #ddd;border-radius:8px;padding:14px;text-align:center}.card .val{font-size:26px;font-weight:700}.card .lbl{font-size:12px;color:#666;margin-top:4px}';
  html += '.health{text-align:center;padding:16px;border-radius:10px;margin-bottom:20px;background:#f5f5f5}';
  html += 'table{width:100%;border-collapse:collapse;margin-top:8px}th{background:#1e3a5f;color:#fff;padding:9px 12px;text-align:right;font-size:15px}';
  html += 'td{border:1px solid #ddd;padding:8px 12px;font-size:14px}tr:nth-child(even){background:#f5f5f5}';
  html += '.sec{font-weight:700;font-size:16px;margin:22px 0 8px;color:#1d4ed8;border-bottom:2px solid #1d4ed8;padding-bottom:4px}';
  html += '@media print{.no-print{display:none}}</style></head><body>';

  html += '<h1>📅 التقرير الشهري — '+monthLabel+'</h1>';
  html += '<div class="sub">تاريخ الإصدار: '+now+'</div>';
  html += '<button class="no-print" onclick="window.print()" style="display:block;margin:0 auto 20px;padding:8px 24px;background:#1d4ed8;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px">🖨️ طباعة / حفظ PDF</button>';

  html += '<div class="health" style="color:'+scoreColor+'"><div style="font-size:32px;font-weight:800">'+score+'%</div><div style="font-size:13px">صحة النظام العامة (Health Score)</div></div>';

  html += '<div class="sec">📊 ملخص الشهر</div><div class="grid">';
  html += '<div class="card"><div class="val" style="color:#2563eb">'+periodFaults.length+'</div><div class="lbl">أعطال هذا الشهر</div></div>';
  html += '<div class="card"><div class="val" style="color:#dc2626">'+openF+'</div><div class="lbl">مفتوحة</div></div>';
  html += '<div class="card"><div class="val" style="color:#16a34a">'+resolvedF+'</div><div class="lbl">محلولة</div></div>';
  html += '<div class="card"><div class="val" style="color:#ff7b00">'+highF+'</div><div class="lbl">عاجلة</div></div>';
  html += '</div>';

  html += '<div class="sec">📦 حالة المخزون</div><div class="grid">';
  html += '<div class="card"><div class="val">'+totalItems+'</div><div class="lbl">إجمالي المواد</div></div>';
  html += '<div class="card"><div class="val" style="color:#16a34a">'+deployedItems+'</div><div class="lbl">منصوبة</div></div>';
  html += '</div>';

  html += '<div class="sec">📈 أداء الفريق هذا الشهر</div>';
  if(perfRows.length){
    html += '<table><thead><tr><th>الاسم</th><th>الدور</th><th>عدد الإجراءات</th></tr></thead><tbody>';
    perfRows.forEach(function(u){
      html += '<tr><td>'+esc(u.name)+'</td><td>'+esc(ROLES[u.role]||u.role||'')+'</td><td><b>'+u.count+'</b></td></tr>';
    });
    html += '</tbody></table>';
  } else {
    html += '<div style="color:#666;text-align:center;padding:20px">لا توجد سجلات نشاط لهذا الشهر</div>';
  }

  html += '</body></html>';
  return html;
}

function printMonthlyReportNow(){
  if(CU.role!=='manager'){ toast('التقرير الشهري للمدير فقط','err'); return; }
  const now = new Date();
  const periodFrom = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  const periodTo = Date.now();
  const monthLabel = now.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  const htmlContent = buildMonthlyReportHTML(monthLabel, periodFrom, periodTo);
  const win = window.open('','_blank');
  win.document.write(htmlContent);
  win.document.close();
  logAct('تقرير شهري يدوي', monthLabel);
}

// ── الجدولة التلقائية أول كل شهر (بنفس فلسفة النسخ الاحتياطي) ──
function monthlyReportAutoCheck(){
  if(!CU || CU.role!=='manager') return;
  setTimeout(function(){
    try{
      FBDB.ref('cctv/monthlyReports/_meta/lastGenerated').once('value').then(function(snap){
        const last = snap.val();
        const now = new Date();
        const currentMonthKey = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
        if(last !== currentMonthKey){
          generateAutoMonthlyReport(currentMonthKey);
        }
      }).catch(function(err){ console.warn('Monthly report check failed:', err.message); });
    }catch(e){ console.warn('Monthly report check exception:', e.message); }
  }, 3000); // بعد النسخة الاحتياطية بثانية إضافية لتفادي التزاحم
}

function generateAutoMonthlyReport(monthKey){
  try{
    const now = new Date();
    // الشهر الماضي كاملاً (وليس الشهر الحالي غير المكتمل)
    const prevMonth = new Date(now.getFullYear(), now.getMonth()-1, 1);
    const periodFrom = prevMonth.getTime();
    const periodTo = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
    const monthLabel = prevMonth.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
    const htmlContent = buildMonthlyReportHTML(monthLabel, periodFrom, periodTo);

    const sizeCheck = htmlContent.length;
    if(sizeCheck > 8*1024*1024){
      console.warn('Monthly report skipped: too large');
      fbSet('monthlyReports/_meta/lastGenerated', monthKey).catch(function(){});
      return;
    }

    fbSet('monthlyReports/'+monthKey, {
      generatedAt: ts(), monthLabel: monthLabel, html: htmlContent
    }).then(function(){
      fbSet('monthlyReports/_meta/lastGenerated', monthKey);
      logAct('تقرير شهري تلقائي', monthLabel);
    }).catch(function(err){ console.warn('Monthly report save failed:', err.message); });
  }catch(e){ console.warn('Monthly report generation exception:', e.message); }
}

function listMonthlyReports(){
  return FBDB.ref('cctv/monthlyReports').once('value').then(function(snap){
    const data = snap.val()||{};
    return Object.keys(data)
      .filter(function(k){return k!=='_meta';})
      .map(function(k){return {key:k, monthLabel:data[k].monthLabel, generatedAt:data[k].generatedAt};})
      .sort(function(a,b){return b.key.localeCompare(a.key);});
  });
}

function openMonthlyReport(monthKey){
  FBDB.ref('cctv/monthlyReports/'+monthKey).once('value').then(function(snap){
    const report = snap.val();
    if(!report){ toast('التقرير غير موجود','err'); return; }
    const win = window.open('','_blank');
    win.document.write(report.html);
    win.document.close();
  });
}

function openMonthlyReportsArchive(){
  if(CU.role!=='manager'){ toast('للمدير فقط','err'); return; }
  openModal(`${mhd('📅 التقارير الشهرية')}
  <div style="display:flex;flex-direction:column;gap:10px">
    <button class="btn btn-bl btn-fw" onclick="printMonthlyReportNow();">🖨️ إنشاء تقرير الشهر الحالي الآن</button>
    <div style="font-weight:700;margin-top:10px">🗓️ الأرشيف الشهري التلقائي</div>
    <div id="monthly-reports-list" style="font-size:13px;color:var(--mt)">⏳ جاري التحميل...</div>
  </div>
  <div class="mft"><button class="btn btn-gy" onclick="closeModal()">إغلاق</button></div>`);

  listMonthlyReports().then(function(reports){
    const el = document.getElementById('monthly-reports-list');

    if(!reports.length){
      el.innerHTML = 'لا توجد تقارير تلقائية بعد — يُنشأ أول تقرير تلقائياً أول الشهر القادم';

    el.innerHTML = reports.map(function(r){
      return '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--br)">'+
        '<span>'+esc(r.monthLabel)+'</span>'+
        '<button class="btn btn-sm btn-bl" onclick="openMonthlyReport(\''+r.key+'\')">👁️ عرض</button></div>';
    }).join('');
  });
}


// ══════════════════════════════════════════════════════
//  📷 ماسح عام للرقم التسلسلي — يعمل مع أي باركود/QR (اختياري، بجانب الكتابة اليدوية)
//  ⚠️ يُبنى كعنصر مستقل تماماً (overlay خاص به) وليس عبر نظام openModal/closeModal
//     المشترك، لأن closeModal() تُفرّغ محتوى المودال بالكامل وتمسح النموذج
//     الأصلي (مثل نموذج إضافة المادة) الذي يحتوي الحقل المستهدف نفسه.
// ══════════════════════════════════════════════════════
let _serialScannerStream = null;

function openSerialScanner(targetInputId){
  window._serialScanTarget = targetInputId;
  window._serialScanCandidates = [];

  const overlay = document.createElement('div');
  overlay.id = 'sn-scanner-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px';
  overlay.innerHTML = `
    <div style="background:var(--sf);border-radius:16px;padding:20px;max-width:340px;width:100%;text-align:center">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
        <div style="font-weight:700;font-size:16px">📷 مسح QR أو باركود</div>
        <button id="sn-torch-btn" onclick="toggleSerialTorch()" style="display:none;background:none;border:none;font-size:22px;cursor:pointer" title="الفلاش">🔦</button>
      </div>
      <div style="position:relative;margin-bottom:12px">
        <video id="sn-scan-video" style="width:100%;border-radius:12px;background:#000" autoplay playsinline muted></video>
        <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:80%;height:100px;border:2px solid var(--gn);border-radius:8px;pointer-events:none"></div>
      </div>
      <div id="sn-scan-status" style="font-size:14px;color:var(--mt);margin-bottom:10px">جار تشغيل الكاميرا...</div>
      <div style="font-size:12px;color:var(--mt);margin-bottom:14px">يدعم QR وكل أنواع الباركود</div>
      <div id="sn-scan-candidates"></div>
      <button class="btn btn-rd btn-fw" onclick="stopSerialScanner()">إيقاف</button>
    </div>`;
  document.body.appendChild(overlay);
  setTimeout(startSerialScanner, 300);
}

let _serialZXingReader = null;
let _serialTorchOn = false;
let _serialVideoTrack = null;
let _candidateWindow = null;

function startSerialScanner(){
  const video = document.getElementById('sn-scan-video');
  if(!video) return;

  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})
  .then(function(stream){
    video.srcObject = stream;
    _serialScannerStream = stream;
    _serialVideoTrack = stream.getVideoTracks()[0];

    const torchBtn = document.getElementById('sn-torch-btn');
    // نعرض زر الفلاش دائماً بشكل مبدئي — فحص getCapabilities() عند هذه اللحظة
    // غير موثوق التوقيت على أغلب أجهزة Android (يحتاج للـ track أن يستقر أولاً).
    // الفحص الحقيقي والدقيق يحصل عند الضغط الفعلي على الزر (انظر toggleSerialTorch).
    if(torchBtn) torchBtn.style.display = 'block';
    // فحص إضافي مؤجَّل قليلاً كتأكيد مبكر (تحسين تجربة فقط، ليس شرطاً للعمل)
    setTimeout(function(){
      try{
        const caps = _serialVideoTrack.getCapabilities ? _serialVideoTrack.getCapabilities() : {};
        if(caps && caps.torch===false && torchBtn) torchBtn.style.display='none';
      }catch(e){}
    }, 400);

    if(typeof ZXing !== 'undefined'){
      startZXingScan(video);
    } else {
      const statusEl = document.getElementById('sn-scan-status');
      if(statusEl) statusEl.innerHTML = '⚠️ وضع محدود (QR فقط، بدون Barcode) — تحقق من الإنترنت';
      console.warn('ZXing library failed to load — falling back to jsQR (QR only, no Barcode support)');
      scanSerialFrameFallback(video);
    }
  })
  .catch(function(err){
    const el = document.getElementById('sn-scan-status');
    if(el) el.textContent = 'لا يمكن الوصول للكاميرا — تأكد من إذن الكاميرا';
  });
}

function startZXingScan(video){
  const hints = new Map();
  const formats = [
    ZXing.BarcodeFormat.QR_CODE, ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
    ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.CODE_39, ZXing.BarcodeFormat.UPC_A,
    ZXing.BarcodeFormat.UPC_E, ZXing.BarcodeFormat.ITF, ZXing.BarcodeFormat.DATA_MATRIX
  ];
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
  hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

  _serialZXingReader = new ZXing.BrowserMultiFormatReader(hints);
  const status = document.getElementById('sn-scan-status');

  _serialZXingReader.decodeFromVideoElementContinuously(video, function(result, err){
    if(result && result.getText()){
      registerScanCandidate(result.getText());
    }
  });
  if(status) status.textContent = 'وجّه الكاميرا نحو الرمز...';
}

function registerScanCandidate(text){
  if(!window._serialScanCandidates.includes(text)){
    window._serialScanCandidates.push(text);
  }
  if(_candidateWindow) clearTimeout(_candidateWindow);
  _candidateWindow = setTimeout(function(){
    const candidates = window._serialScanCandidates;
    if(candidates.length === 1){
      handleSerialScanResult(candidates[0]);
    } else if(candidates.length > 1){
      showCandidatesChoice(candidates);
    }
  }, 500);
}

function showCandidatesChoice(candidates){
  const el = document.getElementById('sn-scan-candidates');
  const status = document.getElementById('sn-scan-status');
  if(status) status.textContent = 'تم رصد أكثر من رمز — اختر الصحيح:';
  if(el){
    el.innerHTML = candidates.map(function(c, i){
      return '<button type="button" class="btn btn-sm btn-gy sn-cand-btn" data-idx="'+i+'" style="display:block;width:100%;margin-bottom:6px;text-align:right">'+esc(c)+'</button>';
    }).join('');
    Array.from(el.querySelectorAll('.sn-cand-btn')).forEach(function(btn, i){
      btn.addEventListener('click', function(){ handleSerialScanResult(candidates[i]); });
    });
  }
}

function scanSerialFrameFallback(video){
  if(!document.getElementById('sn-scan-video')) return;
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  function tick(){
    if(!document.getElementById('sn-scan-video')) return;
    if(video.readyState === video.HAVE_ENOUGH_DATA){
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);
      try{
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        if(typeof jsQR !== 'undefined'){
          const code = jsQR(imageData.data, imageData.width, imageData.height);
          if(code && code.data){ handleSerialScanResult(code.data); return; }
        }
      }catch(e){}
    }
    requestAnimationFrame(tick);
  }
  tick();
}

function toggleSerialTorch(){
  if(!_serialVideoTrack) return;
  const wantTorch = !_serialTorchOn;
  _serialVideoTrack.applyConstraints({advanced:[{torch:wantTorch}]}).then(function(){
    _serialTorchOn = wantTorch;
    const btn = document.getElementById('sn-torch-btn');
    if(btn) btn.style.opacity = _serialTorchOn ? '1' : '0.5';
  }).catch(function(err){
    toast('الفلاش غير مدعوم على هذا الجهاز/المتصفح','warn');
    _serialTorchOn = false;
    // فشل فعلي مؤكد (وليس تخمين مسبق) — الآن نخفي الزر لتفادي محاولات فاشلة متكررة
    const btn = document.getElementById('sn-torch-btn');
    if(btn) btn.style.display = 'none';
  });
}

function stopSerialScanner(){
  if(_candidateWindow){ clearTimeout(_candidateWindow); _candidateWindow=null; }
  if(_serialZXingReader){
    try{ _serialZXingReader.reset(); }catch(e){}
    _serialZXingReader = null;
  }
  if(_serialVideoTrack && _serialTorchOn){
    try{ _serialVideoTrack.applyConstraints({advanced:[{torch:false}]}); }catch(e){}
  }
  if(_serialScannerStream){
    _serialScannerStream.getTracks().forEach(function(t){t.stop();});
    _serialScannerStream = null;
  }
  _serialVideoTrack = null;
  _serialTorchOn = false;
  const overlay = document.getElementById('sn-scanner-overlay');
  if(overlay) overlay.remove();
}

function handleSerialScanResult(rawData){
  stopSerialScanner();
  let serialValue = rawData;
  try{
    const obj = JSON.parse(rawData);
    if(obj && (obj.serial || obj.sn)) serialValue = obj.serial || obj.sn;
  }catch(e){}
  const targetId = window._serialScanTarget;
  const inputEl = targetId ? document.getElementById(targetId) : null;
  if(inputEl){
    inputEl.value = serialValue.trim();
    toast('تم قراءة: '+serialValue.trim());
  } else {
    toast('تم المسح لكن الحقل غير متاح حالياً','warn');
  }
}

  return '<button type="button" class="btn btn-sm btn-gy" onclick="openSerialScanner(\''+inputId+'\')" title="مسح بالكاميرا" style="flex-shrink:0">📷</button>';
}

function setupLongPressAddMenu(map){
  // ⚠️ نعتمد حصراً على حدث contextmenu المدمج بـ Leaflet نفسها (map.on('contextmenu'))
  //    بدل مؤقتات touchstart/touchmove يدوية، لأن Leaflet لديها معالجة داخلية
  //    خاصة بها لتفادي تعارضها مع قائمة المتصفح الافتراضية (Tap.js handler)،
  //    وتفعيل نظامين متوازيين لنفس اللمسة الطويلة كان يسبب فوز قائمة
  //    المتصفح الأصلية على الهاتف تحديداً (لا يحدث على الحاسوب لأن الفأرة
  //    تستخدم click اليمنى الصريحة بدل محاكاة touch timing).
  map.on('contextmenu', function(e){
    if(e.originalEvent && e.originalEvent.preventDefault) e.originalEvent.preventDefault();
    if(_drawingBoundary || _measuringMode || _drawingNet) return;
    // ومضة بصرية سريعة بمكان الضغط لتأكيد الاستجابة للمستخدم
    const flash = L.circleMarker(e.latlng, {
      radius: 10, color:'#8957e5', weight:2, fillColor:'#8957e5', fillOpacity:.35
    }).addTo(map);
    setTimeout(function(){ map.removeLayer(flash); }, 400);
    openQuickAddMenu(e.latlng);
  });
}

var UAV_BRANDS=['DJI','Autel','Parrot','Yuneec','AgEagle','Skydio','محلية الصنع','غيرها'];
var UAV_TYPES=['Multi-rotor','Fixed Wing','VTOL','Hybrid'];
var UAV_CAM=['بدون كاميرا','كاميرا RGB','كاميرا حرارية','كاميرا ثنائية (RGB+حرارية)','كاميرا متعددة الأطياف','كاميرا LiDAR'];
var UAV_STATUS=['في المخزن','في الميدان','صيانة','معطل','مفقود','خارج الخدمة'];
var UAV_COND=['ممتاز','جيد جداً','جيد','مقبول','يحتاج صيانة','تالف'];
var UAV_SC={'في المخزن':'#0969da','في الميدان':'#1a7f37','صيانة':'#9a6700','معطل':'#d1242f','مفقود':'#8250df','خارج الخدمة':'#656d76'};
var UAV_ITEM_CATS=['طائرة كاملة','ملحق / معدة'];

function pgUAV(){
  if(!p('uav')&&CU.role!=='manager'){
    document.getElementById('page').innerHTML='<div class="panel" style="text-align:center;padding:60px"><div style="font-size:40px;margin-bottom:12px">⛔</div><div>ليس لديك صلاحية لعرض الطائرات المسيرة</div></div>';
    return;
  }
  if(!DB.uavDevices) DB.uavDevices=[];
  var devs=DB.uavDevices;
  var canEdit=(CU.role==='manager'||p('uavEdit'));
  var byS={};
  UAV_STATUS.forEach(function(s){byS[s]=devs.filter(function(d){return d.status===s;}).length;});

  var html='<div class="ph"><div><div class="pt">🛩️ الطائرات المسيرة</div>';
  html+='<div class="ps" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:4px">';
  UAV_STATUS.forEach(function(s){
    if(byS[s]) html+='<span style="color:'+(UAV_SC[s]||'var(--mt)')+';font-size:12px">'+s+': <b>'+byS[s]+'</b></span>';
  });
  html+='</div></div>';
  html+='<div style="display:flex;gap:8px;flex-wrap:wrap">';
  if(canEdit) html+='<button class="btn btn-bl" onclick="openAddUAV()">+ إضافة طائرة</button>';
  html+=(CU.role==='manager')?'<button class="btn btn-gy" onclick="exportUAVExcel()">⬇️ Excel</button>':'';
  html+='</div></div>';

  // فلاتر
  var fS=window._uavFS||'', fB=window._uavFB||'', fQ=window._uavFQ||'';
  html+='<div style="display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 12px">';
  html+='<input id="uav-search" placeholder="🔍 بحث..." value="'+esc(fQ)+'" style="flex:1;min-width:120px;padding:7px 12px;border-radius:20px;border:1px solid var(--br);background:var(--sf);color:var(--tx);font-size:13px;outline:none" oninput="window._uavFQ=this.value;pgUAV()">';
  html+='<select onchange="window._uavFS=this.value;pgUAV()" style="padding:7px 10px;border-radius:20px;border:1px solid var(--br);background:var(--sf);color:var(--tx);font-size:13px">';
  html+='<option value="">كل الحالات</option>';
  UAV_STATUS.forEach(function(s){html+='<option value="'+s+'"'+(fS===s?' selected':'')+'>'+s+'</option>';});
  html+='</select>';
  html+='<select onchange="window._uavFB=this.value;pgUAV()" style="padding:7px 10px;border-radius:20px;border:1px solid var(--br);background:var(--sf);color:var(--tx);font-size:13px">';
  html+='<option value="">كل الشركات</option>';
  UAV_BRANDS.forEach(function(b){html+='<option value="'+b+'"'+(fB===b?' selected':'')+'>'+b+'</option>';});
  html+='</select></div>';

  var shown=devs.filter(function(d){
    var q=(fQ||'').toLowerCase();
    var mq=!q||[d.name,d.brand,d.model,d.serial,d.assignedTo,d.location].some(function(v){return v&&v.toLowerCase().indexOf(q)>=0;});
    return mq&&(!fS||d.status===fS)&&(!fB||d.brand===fB);
  });

  html+='<div style="padding:0 16px 6px;font-size:13px;color:var(--mt)">📋 '+shown.length+' من '+devs.length+' طائرة</div>';
  html+='<div style="padding:0 16px">';

  if(!shown.length){
    html+='<div class="panel" style="text-align:center;padding:50px;color:var(--mt)"><div style="font-size:56px">🛩️</div><div style="margin-top:12px">لا طائرات مسيرة بعد</div>';
    if(canEdit) html+='<button class="btn btn-bl" style="margin-top:14px" onclick="openAddUAV()">+ إضافة أول طائرة</button>';
    html+='</div>';
  } else {
    for(var i=0;i<shown.length;i++){
      var d=shown[i];
      var col=UAV_SC[d.status]||'#0969da';
      html+='<div class="panel" style="margin-bottom:10px;border-right:3px solid '+col+'">';
      html+='<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">';
      html+='<div style="flex:1">';
      // العنوان
      html+='<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px">';
      html+='<span style="font-weight:700;font-size:16px">'+(d.itemCategory==='ملحق / معدة'?'📦 ':'🛩️ ')+esc(d.name||d.model||'عنصر')+'</span>';
      html+='<span style="font-size:11px;padding:2px 8px;border-radius:10px;background:'+col+'22;color:'+col+'">'+esc(d.status||'—')+'</span>';
      if(d.itemCategory==='ملحق / معدة') html+='<span style="font-size:11px;padding:2px 8px;border-radius:10px;background:#8957e522;color:#8957e5">'+esc(d.accessoryType||'ملحق')+'</span>';
      if(d.condition) html+='<span style="font-size:11px;padding:2px 8px;border-radius:10px;background:var(--bg);color:var(--mt)">'+esc(d.condition)+'</span>';
      html+='</div>';
      // التفاصيل
      html+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:4px;font-size:12px;color:var(--mt)">';
      if(d.itemCategory==='ملحق / معدة'&&d.qty>1) html+='<span>🔢 العدد: <b style="color:var(--tx)">'+d.qty+'</b></span>';
      if(d.brand)       html+='<span>🏭 '+esc(d.brand)+'</span>';
      if(d.model)       html+='<span>✈️ '+esc(d.model)+'</span>';
      if(d.type)        html+='<span>🔧 '+esc(d.type)+'</span>';
      if(d.camera)      html+='<span>📷 '+esc(d.camera)+'</span>';
      if(d.serial)      html+='<span>🔢 SN: <b style="color:var(--tx)">'+esc(d.serial)+'</b></span>';
      if(d.flightTime)  html+='<span>⏱️ '+esc(d.flightTime)+' دقيقة</span>';
      if(d.range)       html+='<span>📡 مدى: '+esc(d.range)+' كم</span>';
      if(d.assignedTo)  html+='<span style="color:var(--bl)">👤 '+esc(d.assignedTo)+'</span>';
      if(d.location)    html+='<span style="color:var(--gn)">📍 '+esc(d.location)+'</span>';
      html+='</div>';
      // الملحقات
      if(d.accessories&&d.accessories.length){
        html+='<div style="margin-top:6px;font-size:12px"><b>📦 الملحقات:</b> ';
        html+=d.accessories.map(function(a){return '<span style="background:var(--bg);padding:2px 6px;border-radius:5px;margin-right:3px">'+esc(a)+'</span>';}).join('');
        html+='</div>';
      }
      if(d.notes) html+='<div style="font-size:11px;color:var(--mt);margin-top:4px">📝 '+esc(d.notes)+'</div>';
      html+='</div>';
      // أزرار
      if(canEdit){
        html+='<div style="display:flex;flex-direction:column;gap:4px">';
        html+='<button class="btn btn-sm btn-gy" onclick="openEditUAV(\''+d.id+'\')">✏️</button>';
        html+='<button class="btn btn-sm btn-rd" onclick="delUAV(\''+d.id+'\')">🗑</button>';
        html+='</div>';
      }
      html+='</div></div>';
    }
  }
  html+='</div>';
  document.getElementById('page').innerHTML=html;
}

function openAddUAV(){ _uavForm(null); }

function toggleUAVFormFields(){
  var cat = val('uav-cat');
  var isAccessory = (cat === 'ملحق / معدة');
  var planeEl = document.getElementById('uav-plane-fields');
  var accEl = document.getElementById('uav-accessory-fields');
  if(planeEl) planeEl.style.display = isAccessory ? 'none' : 'contents';
  if(accEl) accEl.style.display = isAccessory ? 'contents' : 'none';
}

function saveUAV(existId){
  var name=val('uav-name');
  if(!name){toast('أدخل اسم العنصر','err');return;}
  var id=existId||gid();
  var prev=null;
  var devs=DB.uavDevices||[];
  for(var i=0;i<devs.length;i++){if(devs[i].id===existId){prev=devs[i];break;}}
  prev=prev||{};
  var cat = val('uav-cat')||'طائرة كاملة';
  var isAccessory = (cat==='ملحق / معدة');
  var accRaw=val('uav-acc')||'';
  var accessories=accRaw?accRaw.split(/[،,]/).map(function(s){return s.trim();}).filter(Boolean):[];
  var data={
    id:id, itemCategory:cat, name:val('uav-name'),
    brand:isAccessory?'':val('uav-brand'),
    model:isAccessory?val('uav-acc-model'):val('uav-model'),
    type:isAccessory?'':val('uav-type'),
    camera:isAccessory?'':val('uav-camera'),
    serial:val('uav-serial'),
    flightTime:isAccessory?'':val('uav-flight'),
    range:isAccessory?'':val('uav-range'),
    accessoryType:isAccessory?val('uav-acc-type'):'',
    qty:isAccessory?(parseInt(val('uav-acc-qty'))||1):1,
    status:val('uav-status'), condition:val('uav-cond'),
    assignedTo:val('uav-assigned'), location:val('uav-location'),
    accessories:isAccessory?[]:accessories, notes:val('uav-notes'),
    by:prev.by||CU.name, date:prev.date||ts(), _ts:Date.now()
  };
  fbSet('uavDevices/'+id, data);
  logAct(existId?'تعديل عنصر (طائرات/ملحقات)':'إضافة عنصر (طائرات/ملحقات)', data.name||data.model);
  closeModal();
  toast(existId?'✅ تم التعديل':'✅ تمت الإضافة');
  setTimeout(pgUAV, 400);
}

function delUAV(id){
  var d=null;
  var devs=DB.uavDevices||[];
  for(var i=0;i<devs.length;i++){if(devs[i].id===id){d=devs[i];break;}}
  confirmDel('حذف الطائرة: '+(d?d.name||d.model:id)+'؟',"fbDel('uavDevices/"+id+"');toast('تم الحذف','err');setTimeout(pgUAV,400)");
}


function exportFieldSiteExcel(siteId){
  if(CU.role!=='manager'){toast('تصدير الميدانية للمدير فقط','err');return;}
  var site=DB.fieldSites.find(function(s){return s.id===siteId;});
  if(!site){toast('الموقع غير موجود','err');return;}
  var AT=allT();
  var xls='<html dir="rtl"><head><meta charset="utf-8"><style>body{font-family:Arial;direction:rtl}h2{color:#0969da}h3{color:#1a7f37;border-bottom:2px solid #1a7f37;padding-bottom:4px;margin-top:20px}table{width:100%;border-collapse:collapse;margin-bottom:20px}th{background:#1a2332;color:#fff;padding:9px 12px;text-align:right;font-size:18px;font-weight:600}td{border:1px solid #ddd;padding:8px 12px;font-size:16px}tr:nth-child(even) td{background:#f5f8ff}</style></head><body>';
  xls+='<h2>🗺️ تصدير الموقع الميداني — '+esc(site.name)+'</h2>';
  xls+='<p style="color:#666">تاريخ التصدير: '+fmtDate(new Date().toISOString())+'</p>';

  // الكاميرات
  var cams=site.cameras||[];
  xls+='<h3>📷 الكاميرات ('+cams.length+')</h3>';
  if(cams.length){
    xls+='<table><thead><tr><th>الاسم</th><th>النوع</th><th>السيريال</th><th>الموديل</th><th>الدقة</th><th>الاتجاه</th><th>الوصف</th><th>Lat</th><th>Lng</th></tr></thead><tbody>';
    cams.forEach(function(c){
      xls+='<tr><td>'+esc(c.name||c.serial||'')+'</td><td>'+esc(c.cT||'')+'</td><td>'+esc(c.serial||'')+'</td><td>'+esc(c.model||'')+'</td><td>'+esc(c.rs||'')+'</td><td>'+esc(c.dir||'')+'</td><td>'+esc(c.installDesc||c.dc||'')+'</td><td>'+esc(String(c.lat||''))+'</td><td>'+esc(String(c.lng||''))+'</td></tr>';
    });
    xls+='</tbody></table>';
  } else { xls+='<p style="color:#999">لا كاميرات مسجلة</p>'; }

  // جرد الموقع
  var invData=DB.siteInventory&&DB.siteInventory[siteId];
  var pts=invData?Object.values(invData):[];
  var allInvItems=[];
  pts.forEach(function(pt){if(pt.items){Object.values(pt.items).forEach(function(it){allInvItems.push({pt:pt.name,item:it});});}});
  xls+='<h3>📦 جرد الموقع ('+allInvItems.length+')</h3>';
  if(allInvItems.length){
    xls+='<table><thead><tr><th>النقطة</th><th>النوع</th><th>الاسم</th><th>السيريال</th><th>الحالة</th></tr></thead><tbody>';
    allInvItems.forEach(function(r){
      var it=r.item;
      xls+='<tr><td>'+esc(r.pt)+'</td><td>'+esc(AT[it.type]?AT[it.type].label:it.type||'')+'</td><td>'+esc(it.name||it.serial||'')+'</td><td>'+esc(it.serial||'')+'</td><td>'+esc(it.status||'')+'</td></tr>';
    });
    xls+='</tbody></table>';
  } else { xls+='<p style="color:#999">لا مواد مجردة</p>'; }

  // أجهزة الراديو في الموقع
  var siteRadio=(DB.radioDevices||[]).filter(function(d){return d.location&&d.location.indexOf(site.name)>=0;});
  xls+='<h3>📻 أجهزة المناداة ('+siteRadio.length+')</h3>';
  if(siteRadio.length){
    xls+='<table><thead><tr><th>الاسم</th><th>الموديل</th><th>التردد</th><th>الحالة</th><th>بحوزة</th></tr></thead><tbody>';
    siteRadio.forEach(function(d){
      xls+='<tr><td>'+esc(d.name||d.serial||'')+'</td><td>'+esc(d.model||'')+'</td><td>'+esc(d.frequency||'')+'</td><td>'+esc(d.status||'')+'</td><td>'+esc(d.assignedTo||'')+'</td></tr>';
    });
    xls+='</tbody></table>';
  } else { xls+='<p style="color:#999">لا أجهزة مناداة</p>'; }

  // الطائرات في الموقع
  var siteUAV=(DB.uavDevices||[]).filter(function(d){return d.location&&d.location.indexOf(site.name)>=0;});
  xls+='<h3>🛩️ الطائرات المسيرة ('+siteUAV.length+')</h3>';

function exportTechMapExcel(){
  if(CU.role!=='manager'){toast('التصدير للمدير فقط','err');return;}
  var locs=DB.techLocations||{};
  var users=DB.users||[];
  function toDMS(deg){
    var d=Math.floor(Math.abs(deg));
    var mf=(Math.abs(deg)-d)*60;
    var m=Math.floor(mf);
    var s=((mf-m)*60).toFixed(1);
    return d+'° '+m+"' "+s+'"';
  }
  var h=['الاسم','الدور','آخر ظهور','خط العرض','خط الطول','DMS (خط العرض)','DMS (خط الطول)','Lat,Lng'];
  var xls='<html dir="rtl"><head><meta charset="utf-8"><style>body{font-family:Arial;direction:rtl}table{width:100%;border-collapse:collapse}th{background:#1a2332;color:#fff;padding:9px 12px;text-align:right;font-size:18px;font-weight:600}td{border:1px solid #ddd;padding:8px 12px;font-size:16px}tr:nth-child(even) td{background:#f5f8ff}</style></head><body>';
  xls+='<h2>🗺️ مواقع الفنيين</h2><p style="color:#666">'+fmtDate(new Date().toISOString())+'</p>';
  xls+='<table><thead><tr>'+h.map(function(x){return '<th>'+x+'</th>';}).join('')+'</tr></thead><tbody>';
  users.forEach(function(u){
    var uid=u.uid||u.id;
    var loc=locs[uid];
    if(!loc||!loc.lat) return;
    var lastTime=loc._ts?fmtDateTime(loc._ts):(loc.time||'');
    var lat=parseFloat(loc.lat)||0;
    var lng=parseFloat(loc.lng)||0;
    var latDMS=(lat<0?'S ':'N ')+toDMS(lat);
    var lngDMS=(lng<0?'W ':'E ')+toDMS(lng);
    xls+='<tr><td>'+esc(u.name||'')+'</td><td>'+esc(ROLES[u.role]||u.role||'')+'</td><td>'+esc(lastTime)+'</td><td>'+lat.toFixed(6)+'</td><td>'+lng.toFixed(6)+'</td><td style="direction:ltr">'+latDMS+'</td><td style="direction:ltr">'+lngDMS+'</td><td style="direction:ltr">'+lat.toFixed(6)+','+lng.toFixed(6)+'</td></tr>';
  });
  xls+='</tbody></table></body></html>';
  var blob=new Blob(['﻿'+xls],{type:'application/vnd.ms-excel;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='مواقع_الفنيين_'+new Date().toISOString().split('T')[0]+'.xls';
  a.click();URL.revokeObjectURL(url);
  toast('✅ تم تصدير مواقع الفنيين');
}

// ══ السحب والتحريك للعناصر العائمة ══
function makeDraggable(btnEl, containerEl){
  var isDragging=false, startX=0, startY=0, startLeft=0, startBottom=0, moved=false;
  var longPressTimer=null;
  btnEl.addEventListener('touchstart',function(e){
    moved=false;
    longPressTimer=setTimeout(function(){
      isDragging=true;
      var touch=e.touches[0];
      startX=touch.clientX; startY=touch.clientY;
      var rect=(containerEl||btnEl).getBoundingClientRect();
      startLeft=rect.left; startBottom=window.innerHeight-rect.bottom;
      (containerEl||btnEl).style.transition='none';
    },400);
  },{passive:true});
  btnEl.addEventListener('touchmove',function(e){
    moved=true;
    clearTimeout(longPressTimer);
    if(!isDragging) return;
    e.preventDefault();
    var touch=e.touches[0];
    var dx=touch.clientX-startX, dy=touch.clientY-startY;
    var el=containerEl||btnEl;
    var newLeft=Math.max(0,Math.min(window.innerWidth-60,startLeft+dx));
    var newBottom=Math.max(0,Math.min(window.innerHeight-60,startBottom-dy));
    el.style.left=newLeft+'px'; el.style.right='auto';
    el.style.bottom=newBottom+'px'; el.style.top='auto';
  },{passive:false});
  btnEl.addEventListener('touchend',function(){
    clearTimeout(longPressTimer);
    (containerEl||btnEl).style.transition='';
    isDragging=false;
  });
}
