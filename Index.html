<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>CCTV Manager</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CCTV Manager">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f0f2f5;--sf:#ffffff;--br:#d0d7de;--tx:#1f2328;--mt:#656d76;--bl:#0969da;--gn:#1a7f37;--rd:#d1242f;--yl:#9a6700;--pu:#8250df;}
/* منع قائمة "تنزيل/مشاركة/طباعة" الافتراضية التي تظهر على الموبايل عند الضغط
   المطول على بلاطات الخريطة (Leaflet tiles هي عناصر <img>) — ضرورية لعمل
   ميزة الضغط المطول لإضافة عناصر (كاميرا/برج/P2P/راديو/NVR) بدون تعارض */
.leaflet-container, .leaflet-container img, .leaflet-tile, .leaflet-tile-pane{
  -webkit-touch-callout: none !important;
  -webkit-user-select: none !important;
  user-select: none !important;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:'Segoe UI',Tahoma,Arial,sans-serif;direction:rtl;font-size:17px;}
body { overflow-x: hidden; font-size: 17px; }
::-webkit-scrollbar{width:6px;height:6px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--br);border-radius:6px;}::-webkit-scrollbar-thumb:hover{background:var(--mt);}

#app{ display: none; flex-direction: column; height: 100vh; max-height: 100vh; overflow: hidden; }
#main { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--bg); }
#page { padding: 16px 12px; }

/* ===== SIDEBAR ===== */
#sidebar {
    background: var(--sf);
    border-bottom: 1px solid var(--br);
    box-shadow: 0 2px 8px rgba(0,0,0,.1);
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    padding: 6px 12px;
    flex-shrink: 0;
    overflow-x: auto;
    overflow-y: hidden;
    gap: 10px;
}
.sb-brand { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.sb-brand .logo{ font-size: 18px; font-weight:700; color:var(--bl); white-space: nowrap; }
.sb-brand .sub{ font-size: 10px; color:var(--mt); display: none; }

.sb-user { flex-shrink: 0; }
.sb-ui { display: flex; align-items: center; gap: 8px; background: var(--bg); padding: 4px 8px; border-radius: 20px; }
.av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:#fff;flex-shrink:0;}
.sb-un{font-size:17px;font-weight:600; white-space: nowrap;}
.sb-ur{font-size:10px; display: none;}

.sb-nav {
    display: flex;
    flex-direction: row;
    gap: 4px;
    flex: 1 1 auto;
    justify-content: center;
}
.nb {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--mt);
    padding: 8px 10px;
    cursor: pointer;
    font-size: 18px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    transition: all .12s;
}
.nb:hover { background: rgba(255,255,255,.04); color: var(--tx); }
.nb.act { color: var(--bl); border-bottom-color: var(--bl); background: rgba(88,166,255,.12); font-weight:700; }
.nb.main { font-size: 17px; font-weight: 600; }
.nb .ic { font-size: 18px; }
.nav-group-label { display:none; }

/* ===== Messenger-style Chat Bubble ===== */
#chat-bubble {
  position: fixed;
  bottom: 90px;
  left: 20px;
  z-index: 2000;
  display: none;
}
#chat-bubble-btn {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: linear-gradient(135deg, #0084ff, #0099ff);
  border: none;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(0,132,255,.5);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  transition: transform .2s;
  position: relative;
}
#chat-bubble-btn:active { transform: scale(.92); }
#chat-unread-badge {
  position: absolute;
  top: -4px;
  right: -4px;
  background: #f85149;
  color: #fff;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 6px;
  min-width: 18px;
  text-align: center;
  display: none;
}
#chat-popup {
  position: fixed;
  bottom: 160px;
  left: 16px;
  width: calc(100vw - 32px);
  max-width: 380px;
  height: 65vh;
  max-height: 520px;
  background: var(--sf);
  border-radius: 20px;
  box-shadow: 0 8px 40px rgba(0,0,0,.4);
  display: none;
  flex-direction: column;
  z-index: 1999;
  border: 1px solid var(--br);
  overflow: hidden;
  animation: popIn .2s ease;
}
@keyframes popIn {
  from { opacity:0; transform: scale(.92) translateY(20px); }
  to   { opacity:1; transform: scale(1)  translateY(0); }
}
#chat-popup-header {
  background: linear-gradient(135deg, #0084ff, #0066cc);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
#chat-popup-msgs {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
#chat-popup-input {
  display: flex;
  gap: 8px;
  padding: 10px 12px;
  border-top: 1px solid var(--br);
  background: var(--sf);
  flex-shrink: 0;
}
.chat-msg-bubble {
  max-width: 78%;
  padding: 9px 13px;
  border-radius: 18px;
  font-size: 15px;
  line-height: 1.4;
  word-break: break-word;
}
.chat-msg-me {
  background: #0084ff;
  color: #fff;
  align-self: flex-end;
  border-bottom-right-radius: 4px;
}
.chat-msg-other {
  background: var(--bg);
  color: var(--tx);
  align-self: flex-start;
  border-bottom-left-radius: 4px;
}
.chat-msg-name {
  font-size: 11px;
  color: var(--mt);
  margin-bottom: 3px;
  font-weight: 600;
}
.chat-msg-time {
  font-size: 10px;
  opacity: .6;
  margin-top: 3px;
  text-align: left;
}

/* ===== فقاعة Messenger ===== */
#msg-bubble-wrap {
  position: fixed;
  bottom: 90px;
  right: 20px;
  z-index: 2000;
  display: none;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
}
#msg-bubble-btn {
  width: 54px; height: 54px;
  border-radius: 50%;
  background: linear-gradient(135deg,#0084ff,#0066dd);
  border: none; cursor: pointer;
  box-shadow: 0 4px 20px rgba(0,132,255,.5);
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; transition: transform .2s;
  position: relative;
}
#msg-bubble-btn:active { transform: scale(.92); }
#msg-bubble-badge {
  position: absolute; top: -2px; right: -2px;
  background: var(--rd); color: #fff;
  border-radius: 50%; width: 18px; height: 18px;
  font-size: 11px; font-weight: 700;
  display: none; align-items: center; justify-content: center;
}
#msg-bubble-panel {
  width: 300px;
  max-height: 420px;
  background: var(--sf);
  border: 1px solid var(--br);
  border-radius: 18px;
  box-shadow: 0 8px 32px rgba(0,0,0,.3);
  display: none;
  flex-direction: column;
  overflow: hidden;
}
#msg-bubble-panel.open { display: flex; }

/* ===== شبكة المربعات في لوحة التحكم ===== */
.dash-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; padding: 0 16px 24px; }
.dash-tile {
    background: var(--sf);
    border: 1px solid var(--br);
    border-radius: 20px;
    padding: 26px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    cursor: pointer;
    transition: all .15s;
    text-align: center;
    min-height: 110px;
    position: relative;
}
.dash-tile:active { transform: scale(.97); background: rgba(88,166,255,.1); }
.dash-tile:hover { background: rgba(88,166,255,.08); border-color: var(--bl); }
.dash-tile.act { background: rgba(88,166,255,.14); border-color: var(--bl); }
.dash-tile .t-ic { font-size: 36px; }
.dash-tile .t-lb { font-size: 18px; color: var(--tx); font-weight: 600; line-height: 1.3; }
.dash-tile .t-badge { position: absolute; top: 10px; left: 10px; font-size: 11px; background: var(--rd); color: #fff; border-radius: 10px; padding: 2px 7px; font-weight: 700; }

/* ===== Light Theme ===== */

.sb-bot { flex-shrink: 0; }
.sb-bot .btn { padding: 6px 12px; font-size: 12px; }

/* ===== MEDIA QUERY للهواتف ===== */
@media (max-width: 768px) {
    #page { padding: 12px; }
    #sidebar { padding: 4px 8px; gap: 5px; }
    .sb-brand .logo { font-size: 18px; }
    .sb-ui { padding: 2px 6px; }
    .av { width: 24px; height: 24px; font-size: 11px; }
    .sb-un { font-size: 11px; max-width: 70px; overflow: hidden; text-overflow: ellipsis; }
    .nb { padding: 7px 8px; font-size: 18px; gap: 4px; }
    .nb .ic { font-size: 18px; }
    .sb-bot .btn { padding: 4px 8px; font-size: 11px; }
    .cg { grid-template-columns: 1fr 1fr; gap: 8px; }
    .sc { padding: 12px; gap: 10px; }
    .si { width: 40px; height: 40px; font-size: 20px; }
    .sn { font-size: 26px; }
    .tw { overflow-x: auto; }
    table { min-width: 600px; }
    .fg { grid-template-columns: 1fr; }
    .fr { flex-direction: column; }
    .fr input, .fr select { width: 100%; }
    .tabs { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 8px; }
    .tb { white-space: nowrap; }
    .ph { flex-direction: column; align-items: flex-start; gap: 8px; }
    .ph > div { width: 100%; }
    .ph > div:last-child { display: flex; width: 100%; gap: 8px; }
    .ph > div:last-child button { flex: 1; }
    .lbox { width: 90%; padding: 24px; }
}

/* باقي الأنماط */
/* ===== SKELETON LOADING ===== */
@keyframes skPulse { 0%,100%{opacity:.4} 50%{opacity:.8} }

/* ===== SPLASH SCREEN ===== */
#splash {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 9999; gap: 16px;
}
#splash .sp-logo { font-size: 64px; animation: spPulse 1.2s infinite; }
#splash .sp-txt  { font-size: 20px; font-weight: 700; color: var(--bl); }
#splash .sp-sub  { font-size: 14px; color: var(--mt); }
@keyframes spPulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.08);opacity:.75} }

#ls{height:100vh;display:flex;align-items:center;justify-content:center; background: var(--bg);}
.lbox{background:var(--sf);border:1px solid var(--br);border-radius:12px;padding:36px;width:390px; max-width: 95%;}
.llogo{text-align:center;margin-bottom:28px;}
.llogo .ico{font-size:48px;}
.llogo h1{font-size:26px;color:var(--bl);margin-top:10px;}
.llogo p{color:var(--mt);font-size:17px;margin-top:4px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:16px;color:var(--mt);margin-bottom:6px;font-weight:700;letter-spacing:.2px;}
.field input,.field select,.field textarea{width:100%;background:var(--bg);border:1.5px solid var(--br);border-radius:10px;padding:12px 14px;color:var(--tx);font-size:17px;outline:none;direction:rtl;font-family:inherit;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--bl);box-shadow:0 0 0 3px rgba(88,166,255,.15);}
.field textarea{resize:vertical;min-height:70px;}
.ckf{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
.ckf input[type=checkbox]{width:16px;height:16px;flex-shrink:0;cursor:pointer;}
.ckf label{font-size:17px;color:var(--tx);cursor:pointer;}
.btn{border:none;border-radius:12px;padding:11px 20px;font-size:18px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .12s;}
.btn:hover{filter:brightness(1.15);}.btn:active{filter:brightness(.9);}
.btn-bl{background:var(--bl);color:#000;}.btn-gn{background:var(--gn);color:#000;}
.btn-rd{background:#f8514922;border:1px solid #f8514944;color:var(--rd);}
.btn-gy{background:var(--br);color:var(--tx);}
.btn-yl{background:#d2992222;border:1px solid #d2992244;color:var(--yl);}
.btn-pu{background:#bc8cff22;border:1px solid #bc8cff44;color:var(--pu);}
.btn-or{background:#ff7b0022;border:1px solid #ff7b0044;color:#ff7b00;}
.btn-sm{padding:9px 16px;font-size:16px;}.btn-fw{width:100%;padding:11px;font-size:17px;}
.ebox{background:#f8514918;border:1px solid #f8514944;border-radius:7px;padding:9px 12px;color:var(--rd);font-size:17px;text-align:center;margin-bottom:10px;}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px;padding:0 4px;}
.pt{font-size:26px;font-weight:700;}.ps{font-size:18px;color:var(--mt);margin-top:3px;}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px;}
.sc{background:var(--sf);border:1px solid var(--br);border-radius:14px;padding:18px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.si{font-size:26px;width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sn{font-size:36px;font-weight:800;line-height:1;}.sl{font-size:18px;color:var(--mt);margin-top:3px;}
.tw{background:var(--sf);border:1px solid var(--br);border-radius:10px;overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th{padding:10px 13px;text-align:right;font-size:12px;color:var(--mt);font-weight:600;background:var(--bg);white-space:nowrap;}
td{padding:10px 13px;border-top:1px solid var(--br);vertical-align:middle;}
tr:hover td{background:rgba(255,255,255,.025);}
.tm{font-weight:600;}.ts{font-size:12px;color:var(--mt);margin-top:2px;}
.erow td{text-align:center;padding:40px;color:var(--mt);}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;}
.panel{background:var(--sf);border:1px solid var(--br);border-radius:14px;padding:18px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.1);}
.ptitle{font-size:17px;font-weight:700;color:var(--mt);margin-bottom:14px;}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--br);}
.tb{padding:6px 14px;border-radius:20px;border:none;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .12s;}
.tb.act{background:var(--bl);color:#000;}.tb:not(.act){background:var(--br);color:var(--mt);}
.fr{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px;}
.fr input,.fr select{flex:1;min-width:130px;background:var(--bg);border:1px solid var(--br);border-radius:7px;padding:8px 11px;color:var(--tx);font-size:17px;outline:none;direction:rtl;font-family:inherit;}
.fr input:focus,.fr select:focus{border-color:var(--bl);}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:200;padding:16px;}
.modal-ov.open{display:flex;}
.mbx{background:var(--sf);border:1px solid var(--br);border-radius:20px;padding:24px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:0 16px 48px rgba(0,0,0,.3);}
.mhd{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.mhd h3{font-size:18px;font-weight:700;}
.xb{background:none;border:none;color:var(--mt);font-size:26px;cursor:pointer;line-height:1;padding:0;}
.mft{display:flex;gap:9px;justify-content:flex-end;margin-top:20px;}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.fg .s2{grid-column:1/-1;}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--gn);color:#000;padding:12px 24px;border-radius:20px;font-size:17px;font-weight:700;z-index:9999;display:none;box-shadow:0 6px 24px rgba(0,0,0,.3);}
.sec{font-size:12px;font-weight:700;color:var(--mt);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--br);}
.dac{display:flex;justify-content:space-between;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12px;}
.dac:hover{background:rgba(255,255,255,.05);}
.ri{padding:9px 0;border-bottom:1px solid var(--br);display:flex;justify-content:space-between;align-items:center;gap:8px;}
.ri:last-child{border-bottom:none;}
.fc{background:var(--sf);border:1px solid var(--br);border-radius:10px;padding:16px;margin-bottom:10px;border-right-width:4px;}
.fst-btn{width:100%;text-align:right;margin-bottom:4px;font-size:12px;padding:6px 10px;}
.ni{background:var(--sf);border:1px solid var(--br);border-right-width:3px;border-radius:9px;padding:13px 15px;margin-bottom:8px;display:flex;align-items:center;gap:12px;cursor:pointer;}
.ni.rd{opacity:.55;}
.ucards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.uc{background:var(--sf);border:1px solid var(--br);border-radius:10px;padding:16px;border-top-width:3px;}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;}
.pi{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg);border-radius:7px;font-size:17px;}
.pi input[type=checkbox]{width:15px;height:15px;cursor:pointer;flex-shrink:0;}
.imp-area{border:2px dashed var(--br);border-radius:10px;padding:28px;text-align:center;cursor:pointer;transition:border-color .2s;}
.imp-area:hover{border-color:var(--bl);}
.tch{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;background:var(--bg);border:1px solid var(--br);border-radius:20px;font-size:12px;margin:3px;}
.task-card{background:var(--sf);border:1px solid var(--br);border-radius:10px;padding:14px;margin-bottom:8px;border-right:3px solid var(--bl);}
#cam-map{height:500px;border-radius:10px;border:1px solid var(--br);margin-bottom:16px;z-index:1;}
.dir-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;max-width:160px;}
.dir-btn{padding:9px;border:1px solid var(--br);border-radius:7px;background:var(--bg);color:var(--mt);cursor:pointer;font-size:17px;text-align:center;line-height:1;}
.dir-btn.sel{background:#58a6ff22;border-color:var(--bl);color:var(--bl);}
.leaflet-popup-content-wrapper{background:#161b22!important;border:1px solid #30363d!important;color:#e6edf3!important;border-radius:10px!important;}
.leaflet-popup-tip{background:#161b22!important;}

/* أنماط جديدة لإدارة الصلاحيات */
.perms-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    background: var(--bg);
    border-radius: 12px;
    font-size: 11px;
    color: var(--mt);
    border: 1px solid var(--br);
    margin: 2px;
}
.perms-badge.allowed {
    background: #3fb95022;
    border-color: #3fb95044;
    color: var(--gn);
}
.user-selector {
    max-height: 200px;
    overflow-y: auto;
    background: var(--bg);
    border-radius: 7px;
    padding: 10px;
    border: 1px solid var(--br);
}
</style>

</head>
<body>

<!-- Splash Screen — يظهر أثناء التحقق من الجلسة -->
<div id="splash">
  <div class="sp-logo">📹</div>
  <div class="sp-txt">CCTV Manager</div>
  <div class="sp-sub">جار التحقق من الجلسة...</div>
</div>

<div id="ls" style="display:none">
  <div class="lbox">
    <div class="llogo"><div class="ico">📹</div><h1>CCTV Manager</h1><p>نظام إدارة كاميرات المراقبة</p></div>
    <div id="lerr" class="ebox" style="display:none"></div>
    <div class="field"><label>البريد الإلكتروني</label><input id="lu" type="email" placeholder="user@example.com" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div class="field"><label>كلمة المرور</label><input id="lp" type="password" placeholder="••••••" onkeydown="if(event.key==='Enter')doLogin()"></div>

function p(k){
  if(!CU) return false;
  if(CU.role==='manager') return true; // المدير فقط يملك كل الصلاحيات
  // الإداري وباقي الأدوار — يعتمدون على الصلاحيات المحددة من المدير
  const perms = CU.perms || DEF_PERMS[CU.role] || {};
  return !!perms[k];
}

// دالة للتحقق مما إذا كان المستخدم الحالي مسموح له برؤية موقع معين
function canUserSeeFieldSite(site) {
  if(!CU) return false;
  if(CU.role==='manager') return true;
  // فحص perms.allowedSites أولاً (من إدارة المستخدمين)
  if(CU.perms&&CU.perms.allowedSites&&CU.perms.allowedSites.length){
    return CU.perms.allowedSites.indexOf(site.id)>=0;
  }
  // فحص allowedUsers في الموقع (من صفحة الميدانية)
  if(!site.allowedUsers || site.allowedUsers.length===0) return false;
  const myUid = CU.uid||CU.id;
  return site.allowedUsers.some(function(u){return u===myUid;});
}

// فلترة المواقع الميدانية حسب صلاحيات المستخدم
function getVisibleFieldSites() {
  if(!CU) return [];
  if(CU.role === 'manager' || CU.role === 'viewer') return DB.fieldSites;
  return DB.fieldSites.filter(site => canUserSeeFieldSite(site));
}

// فلترة مواقع المخزن حسب صلاحيات المستخدم
function getVisibleSites(){
  if(!CU) return [];
  if(CU.role==='manager'||CU.role==='engineer'||CU.role==='viewer') return DB.sites;
  // الإداري والفني والصاعود — يرون فقط المواقع المصرح بها من المدير
  const allowed = CU.perms?.allowedSites;
  if(!allowed||!allowed.length) return [];
  return DB.sites.filter(s=>allowed.includes(s));
}

// إشعار لمستخدم محدد بـ UID
function pushToUser(text, targetUids, type='info'){
  if(!targetUids||!targetUids.length) return pushN(text,type);
  const uids = targetUids.filter(Boolean);
  fbPush('notifs',{text,type,time:ts(),read:false,_ts:Date.now(),allowedUsers:uids});
  buildNav();
  const myUid = CU?.uid||CU?.id;
  if(uids.includes(myUid)){
    try{ localNotif('CCTV Manager', text); }catch(e){}
  }
  try{
    fetch(CF_WORKER+'/notify',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({title:'CCTV Manager', message:text, type, allowedUsers:uids})
    }).catch(()=>{});
  }catch(e){}
}

// إشعار مرتبط بموقع ميداني — يُرسل فقط لمن لديه صلاحية
function pushFieldN(text, fieldSiteId, type='info'){
  const site = DB.fieldSites.find(s=>s.id===fieldSiteId);
  const allowedUsers = site?.allowedUsers || [];
  
  // دائماً يصل للمدير
  // يصل للمستخدم فقط إذا كان في allowedUsers
  fbPush('notifs',{
    text, type, time:ts(), read:false, _ts:Date.now(),
    fieldSiteId,  // ← مهم للفلترة عند العرض
    allowedUsers: allowedUsers.length ? allowedUsers : ['manager_only']
  });
  buildNav();
  
  // إشعار محلي — فقط إذا كان المستخدم الحالي مديراً أو في القائمة
  const myUid = CU.uid||CU.id;
  const canSee = CU.role==='manager' || allowedUsers.includes(myUid);
  if(canSee){
    try{ localNotif('CCTV Manager', text); }catch(e){}
  }
  
  // إرسال Push للأجهزة عبر Cloudflare مع قائمة المسموح لهم
  try{
    fetch(CF_WORKER+'/notify', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        title:'CCTV Manager', message:text, type,
        allowedUsers: allowedUsers.length ? allowedUsers : null // null = أرسل للكل
      })
    }).catch(()=>{});
  }catch(e){}
}

function doLogin(){
  const email = val('lu'), pw = $('lp').value;
  const remember = $('lremember') ? $('lremember').checked : true;
  if(!email||!pw){ const e=$('lerr'); e.textContent='أدخل البريد وكلمة المرور'; e.style.display='block'; return; }
  _loginAttempted = true;
  const btn=$('login-btn');
  btn.disabled=true;
  btn.textContent='⏳ جار التحقق...';
  $('lerr').style.display='none';
  FBAUTH.signInWithEmailAndPassword(email,pw).then(function(){
    if(remember){
      try{
        // ترميز بسيط (ليس تشفيراً حقيقياً) لمنع القراءة المباشرة كنص واضح
        // الحماية الفعلية تعتمد على قفل الجهاز نفسه (بصمة/رمز)
        const packed = btoa(unescape(encodeURIComponent(JSON.stringify({e:email,p:pw}))));
        localStorage.setItem('cctv_remember', packed);
      }catch(e){ console.warn('Remember-me save failed:', e); }
    } else {
      localStorage.removeItem('cctv_remember');
    }
  }).catch(err=>{
    const msgs={
      'auth/user-not-found':'❌ البريد غير موجود',
      'auth/wrong-password':'❌ كلمة المرور خاطئة',
      'auth/invalid-email':'❌ البريد غير صحيح',
      'auth/too-many-requests':'⛔ محاولات كثيرة، انتظر قليلاً',
      'auth/network-request-failed':'❌ لا يوجد اتصال بالإنترنت',
      'auth/invalid-credential':'❌ البريد أو كلمة المرور خاطئة',
      'auth/user-disabled':'⛔ الحساب معطّل'
    };
    const e=$('lerr');
    e.textContent = msgs[err.code] || ('❌ ' + err.code);
    e.style.display = 'block';
    e.style.opacity = '1';
    const b=$('login-btn');
    b.disabled=false;
    b.textContent='تسجيل الدخول';
    console.error('Login error:', err.code, err.message);
  });
}

function doLogout(){
  _isLoggingOut = true;
  _loginAttempted = false;
  localStorage.removeItem('cctv_had_session'); // مسح صريح — لا نريد محاولة استرجاع بعد خروج مقصود
  localStorage.removeItem('cctv_remember'); // مسح بيانات "تذكرني" — خروج صريح يعني عدم رغبة بالبقاء متصلاً
  stopGPSTracking();
  const fab = document.getElementById('quick-fab');
  if(fab) fab.style.display='none';
  hideMsgBubble();
  // تحديث حالة الفني كـ offline
  if(CU&&(CU.role==='field'||CU.role==='technician')){
    try{ fbUpdate('techLocations/'+(CU.uid||CU.id),{online:false}); }catch(e){}
  }
  try{ FBDB.ref('cctv').off(); }catch(e){}
  CU=null; PAGE='';
  FBAUTH.signOut().then(()=>{
    _isLoggingOut = false;
    $('app').style.display='none';
    $('ls').style.display='flex';
    $('lu').value=''; $('lp').value='';
    const btn=$('login-btn');
    btn.disabled=false;
    btn.textContent='تسجيل الدخول';
    $('lload').style.display='none';
    // لا نمسح lerr هنا — قد تحتوي على رسالة خطأ مهمة
  });
}

// ══════════════════════════════════════════════════════
//  🔐 نظام مقاومة انقطاع الجلسة — خط دفاع إضافي
//  يعمل جنباً إلى جنب مع setPersistence(LOCAL) وليس بديلاً عنه
// ══════════════════════════════════════════════════════
const SESSION_FLAG_KEY = 'cctv_had_session';
let _sessionRecoveryTimer = null;
let _sessionRecoveryAttempted = false;

FBAUTH.onAuthStateChanged(function(fbUser){
  if(_isLoggingOut) return; // تجاهل أي حدث أثناء تسجيل الخروج

  if(!fbUser){
    // هل كان هناك جلسة سابقة محفوظة؟ (يعني المستخدم سجّل دخول قبل ولم يخرج يدوياً)
    const hadSession = localStorage.getItem(SESSION_FLAG_KEY) === '1';

    if(hadSession && !_sessionRecoveryAttempted){
      // ⏳ ننتظر قليلاً قبل الحكم بأن الجلسة انتهت فعلاً —
      // أحياناً Firebase يحتاج وقتاً لاسترجاع التوكن من IndexedDB
      // خصوصاً بعد إعادة تشغيل كاملة للمتصفح/التطبيق
      _sessionRecoveryAttempted = true;
      const splash = $('splash');
      if(splash){
        splash.style.display='flex';
        const splashMsg = splash.querySelector('.sp-sub');
        if(splashMsg) splashMsg.textContent='جاري استعادة الجلسة...';
      }
      _sessionRecoveryTimer = setTimeout(function(){
        // انتهت المهلة ولم تُسترجع الجلسة تلقائياً — نحاول إعادة تسجيل الدخول
        // ببيانات "تذكرني" المحفوظة محلياً (إن وُجدت) قبل أن نزعج المستخدم بشاشة الدخول
        const remembered = localStorage.getItem('cctv_remember');
        if(remembered){
          try{
            const decoded = JSON.parse(decodeURIComponent(escape(atob(remembered))));
            const splash3 = $('splash');
            if(splash3){
              const splashMsg3 = splash3.querySelector('.sp-sub');
              if(splashMsg3) splashMsg3.textContent='جاري إعادة تسجيل الدخول...';
            }
            FBAUTH.signInWithEmailAndPassword(decoded.e, decoded.p).catch(function(){
              // فشلت إعادة الدخول التلقائي (كلمة مرور تغيّرت مثلاً) → شاشة دخول عادية
              localStorage.removeItem(SESSION_FLAG_KEY);
              localStorage.removeItem('cctv_remember');
              const splash4 = $('splash');
              if(splash4) splash4.style.display='none';
              $('ls').style.display='flex';
              const btn2=$('login-btn');
              if(btn2){ btn2.disabled=false; btn2.textContent='تسجيل الدخول'; }
              _loginAttempted = false;
            });
            return; // ننتظر نتيجة onAuthStateChanged التالية (نجاح أو فشل)
          }catch(e){
            console.warn('Remember-me restore failed:', e);
          }
        }
        // لا توجد بيانات محفوظة أصلاً → شاشة دخول عادية
        localStorage.removeItem(SESSION_FLAG_KEY);
        const splash2 = $('splash');
        if(splash2) splash2.style.display='none';
        $('ls').style.display='flex';
        const btn=$('login-btn');
        if(btn){ btn.disabled=false; btn.textContent='تسجيل الدخول'; }
        _loginAttempted = false;
      }, 4000); // 4 ثوانٍ مهلة كافية لاسترجاع IndexedDB دون إزعاج المستخدم
      return;
    }

    // لا توجد جلسة سابقة، أو انتهت مهلة الاسترجاع فعلاً → شاشة دخول عادية
    if(_sessionRecoveryTimer) clearTimeout(_sessionRecoveryTimer);
    const splash = $('splash');
    if(splash) splash.style.display='none';
    $('ls').style.display='flex';
    const btn=$('login-btn');
    if(btn){ btn.disabled=false; btn.textContent='تسجيل الدخول'; }
    _loginAttempted = false;
    return;
  }

  // ✅ نجحت استعادة الجلسة أو تسجيل دخول جديد — نحفظ البصمة ونلغي أي مؤقت انتظار
  if(_sessionRecoveryTimer){ clearTimeout(_sessionRecoveryTimer); _sessionRecoveryTimer=null; }
  localStorage.setItem(SESSION_FLAG_KEY, '1');

  console.log('Auth OK, uid:', fbUser.uid, 'email:', fbUser.email);
  // جلب بيانات المستخدم من قاعدة البيانات
  FBDB.ref('cctv/users/'+fbUser.uid).once('value').then(snap=>{
    console.log('DB user data:', snap.val());
    let userData=snap.val();
    if(!userData){
      // إذا كان أول مستخدم (المدير) أضف بياناته تلقائياً
      FBDB.ref('cctv/users').once('value').then(allSnap=>{
        const allUsers = allSnap.val();
        const isFirst = !allUsers || Object.keys(allUsers).length===0;
        if(isFirst){
          // أول مستخدم يسجل دخول يصبح مديراً تلقائياً
          const newUser = {
            uid: fbUser.uid,
            email: fbUser.email,
            name: fbUser.email.split('@')[0],
            role: 'manager',
            active: true,
            perms: null,
            createdAt: new Date().toLocaleString('ar-IQ')
          };
          FBDB.ref('cctv/users/'+fbUser.uid).set(newUser).then(()=>{
            CU={...newUser};
            const splash=$('splash'); if(splash) splash.style.display='none';
            $('lload').style.display='none';
            $('lerr').style.display='none';
            $('ls').style.display='none';
            $('app').style.display='flex';
            const av=$('sav');
            av.textContent=CU.name[0]; av.style.background=RC[CU.role]||'#f85149';
            $('snm').textContent=CU.name;
            $('srl').textContent=ROLES[CU.role]; $('srl').style.color=RC[CU.role];
            fbInitDB();
            fbStartSync();
          });
        } else {
          const splash=$('splash'); if(splash) splash.style.display='none';
          $('ls').style.display='flex';
          const e=$('lerr');
          e.textContent='❌ حسابك غير مسجّل في النظام. تواصل مع المدير';
          e.style.display='block';
          e.style.opacity='1';
          FBAUTH.signOut();
          console.error('User not in DB, uid:', fbUser.uid);
        }
      });
      return;
    }
    if(!userData.active){
      const splash=$('splash'); if(splash) splash.style.display='none';
      $('ls').style.display='flex';
      const e=$('lerr');
      e.textContent='⛔ حسابك معطّل، تواصل مع المدير';
      e.style.display='block';
      e.style.opacity='1';
      FBAUTH.signOut();
      console.error('User disabled:', fbUser.uid);
      return;
    }
    CU={...userData, uid:fbUser.uid, email:fbUser.email};
    const splash=$('splash'); if(splash) splash.style.display='none';
    $('lload').style.display='none';
    $('lerr').style.display='none';
    $('ls').style.display='none';
    $('app').style.display='flex';
    const av=$('sav');
    av.textContent=CU.name[0]; av.style.background=RC[CU.role]||'#58a6ff';
    $('snm').textContent=CU.name;
    $('srl').textContent=ROLES[CU.role]||CU.role; $('srl').style.color=RC[CU.role]||'#58a6ff';
    // تهيئة قاعدة البيانات إذا كانت فارغة (أول دخول)
    fbInitDB();
    // بدء المزامنة الفورية
    fbStartSync();
    // حماية: إذا بقي Splash ظاهراً أكثر من 10 ثوانٍ → خطأ في الاتصال
    setTimeout(()=>{
      const splash=$('splash');
      if(splash && splash.style.display!=='none'){
        splash.innerHTML=`
          <div class="sp-logo">⚠️</div>
          <div class="sp-txt" style="color:var(--rd)">انتهت مدة الانتظار</div>
          <div class="sp-sub">تحقق من اتصالك بالإنترنت</div>
          <button class="btn btn-rd" style="margin-top:16px" onclick="location.reload()">🔄 إعادة المحاولة</button>`;
      }
    }, 10000);
    // إظهار زر الويدجت العائم — يخفى عن دور المخابر
    const fab = document.getElementById('quick-fab');
    if(fab) fab.style.display=(CU&&CU.role==='signals')?'none':'block';
    // إظهار فقاعة الدردشة — تخفى عن دور المخابر
    if(!(CU&&CU.role==='signals')) showMsgBubble();
    else hideMsgBubble();
    // إخفاء البحث السريع وزر طباعة العاجلة عن دور المخابر
    const qsWrap = document.getElementById('qs-wrap');
    if(qsWrap) qsWrap.style.display=(CU&&CU.role==='signals')?'none':'';
    // طلب إذن الإشعارات — مرة واحدة فقط
    if(!localStorage.getItem('notif_perm_asked')){
      setTimeout(()=>{ requestNotifPermission(); localStorage.setItem('notif_perm_asked','1'); }, 2000);
    }
    // طلب إذن GPS — مرة واحدة فقط + تشغيل تلقائي للفنيين
    if(!localStorage.getItem('gps_perm_asked')){
      setTimeout(()=>{ requestGPSPermission(); localStorage.setItem('gps_perm_asked','1'); }, 4000);
    } else if((CU.role==='technician'||CU.role==='field') && _gpsWatcher===null){
      // إذا سبق منح الإذن، شغّل التتبع مباشرة بدون طلب
      setTimeout(()=>{
        if(navigator.geolocation) startGPSTracking();
      }, 2000);
    }

    // تحقق من الصيانة المتأخرة
    setTimeout(()=>{
      const today=new Date();
      const overdue=(DB.maintain||[]).filter(t=>!t.done&&new Date(t.dueDate)<today);
      if(overdue.length&&CU.role==='manager'){
        localNotif('🔔 تذكير صيانة','يوجد '+overdue.length+' مهمة صيانة متأخرة');
      }
    }, 3000);
  }).catch(err=>{
    doLogout();
    const e=$('lerr'); e.textContent='❌ خطأ: '+err.message; e.style.display='block';
  });
});

// ═══════════════════════════════════════════════════════
//  FIREBASE INIT — تهيئة البيانات الأولية
// ═══════════════════════════════════════════════════════
function fbInitDB(){
  FBDB.ref('cctv/sites').once('value').then(snap=>{
    if(!snap.exists()){
      // إنشاء المواقع الافتراضية مع ترتيب رقمي
      const mainSite = 'المستودع المركزي';
      fbSet('sites/000_main', mainSite);
      fbSet('sites/001_site', 'مستودع البصرة');
      fbSet('sites/002_site', 'مستودع الموصل');
      fbSet('mainSite', mainSite);
      fbSet('inv/'+fbKey(mainSite)+'/___init',{___init:true});
      fbSet('inv/'+fbKey('مستودع البصرة')+'/___init',{___init:true});
      fbSet('inv/'+fbKey('مستودع الموصل')+'/___init',{___init:true});
    }
  });
  // تحديث uid في بيانات المستخدم إذا كان ناقصاً
  if(CU && CU.uid){
    FBDB.ref('cctv/users/'+CU.uid+'/uid').once('value').then(s=>{
      if(!s.exists()) fbSet('users/'+CU.uid+'/uid', CU.uid);
    });
    FBDB.ref('cctv/users/'+CU.uid+'/email').once('value').then(s=>{
      if(!s.exists() && CU.email) fbSet('users/'+CU.uid+'/email', CU.email);
    });
  }
}

// ═══════════════════════════════════════════════════════
//  FIREBASE SYNC — مزامنة فورية مع قاعدة البيانات
// ═══════════════════════════════════════════════════════
// حماية من تكرار الـ listener
let _syncRef = null;
let _syncHandler = null;

function fbStartSync(){
  // إذا offline — حمّل البيانات المحلية
  if(!navigator.onLine){ loadLocalDB(); }

  // إلغاء أي listener سابق قبل إضافة جديد
  if(_syncRef && _syncHandler){
    _syncRef.off('value', _syncHandler);
    _syncRef = null; _syncHandler = null;
  }

  _syncRef = FBDB.ref('cctv');
  _syncHandler = _syncRef.on('value', snap=>{
    const data=snap.val()||{};

    // sites
    // sites مخزنة كـ {key: name} — Firebase يرتبها أبجدياً بالـ key
    const mainSiteName = data.mainSite || 'المستودع المركزي';
    if(data.sites){
      const raw = data.sites;
      if(Array.isArray(raw)){
        DB.sites = raw.filter(s=>typeof s==='string');
      } else {
        // ترتيب حسب الـ key لضمان الرئيسي أولاً (000_main يجي قبل أي رقم آخر)
        const sortedEntries = Object.entries(raw)
          .sort((a,b)=>a[0].localeCompare(b[0]))
          .filter(([k,v])=>typeof v==='string');
        DB.sites = sortedEntries.map(([k,v])=>v);
        window._sitesKeys = {}; // {siteName: firebaseKey}
        sortedEntries.forEach(([k,v])=>{ window._sitesKeys[v]=k; });
      }
    } else {
      DB.sites = [mainSiteName];
    }
    // ضمان أن الرئيسي أول دائماً
    if(!DB.sites.length) DB.sites = [mainSiteName];
    if(DB.sites[0] !== mainSiteName){
      DB.sites = [mainSiteName, ...DB.sites.filter(s=>s!==mainSiteName)];
    }
    DB.mainSite = data.mainSite || DB.sites[0];

    // inventory
    DB.inv={};
    DB.sites.forEach(s=>DB.inv[s]=[]);
    if(data.inv){
      Object.entries(data.inv).forEach(([k,items])=>{
        const siteName=decodeURIComponent(k.replace(/_dot_/g,'.').replace(/_sl_/g,'/'));
        if(!DB.inv[siteName]) DB.inv[siteName]=[];
        Object.values(items).forEach(item=>{ if(!item.___init) DB.inv[siteName].push(item); });
      });
    }

    // collections
    DB.moves       = data.moves       ? Object.values(data.moves).sort((a,b)=>(b._ts||0)-(a._ts||0)) : [];
    DB.faults      = data.faults      ? Object.values(data.faults) : [];
    // فلترة الإشعارات حسب صلاحيات المستخدم ومواقعه
    const allNotifs = data.notifs ? Object.values(data.notifs).sort((a,b)=>(b._ts||0)-(a._ts||0)) : [];
    const myUid = CU?.uid||CU?.id;
    const myAllowedSites = CU?.perms?.allowedSites||[];
    DB.notifs = allNotifs.filter(n=>{
      // المدير والسيد يريان كل الإشعارات
      if(!CU || CU.role==='manager' || CU.role==='viewer') return true;
      // إشعار موجّه لمستخدم محدد
      if(n.targetUid) return n.targetUid===myUid;
      // إشعار مرتبط بموقع ميداني
      if(n.fieldSiteId){
        // إذا كان للمستخدم مواقع محددة، تحقق منها
        if(myAllowedSites.length) return myAllowedSites.includes(n.fieldSiteId);
        // إذا لم تحدد مواقع، تحقق من allowedUsers
        if(n.allowedUsers) return n.allowedUsers.includes(myUid)||n.allowedUsers.includes('all');
        return false;
      }
      // إشعار عام
      if(!n.allowedUsers) return true;
      if(n.allowedUsers.includes('all')) return true;
      if(n.allowedUsers.includes('manager_only')) return false;
      return n.allowedUsers.includes(myUid);
    });
    DB.invoices    = data.invoices    ? Object.values(data.invoices) : [];
    DB.customTypes = data.customTypes || {};
    DB.fieldSites  = data.fieldSites
      ? Object.values(data.fieldSites).map(fs=>({...fs, cameras:fs.cameras?Object.values(fs.cameras):[]}))
      : [];
    DB.users       = data.users       ? Object.values(data.users) : [];
    DB.actlog      = data.actlog      ? Object.values(data.actlog).sort((a,b)=>(b._ts||0)-(a._ts||0)) : [];
    DB.maintain    = data.maintain    ? Object.values(data.maintain).sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate)) : [];
    DB.tasks       = data.tasks       ? Object.values(data.tasks).sort((a,b)=>(b._ts||0)-(a._ts||0)) : [];
    DB.siteInventory = data.siteInventory || {};
    DB.radioDevices = data.radioDevices ? Object.values(data.radioDevices).sort(function(a,b){return (b._ts||0)-(a._ts||0);}) : [];
    DB.uavDevices = data.uavDevices ? Object.values(data.uavDevices).sort(function(a,b){return (b._ts||0)-(a._ts||0);}) : [];
    DB.pwVault = data.pwVault ? Object.values(data.pwVault).sort(function(a,b){return (b._ts||0)-(a._ts||0);}) : [];
    DB.faultTemplates = data.faultTemplates || [];
    // تحميل روابط المستودعات الأب
    if(data.siteParents){
      window._siteParents = data.siteParents
        ? Object.fromEntries(Object.entries(data.siteParents).map(([k,v])=>[decodeURIComponent(k.replace(/_dot_/g,'.').replace(/_sl_/g,'/')),v]))
        : {};
    }
    // تحديث صفحة المهام إذا كانت مفتوحة
    if(PAGE==='tasks') pgTasks();

    // تحديث المستخدم الحالي إذا تغيرت بياناته
    if(CU && data.users && data.users[CU.uid]){
      const updated=data.users[CU.uid];
      if(!updated.active){ doLogout(); return; }
      CU={...CU,...updated};
    }

    if(!ISITE||!DB.sites.includes(ISITE)) ISITE=DB.sites[0]||'';
    try{ buildNav(); checkAutoRefresh(); autoBackupCheck(); monthlyReportAutoCheck(); cacheLocalDB(data); }catch(e){}

    // إخفاء Splash فوراً عند أول تحميل للبيانات
    const splash=$('splash');
    if(splash && splash.style.display!=='none') splash.style.display='none';

    // تحميل الصفحة فقط إذا كانت هذه أول مزامنة أو إذا لا توجد صفحة مفتوحة
    if(!PAGE || !window._firstSyncDone) {
      window._firstSyncDone = true;
      try{ go(PAGE||'dashboard'); }catch(e){}
    } else {
      // تحديث فقط الأجزاء الديناميكية بدون إعادة رسم الصفحة كاملة
      try{ buildNav(); }catch(e){}
      // إذا كانت الصفحة المفتوحة تعرض بيانات متغيرة — حدّثها
      const dynamicPages = ['dashboard','faults','notifs','urgent','actlog','tasks','techmap'];
      if(dynamicPages.includes(PAGE)) try{ go(PAGE); }catch(e){}
    }
  }, err=>{
    console.error('Firebase sync error:', err);
    // إظهار خطأ على Splash إذا كانت لا تزال ظاهرة
    const splash=$('splash');
    if(splash && splash.style.display!=='none'){
      splash.innerHTML=`<div class="sp-logo">⚠️</div><div class="sp-txt" style="color:var(--rd)">فشل الاتصال بقاعدة البيانات</div><div class="sp-sub">${err.message||err.code||''}</div><button class="btn btn-rd" style="margin-top:16px" onclick="location.reload()">🔄 إعادة المحاولة</button>`;
    } else {
      toast('❌ خطأ في الاتصال بقاعدة البيانات','err');
    }
  });

  // ── Listener دائم لمواقع الفنيين — يعمل طالما التطبيق مفتوح ──
  FBDB.ref('cctv/techLocations').on('value', snap=>{
    DB.techLocations = snap.val() || {};
    // تحديث صفحة مواقع الفنيين إذا كانت مفتوحة
    if(PAGE==='techmap'){
      const el = document.getElementById('tech-locations');
      if(el) renderTechLocations(DB.techLocations);
    }
  });
  FBDB.ref('cctv/notifs').limitToLast(100).on('value', snap=>{
    if(!snap.exists()) return;
    const myUid = CU?.uid||CU?.id;
    const allNotifs = Object.values(snap.val()||{}).sort((a,b)=>(b._ts||0)-(a._ts||0));
    DB.notifs = allNotifs.filter(n=>{
      if(!CU || CU.role==='manager' || CU.role==='viewer') return true;
      if(!n.allowedUsers) return true;
      if(n.allowedUsers.includes('all')) return true;
      if(n.allowedUsers.includes('manager_only')) return false;
      return n.allowedUsers.includes(myUid);
    });
    // تحديث badge الإشعارات في الـ nav
    const unread = DB.notifs.filter(n=>!n.read).length;
    const nBtn = document.querySelector('.nb[onclick*="notifs"]');
    if(nBtn) nBtn.innerHTML = `<span class="ic">🔔</span>الإشعارات${unread?` (${unread})`:''}`;
    if(PAGE==='notifs') pgNotifs();
  });

  // ── Listener منفصل لسجل النشاط — آخر 200 فقط من Firebase ──
  FBDB.ref('cctv/actlog').limitToLast(200).on('value', snap=>{
    if(!snap.exists()) return;
    DB.actlog = Object.values(snap.val()||{}).sort((a,b)=>(b._ts||0)-(a._ts||0));
    if(PAGE==='actlog') pgActLog();
  });
}

function buildNav(){

  const NAV_GROUPS = [
    // ── الرئيسية (دائماً ظاهرة) ──
    { group: null, items: [
      {id:'dashboard', label:'لوحة التحكم',     icon:'📊', perm:null},
      {id:'faults',    label:'الأعطال',          icon:'⚠️', perm:'faults'},
      {id:'urgent',    label:'الأعطال العاجلة', icon:'⚡', perm:'faults'},
      {id:'notifs',    label:'الإشعارات'+(unread?` (${unread})`:''), icon:'🔔', perm:'notifs'},
      {id:'search',    label:'بحث شامل',         icon:'🔍', perm:'inv'},
    ]},
    // ── المخزن والمواد ──
    { group: '📦 المخزن', items: [
      {id:'inventory', label:'المخزن',           icon:'🏪', perm:'inv'},
      {id:'movements', label:'حركة المواد',      icon:'🔄', perm:'moves'},
      {id:'barcode',   label:'باركود',           icon:'📱', perm:'inv'},
      {id:'invoices',  label:'الفواتير',         icon:'🧾', perm:'invoices'},
      {id:'types',     label:'أنواع المواد',     icon:'🗂️', perm:'types'},
    ]},
    // ── المواقع ──
    { group: '📍 المواقع', items: [
      {id:'sites',     label:'المواقع والمخازن', icon:'📍', perm:'sites'},
      {id:'fieldmap',  label:'الميدانية',        icon:'🗺️', perm:'fieldmap'},
    ]},
    // ── الإدارة ──
    { group: '⚙️ الإدارة', items: [
      {id:'users',     label:'المستخدمون',       icon:'👥', perm:'users'},
      {id:'maintain',  label:'جدول الصيانة',    icon:'🗓️', perm:'faults'},
      {id:'reports',   label:'التقارير',         icon:'📊', perm:'faults'},
      {id:'actlog',    label:'سجل النشاط',      icon:'📋', perm:'users'},
    ]},
  ];

  const NAV = NAV_GROUPS.flatMap(g=>g.items).filter(x=>x.perm===null ? true : p(x.perm));

  // بناء القائمة مع المجموعات
  let navHTML = '';
  NAV_GROUPS.forEach(g=>{
    const visible = g.items.filter(x=>x.perm===null ? true : p(x.perm));
    if(!visible.length) return;
    if(g.group) navHTML += `<span style="color:var(--br);margin:0 2px">|</span>`;
    navHTML += visible.map(x=>`<button class="nb${PAGE===x.id?' act':''}${!g.group?' main':''}" onclick="go('${x.id}')">`+
      `<span class="ic">${x.icon}</span>${x.label}</button>`).join('');
  });

  // القائمة أصبحت في openAppMenu()
}

function go(page){
  PAGE=page; buildNav();
  // إلغاء listener خريطة الفنيين عند مغادرة الصفحة
  if(page!=='techmap' && window._techMapRef){
    window._techMapRef.off();
    window._techMapRef = null;
  }
  // إظهار skeleton أثناء تحميل الصفحة
  $('page').innerHTML=`
    <div style="padding:16px;animation:fadeIn .3s">
      <div style="height:32px;width:40%;background:var(--br);border-radius:8px;margin-bottom:16px;animation:skPulse 1.2s infinite"></div>
      <div style="height:80px;background:var(--br);border-radius:10px;margin-bottom:12px;animation:skPulse 1.2s infinite .1s"></div>
      <div style="height:80px;background:var(--br);border-radius:10px;margin-bottom:12px;animation:skPulse 1.2s infinite .2s"></div>
      <div style="height:80px;background:var(--br);border-radius:10px;animation:skPulse 1.2s infinite .3s"></div>
    </div>`;
  // تحميل الصفحة في الـ frame التالي لإظهار الـ skeleton أولاً
  requestAnimationFrame(()=>{
    ({dashboard:pgDash,inventory:pgInv,movements:pgMoves,faults:pgFaults,
      notifs:pgNotifs,users:pgUsers,invoices:pgInvoices,types:pgTypes,sites:pgSites,fieldmap:pgFieldMap,
      search:pgSearch,urgent:pgUrgent,actlog:pgActLog,reports:pgReports,maintain:pgMaintain,barcode:pgBarcode,
      performance:pgPerformance,backup:()=>openBackupManager(),techmap:pgTechMap,handovers:pgHandovers,
      branding:()=>openBrandSettings(),chat:pgChat,docs:pgDocs,siteinv:pgSiteInventory,tasks:pgTasks,radio:pgRadio,uav:pgUAV,pwvault:pgPwVault,monthlyreports:()=>openMonthlyReportsArchive()})[page]?.();
  });
}

function qUpdFault(fid, status){
  const f=DB.faults.find(x=>x.id===fid);

  pgDash();
}

  ${isMain?`<div style="background:#58a6ff11;border:1px solid #58a6ff33;border-radius:9px;padding:10px 14px;margin-bottom:14px;font-size:17px;color:var(--bl)">

  <div class="fr">

    <select onchange="ITYP=this.value;filterInvTable()">

function renderInvRows(isMain,allItems,items,AT){
  const isMainV=isMain;
  let showItems=isMainV
    ? allItems.filter(item=>{
        const q=(ISQ||'').toLowerCase();
        const ok=!q||[item.name,item.serial,item.model,item.mfr].some(v=>v?.toLowerCase().includes(q));
        const sf=window.ISTS_SITE||'';
        return ok&&(!ITYP||item.type===ITYP)&&(!ISTS||item.status===ISTS)&&(!sf||item.currentSite===sf);
      })
    : items;

  if(!showItems.length) return `<tr class="erow"><td colspan="10">لا توجد عناصر مطابقة</td></tr>`;

  // ── فصل المواد: في المخزن (عادي) + منصوبة (مطوية حسب الموقع) ──
  const warehouseItems = showItems.filter(i=>i.status==='warehouse'||i.status==='maintenance'||i.status==='returned');
  const deployedItems  = showItems.filter(i=>i.status==='deployed'||i.status==='consumed');

  // ── المواد المنصوبة — مجمّعة حسب الموقع الميداني (fieldSiteId) ──
  const deployedGroups = {};
  deployedItems.forEach(item=>{
    // استخدم اسم الموقع الميداني إذا كان مرتبطاً، وإلا currentSite
    const fsId = item.fieldSiteId;
    const fs   = fsId && DB.fieldSites.find(s=>s.id===fsId);
    const loc  = fs ? fs.name : (item.currentSite || 'غير محدد');
    if(!deployedGroups[loc]) deployedGroups[loc]=[];
    deployedGroups[loc].push(item);
  });

  function itemRow(item){
    const realSite=item.currentSite||ISITE;
    const realIdx=(DB.inv[realSite]||[]).indexOf(item);
    return `<tr
      data-name="${esc(item.name||item.serial||'')}"
      data-serial="${esc(item.serial||'')}"
      data-model="${esc(item.model||'')}"
      data-mfr="${esc(item.mfr||'')}"
      data-type="${esc(item.type||'')}"
      data-status="${esc(item.status||'')}">
      <td style="white-space:nowrap">
        <span style="font-size:17px">${AT[item.type]?.icon||'🔧'}</span>
        <span style="font-size:11px;color:var(--mt);margin-right:5px">${AT[item.type]?.label||item.type}</span>
      </td>
      <td><div class="tm">${esc(item.name||item.serial||'—')}</div>
        ${item.name&&item.serial?`<div class="ts">${esc(item.serial)}</div>`:''}</td>
      <td><div>${esc(item.model||'—')}</div><div class="ts">${esc(item.mfr||'')}</div></td>
      <td style="text-align:center;font-weight:700;color:${(parseInt(item.qty)||1)>1?'var(--bl)':'var(--mt)'}">${parseInt(item.qty)||1}</td>
      <td style="font-size:12px;color:var(--mt);max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(itemDet(item))}</td>
      <td>${badge(item.status)}</td>
      ${isMainV?`<td><span style="font-size:11px;color:var(--mt)">${esc(realSite)}</span></td>`:''}
      <td style="font-size:12px;color:var(--mt)">${esc(item.addedBy||'')}</td>
      ${p('addItem')?`<td><div style="display:flex;gap:4px;flex-wrap:nowrap">
        ${!isMainV?`<button class="btn btn-sm ${item.status==='warehouse'?'btn-bl':'btn-gn'}" onclick="openMoveItem(${realIdx},'${realSite}')">
          ${item.status==='warehouse'?'↑ صرف':'↓ إيداع'}</button>`:''}
        ${!isMainV&&item.status==='warehouse'?`<button class="btn btn-sm btn-pu" title="ترحيل" onclick="openTransferItem(${realIdx},'${realSite}')">🔁</button>`:''}
        <button class="btn btn-sm btn-gy" onclick="openEditItemAt(${realIdx},'${realSite}')">✏️</button>
        ${item.serial?`<button class="btn btn-sm" style="background:#8957e522;color:#8957e5" onclick="openItemTimeline('${esc(item.serial)}')" title="السجل الكامل">📜</button>`:''}
        ${item.status!=='maintenance'?`<button class="btn btn-sm btn-yl" onclick="setMaintAt(${realIdx},'${realSite}')">🔧</button>`:''}
        <button class="btn btn-sm btn-rd" onclick="delItemAt(${realIdx},'${realSite}')">🗑</button>
      </div></td>`:''}
    </tr>`;
  }

  let html = '';
  const colspan = isMainV ? 8 : 7;

  // ── المواد في المخزن — مطوية ──
  if(warehouseItems.length){
    html += '<tr id="wh-hdr" onclick="toggleDepGroup(\'wh\')" style="cursor:pointer;background:#f0f4ff"><td colspan="'+(colspan+1)+'" style="padding:10px 14px"><div style="display:flex;align-items:center;gap:10px"><span id="wh-arr" style="font-size:15px;transition:transform .2s;color:var(--mt)">&#x25B6;</span><span style="font-weight:700">&#x1F4E6; المواد في المخزن</span><span style="font-size:12px;color:var(--mt);margin-right:8px">'+warehouseItems.length+' عنصر</span></div></td></tr>';
    html += '<tr id="wh-body" style="display:none"><td colspan="'+(colspan+1)+'" style="padding:0"><table style="width:100%;border-collapse:collapse">'+warehouseItems.map(itemRow).join('')+'</table></td></tr>';
  }

  // ── المواد المنصوبة — مطوية حسب الموقع ──
  if(deployedItems.length){
    const colspan = isMainV ? 9 : 8;
    // فاصل
    html += `<tr><td colspan="${colspan+1}" style="padding:0">
      <div style="margin:6px 0;border-top:2px dashed var(--br)"></div>
    </td></tr>`;

    Object.entries(deployedGroups).forEach(([loc, locItems], gi)=>{
      const gid = 'dep-grp-'+gi;
      const working = locItems.filter(i=>i.status==='deployed').length;
      const byType  = {};
      locItems.forEach(i=>{ const t=AT[i.type]?.label||'أخرى'; byType[t]=(byType[t]||0)+1; });
      const typeSummary = Object.entries(byType).map(([t,n])=>`${n} ${t}`).join(' | ');

      html += `<tr id="${gid}-hdr" onclick="toggleDepGroup('${gid}')" style="cursor:pointer;background:#f0f7ff">
        <td colspan="${colspan+1}" style="padding:10px 14px">
          <div style="display:flex;align-items:center;gap:10px">
            <span id="${gid}-arr" style="font-size:15px;transition:transform .2s;color:var(--mt)">▶</span>
            <div>
              <span style="font-weight:700;font-size:14px">📍 ${esc(loc)}</span>
              <span style="font-size:12px;color:var(--mt);margin-right:8px">${locItems.length} عنصر</span>
              <span style="font-size:11px;color:var(--mt)">${typeSummary}</span>
            </div>
            <span style="font-size:11px;background:#1a7f3722;color:var(--gn);padding:2px 8px;border-radius:10px;margin-right:auto">منصوب</span>
          </div>
        </td>
      </tr>
      <tr id="${gid}-body" style="display:none"><td colspan="${colspan+1}" style="padding:0">
        <table style="width:100%;border-collapse:collapse;background:var(--bg)">
          ${locItems.map(itemRow).join('')}
        </table>
      </td></tr>`;
    });
  }

  return html;
}

function toggleDepGroup(gid){
  const body = document.getElementById(gid+'-body');
  const arr  = document.getElementById(gid+'-arr');
  if(!body) return;
  const open = body.style.display !== 'none';
  body.style.display = open ? 'none' : 'table-row';
  if(arr) arr.style.transform = open ? '' : 'rotate(90deg)';
}

function itemDet(i){
  if(i.type==='camera')    return `${i.cT||''} | ${i.ln||1} عدسة | ${i.an||''}°${i.rs?' | '+i.rs:''}`;
  if(i.type==='nvr')       return `${i.ch||''} قناة${i.st?' | '+i.st:''}${i.ip?' | '+i.ip:''}`;
  if(i.type==='switch_dev')return `${i.po||''} بورت | ${i.sw||''}${i.poe?' | POE':''}${i.sp?' | '+i.sp:''}`;
  if(i.type==='wireless')  return `${i.fq||''} | ${i.pr||''} | مدى:${i.rg||''} | TX:${i.tx||''}`;
  if(i.type==='cable_f')   return `${i.le||''} ${i.un||'متر'}${i.ft?' | '+i.ft:''} | ${i.rl||1} لفة`;
  if(i.type==='cable_c')   return `${i.le||''} ${i.un||'متر'}${i.ca?' | '+i.ca:''} | ${i.rl||1} لفة`;
  if(i.type==='sfp')       return `${i.sT||''}${i.sp?' | '+i.sp:''}${i.rg?' | '+i.rg:''}`;
  if(i.type==='tower')     return `ارتفاع:${i.ht||''}م${i.tt?' | '+i.tt:''}`;
  if(i.type==='converter') return `${i.vi||''} → ${i.vo||''}${i.am?' '+i.am+'A':''}`;
  return i.dc||'';
}

function openAddItem(){ _ei=-1; _es=isMainSite(ISITE)?DB.mainSite:ISITE; _eit=null; showItemForm(null); }
function openEditItem(i){ _ei=i; _es=ISITE; _eit=DB.inv[ISITE][i]; showItemForm(_eit); }
function openEditItemAt(i,site){ _ei=i; _es=site; _eit=DB.inv[site][i]; showItemForm(_eit); }

function openMoveItem(i,site){
  const s=site||ISITE;
  const item=DB.inv[s][i];
  const isOut=item.status==='warehouse'||item.status==='returned';
  const dests=DB.sites.filter(x=>x!==s);
  // عند الصرف (نصب في الميدان)، نضيف أيضاً المواقع الميدانية كخيارات وجهة —
  // يُميَّز الموقع الميداني بالبادئة "field:" بقيمة الـ option حتى تُعالَج بشكل مختلف
  // عن النقل بين مستودعات (نفس مفهوم الحقيقة الأساسي: المخزون في مستودعات فقط،
  // لكن التنصيب الفعلي يكون بموقع ميداني)
  const fieldDests = isOut ? (DB.fieldSites||[]).filter(function(fs){return fs.warehouse===s || !fs.warehouse;}) : [];
  openModal(`${mhd(isOut?'🔼 صرف / نصب من المخزن':'🔽 إيداع / إعادة للمخزن')}
  <div style="background:var(--bg);border-radius:8px;padding:12px;margin-bottom:16px">
    <div style="font-weight:700">${allT()[item.type]?.icon||''} ${esc(item.name||item.serial||'—')}</div>
    <div style="font-size:12px;color:var(--mt);margin-top:4px">${esc([item.serial,item.model,item.mfr].filter(Boolean).join(' | '))}</div>
    <div style="margin-top:8px">${badge(item.status)}</div>
  </div>
  ${(parseInt(item.qty)||1)>1?`<div class="field"><label>الكمية ${isOut?'المصروفة':'المُعادة'} <span style="color:var(--rd)">*</span></label>
    <input id="mv-qty" type="number" min="1" max="${item.qty}" value="${item.qty}">
    <div style="font-size:11px;color:var(--mt);margin-top:4px">الكمية الكلية المتوفرة: <b>${item.qty}</b> — أدخل عدداً أقل لصرف جزء فقط</div>
  </div>`:''}
  <div class="field"><label>الحالة الجديدة</label>
    <select id="mv-status">
      ${isOut
        ? `<option value="deployed">✅ منصوب في موقع</option>
           <option value="consumed">🔘 مصروف (استهلاكي)</option>`
        : `<option value="warehouse">📦 راجع للمخزن</option>
           <option value="returned">↩️ راجع بعطل/تلف</option>`}
    </select>
  </div>
  <div class="field"><label>${isOut?'الموقع الوجهة / اسم النقطة المنصوب بها':'المستودع الوجهة'}</label>
    <select id="mds">
      ${fieldDests.length?`<optgroup label="📍 مواقع ميدانية (تنصيب فعلي)">
        ${fieldDests.map(fs=>`<option value="field:${fs.id}:${esc(fs.name)}">📍 ${esc(fs.name)}</option>`).join('')}
      </optgroup>`:''}
      <optgroup label="🏭 مستودعات (نقل مخزني)">
        ${dests.map(d=>`<option value="${esc(d)}">${isMainSite(d)?'🏭 ':'🏪 '}${esc(d)}</option>`).join('')}
      </optgroup>
    </select></div>

function confirmReturnToWarehouse(){
  var p=window._retPending||{};
  var siteId=p.siteId,warehouse=p.warehouse,ptId=p.ptId,itemId=p.itemId,itemName=p.itemName||'';
  var reason=val('ret-reason')||'';
  var notes=val('ret-notes')||'';
  if(!siteId){toast('خطأ: بيانات ناقصة','err');return;}
  FBDB.ref('cctv/siteInventory/'+siteId+'/'+ptId+'/items/'+itemId).once('value').then(function(snap){
    var it=snap.val();
    if(!it){
      FBDB.ref('cctv/siteInventory/'+siteId+'/'+ptId+'/'+itemId).once('value').then(function(snap2){
        doReturn(siteId,warehouse,ptId,itemId,snap2.val()||{name:itemName},reason,notes,'cctv/siteInventory/'+siteId+'/'+ptId+'/'+itemId);
      });
    } else {
      doReturn(siteId,warehouse,ptId,itemId,it,reason,notes,'cctv/siteInventory/'+siteId+'/'+ptId+'/items/'+itemId);
    }
  });
}

function doReturn(siteId,warehouse,ptId,itemId,it,reason,notes,fbPath){
  // 1. حذف من siteInventory
  FBDB.ref(fbPath).remove();
  // 2. إضافة للمخزن
  var newId='ret_'+Date.now()+'_'+Math.random().toString(36).slice(2,5);
  var site=DB.fieldSites.find(function(s){return s.id===siteId;})||{};
  fbSet('inv/'+fbKey(warehouse)+'/'+newId, {
    id: newId,
    name: it.name||'',
    type: it.type||'',
    serial: it.serial||'',
    model: it.model||'',
    mfr: it.mfr||'',
    qty: parseInt(it.qty)||1,
    status: 'returned',
    notes: (notes?notes+' — ':'')+reason,
    addedBy: CU.name,
    addedAt: ts(),
    returnedFrom: (site.name||siteId),
    returnedAt: ts(),
    _ts: Date.now()
  });
  // 3. تسجيل في حركات المواد
  fbPush('moves',{
    name: '↩️ '+(it.name||itemId),
    dir: 'in',
    from: (site.name||siteId),
    to: warehouse,
    by: CU.name,
    date: ts(),
    notes: reason+(notes?' — '+notes:''),
    status: 'returned',
    returnReason: reason,
    _ts: Date.now()
  });
  // 4. إشعار
  pushN('↩️ إرجاع للمخزن: '+(it.name||itemId)+' من '+(site.name||siteId)+' → '+warehouse);
  closeModal();
  toast('✅ تم إرجاع المادة إلى مستودع '+warehouse);
  // إعادة تحميل الصفحة
  setTimeout(function(){pgSiteInventory();},500);
}

function confirmMove(i,src,isOut){
  const originalItem=DB.inv[src][i], destRaw=val('mds'), notes=val('mnt');
  const newStatus = val('mv-status') || (isOut?'deployed':'warehouse');
  const installPoint = val('mv-point')||'';
  const receiver = isOut?(val('mv-receiver')||''):'';
  const sender = isOut?CU.name:'';
  if(!originalItem){ closeModal(); return; }
  if(isOut && !receiver){ toast('يرجى إدخال اسم المستلم','err'); return; }

  // ── التعامل مع الكمية الجزئية ──
  // لو المادة عندها qty>1 وأُدخلت كمية أقل من الإجمالي، نقسّمها:
  // الأصل بالمخزن يُخصَم منه العدد المصروف فقط ويبقى موجوداً،
  // ونسخة منفصلة (بنفس بيانات المادة) بالكمية المصروفة فقط تذهب للوجهة.
  const totalQty = parseInt(originalItem.qty)||1;
  const qtyInput = document.getElementById('mv-qty');
  const movedQty = qtyInput ? Math.min(Math.max(1, parseInt(qtyInput.value)||1), totalQty) : totalQty;
  const isPartial = movedQty < totalQty;

  let item = originalItem;
  if(isPartial){
    // ننقص الكمية من العنصر الأصلي ونبقيه بالمخزن كما هو (بدون حذفه)
    fbSet('inv/'+fbKey(src)+'/'+originalItem.id, {...originalItem, qty: totalQty-movedQty});
    // ننشئ "نسخة منطقية" بمعرّف جديد بنفس بيانات المادة، بالكمية المصروفة فقط،
    // وهذه هي التي تُصرف/تُنقل عبر بقية الكود أدناه بدل الأصل
    item = {...originalItem, id: gid(), qty: movedQty};
  }

  const icon = allT()[item.type]?.icon||'';

  // ── الصرف لموقع ميداني فعلي (وليس نقل بين مستودعات) ──
  // القيمة تكون بصيغة "field:الآيدي:الاسم" — نميّزها ونتعامل معها بشكل مختلف
  // لأن DB.inv مُنظّمة حصراً بمفاتيح المستودعات، والمواقع الميدانية ليست مستودعات
  if(isOut && destRaw.startsWith('field:')){
    const parts = destRaw.split(':');
    const fsId = parts[1];
    const fsName = parts.slice(2).join(':'); // احتياطاً لو الاسم نفسه فيه ':'
    fbPush('moves',{
      name:icon+' '+(item.name||item.serial||''),
      dir:'out', from:src, to:fsName,
      by:CU.name, date:ts(), notes,
      status:newStatus, point:installPoint,
      receiver: receiver, sender: sender,
      isFieldSite: true,
      _ts:Date.now()
    });
    // تُحذف من مخزن المستودع نهائياً فقط لو كان صرفاً كاملاً (وليس جزئياً)
    // — في حالة التقسيم الجزئي، الأصل بقي بمخزنه بكمية مخصومة أعلاه، ولا يوجد شيء لحذفه هنا
    if(!isPartial){
      fbDel('inv/'+fbKey(src)+'/'+item.id);
    }

    // ── 🔗 الربط العكسي: تسجيل المادة فعلياً بالموقع الميداني ──
    // بدون هذا، المادة "تختفي" من المخزن دون أن تظهر بأي مكان بالموقع الميداني
    if(item.type==='camera'){
      // كاميرا → تُضاف مباشرة لقائمة كاميرات الموقع (بانتظار إحداثيات دقيقة من الفني لاحقاً)
      const fs = DB.fieldSites.find(function(x){return x.id===fsId;});
      if(fs){
        const camId = gid();
        const centerLat = fs.cameras&&fs.cameras.length ? fs.cameras[0].lat : (fs.lat||'');
        const centerLng = fs.cameras&&fs.cameras.length ? fs.cameras[0].lng : (fs.lng||'');
        fbSet('fieldSites/'+fsId+'/cameras/'+camId, {
          id:camId, name:item.name||item.serial||'كاميرا جديدة', serial:item.serial||'',
          model:item.model||'', mfr:item.mfr||'',
          installDesc:installPoint||'', status:'active',
          lat: centerLat, lng: centerLng, // إحداثيات مبدئية تقريبية — الفني يعدّلها لاحقاً من الخريطة
          addedBy:CU.name, addedAt:ts(), _ts:Date.now(),
          fromWarehouse: true // علامة تدل أنها أُضيفت تلقائياً من الصرف، ولم تُضبط إحداثياتها الدقيقة بعد
        });
      }
    } else {
      // أي معدة أخرى → تُسجَّل بجرد الموجودات الثابتة للموقع، بنقطة "من المخزن"
      const ptId = 'from_warehouse_'+fsId;
      const itemId = gid();
      const AT = allT();
      const typeLbl = AT[item.type]?AT[item.type].label:(item.type||'');
      FBDB.ref('cctv/siteInventory/'+fsId+'/'+ptId).once('value').then(function(snap){
        const existing = snap.val();
        const items = (existing&&existing.items) ? existing.items : {};
        items[itemId] = {
          id:itemId, name:(typeLbl?typeLbl+' — ':'')+(item.name||item.serial||''),
          qty:parseInt(item.qty)||1, serial:item.serial||'',
          status:newStatus, notes:'صُرفت من مخزن '+src, date:ts()
        };
        fbSet('siteInventory/'+fsId+'/'+ptId, {
          id:ptId, name:'📦 من المخزن',
          items: items, addedBy:CU.name, addedAt: (existing&&existing.addedAt)||ts()
        });
      });
    }

    pushN('🔼 صرف — منصوب في موقع ميداني — '+(item.name||item.serial)+' → 📍 '+fsName);
    closeModal(); toast('✅ تم الصرف لموقع '+fsName);
    return;
  }

  // ── النقل بين مستودعات (يدعم الآن الكمية الجزئية أيضاً) ──
  const dest = destRaw;
  fbPush('moves',{
    name:icon+' '+(item.name||item.serial||'')+(isPartial?' (كمية: '+movedQty+')':''),
    dir:isOut?'out':'in', from:src, to:dest,
    by:CU.name, date:ts(), notes,
    status:newStatus, point:installPoint,
    receiver: receiver, sender: sender,
    _ts:Date.now()
  });
  if(isOut){
    // نحذف الأصل من المصدر فقط لو كان نقلاً كاملاً — التقسيم الجزئي تكفّل به الخصم بالأعلى
    if(!isPartial){ fbDel('inv/'+fbKey(src)+'/'+item.id); }
    fbSet('inv/'+fbKey(dest)+'/'+item.id,{
      ...item, status:newStatus, currentSite:dest,
      installedAt:installPoint||dest, movedAt:ts()
    });
  } else {
    fbSet('inv/'+fbKey(src)+'/'+item.id,{
      ...item, status:newStatus, currentSite:src,
      installedAt:'', returnedAt:ts()
    });
  }
  const statusLabel = {deployed:'منصوب',consumed:'مصروف',warehouse:'في المخزن',returned:'راجع'}[newStatus]||newStatus;
  pushN((isOut?'🔼 صرف':'🔽 إيداع')+' — '+statusLabel+' — '+(item.name||item.serial)+(isPartial?' (كمية: '+movedQty+')':'')+' → '+dest);
  closeModal(); toast(isOut?'✅ تم الصرف':'✅ تم الإيداع');
}

  if(!originalItem){ closeModal(); return; }

  const qtyInput = document.getElementById('tr-qty');

  const isPartial = movedQty < totalQty;

  let item = originalItem;

function saveItem(){
  const t=val('fty'), nm=val('fnm'), sr=val('fsr');
  if(!nm&&!sr){ toast('أدخل الاسم أو السيريال','err'); return; }
  const prev=_eit||{};
  const newStatus = val('fst-status')||prev.status||'warehouse';
  const installedAt = val('finstalled')||prev.installedAt||'';
  const item={id:prev.id||gid(),type:t,name:nm,serial:sr,qty:parseInt(val('fqty'))||1,
    model:val('fmd'),mfr:val('fmf'),
    status:newStatus,installedAt,
    addedBy:CU.name,addedAt:prev.addedAt||ts(),currentSite:_es,_ts:Date.now()};
  if(t==='camera')    Object.assign(item,{cT:val('fcT'),rs:val('frs'),ln:val('fln'),an:val('fan'),dc:val('fdc'),lat:val('flat'),lng:val('flng'),dir:val('fdir')||'⊙ عام'});
  if(t==='nvr')       Object.assign(item,{ch:val('fch'),st:val('fst'),ip:val('fip'),fw:val('ffw')});
  if(t==='switch_dev')Object.assign(item,{po:val('fpo'),sw:val('fsw'),sp:val('fsp'),ip:val('fip'),poe:chk('fpoe')});
  if(t==='wireless')  Object.assign(item,{fq:val('ffq'),pr:val('fpr'),rg:val('frg'),tx:val('ftx'),th:val('fth'),ip:val('fip'),dc:val('fdc')});
  if(t==='tower')     Object.assign(item,{ht:val('fht'),tt:val('ftt'),gp:val('fgp')});
  if(t==='cable_f')   Object.assign(item,{le:val('fle'),un:val('fun'),rl:val('frl'),ft:val('fft')});
  if(t==='cable_c')   Object.assign(item,{le:val('fle'),un:val('fun'),rl:val('frl'),ca:val('fca')});
  if(t==='sfp')       Object.assign(item,{sT:val('fsT'),sp:val('fsp'),rg:val('frg'),wl:val('fwl')});
  if(t==='converter') Object.assign(item,{vi:val('fvi'),vo:val('fvo'),am:val('fam'),dc:val('fdc')});
  if(!item.cT&&!item.ch&&!item.po&&!item.le&&!item.vi&&!item.sT&&!item.fq&&!item.ht)
    item.dc=val('fdc')||'';
  fbSet('inv/'+fbKey(_es)+'/'+item.id, item);
  if(_ei<0) pushN(`📦 إضافة: ${allT()[t]?.label} — ${nm||sr} ← ${_es}`);
  closeModal(); toast(_ei>=0?'تم التعديل':'تم الإضافة');
}

function pgFaults(){
  const visibleFaults = getVisibleFaults();
  
  const active = visibleFaults.filter(f=>f.status!=='resolved').length;
  let html=`<div class="ph">
    <div><div class="pt">⚠️ الأعطال</div><div class="ps">${active} نشط — ${visibleFaults.filter(f=>f.status==='resolved').length} محلول</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${CU.role==='manager'?`<button class="btn" style="background:#238636;color:#fff" onclick="printFaultsReport()">🖨️ طباعة / PDF</button>`:''}
      ${CU.role==='manager'?`<button class="btn btn-gy" onclick="openManageFaultTemplates()">📋 القوالب</button>`:''}
      <button class="btn btn-rd" onclick="openAddFault()">🚨 إبلاغ عن عطل</button>
    </div>
  </div>`;

  FAULT_ST.forEach(st=>{
    const grp = visibleFaults.filter(f=>f.status===st.k);
    if(!grp.length) return;
    html+=`<div class="sec">${st.ico} ${st.l} <span style="color:var(--mt)">(${grp.length})</span></div>`;
    grp.forEach(f=>{
      const ri=DB.faults.indexOf(f);
      html+=`<div class="fc" style="border-right-color:${st.c};opacity:${st.k==='resolved'?.6:1}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
          <div style="flex:1">
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">${badge(f.status)}</div>
            <div style="font-size:17px;font-weight:700;margin-bottom:4px">
              📍 ${esc(f.location)} — نقطة: <span style="color:var(--bl)">${esc(f.pointId)}</span>
            </div>
            ${f.camSN?`<div style="font-size:17px;color:var(--mt);margin-bottom:3px">🔢 ${esc(f.camSN)}</div>`:''}
            <div style="font-size:17px;color:var(--mt);margin-bottom:5px">السبب: ${esc(f.reason)}</div>
            ${f.desc?`<div style="font-size:12px;color:var(--mt);margin-bottom:5px">${esc(f.desc)}</div>`:''}
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <span style="font-size:11px;color:#555">أُبلغ بواسطة ${esc(f.by)} — ${esc(f.date)}</span>
              ${f.status!=='resolved'?(()=>{const a=faultAge(f);return a?`<span style="font-size:12px;font-weight:700;color:${a.color};background:${a.color}18;padding:2px 8px;border-radius:20px;border:1px solid ${a.color}44">${a.urgent?'🔴':'🟡'} ${a.txt}</span>`:''})():''}
            </div>
            ${f.resolvedAt?`<div style="font-size:11px;color:var(--gn);margin-top:2px">✅ ${esc(f.resolvedAt)}</div>`:''}
            ${f.log&&f.log.length?`
              <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--br)">
                <div style="font-size:11px;color:var(--mt);margin-bottom:5px;font-weight:700">سجل التحديثات:</div>
                ${f.log.map(l=>`<div style="font-size:11px;color:var(--mt);padding:3px 0;display:flex;gap:6px;align-items:center">
                  <span>${l.ico}</span>
                  <span style="color:var(--tx)">${esc(l.label)}</span>
                  <span>— ${esc(l.by)}</span>
                  <span style="color:#555">— ${esc(l.date)}</span>
                </div>`).join('')}
              </div>`:''}
          </div>
          <div style="display:flex;flex-direction:column;gap:8px;min-width:160px">
            <button class="btn btn-sm" style="background:#bc8cff22;color:var(--pu);border:1px solid #bc8cff44" onclick="openFaultComments('${f.id}')">💬 تعليقات ${f.comments?.length?'('+f.comments.length+')':''}</button>
            <button class="btn btn-sm" style="background:#58a6ff22;color:var(--bl);border:1px solid #58a6ff44" onclick="openFaultPhotos('${f.id}')">📸 صور ${f.photos?.length?'('+f.photos.length+')':''}</button>

  });

  if(!DB.faults.length) html+=`<div class="panel" style="text-align:center;padding:50px;color:var(--mt)">✅ لا أعطال مسجلة</div>`;
  $('page').innerHTML=html;

function onFaultSiteChange(){
  var sel=document.getElementById('floc');
  var siteId=sel?sel.value:'';
  var ptSel=document.getElementById('fpt');
  if(!ptSel) return;
  ptSel.innerHTML='<option value="">— اختر النقطة —</option>';
  if(!siteId) return;
  var site=null;
  for(var i=0;i<DB.fieldSites.length;i++){if(DB.fieldSites[i].id===siteId){site=DB.fieldSites[i];break;}}
  if(!site) return;
  // كاميرات
  if(site.cameras&&site.cameras.length){
    var grp=document.createElement('optgroup');
    grp.label='📷 كاميرات';
    for(var i=0;i<site.cameras.length;i++){
      var cam=site.cameras[i];
      var opt=document.createElement('option');
      opt.value=cam.name||cam.serial||('كاميرا '+(i+1));
      opt.textContent=opt.value+(cam.installDesc?' — '+cam.installDesc:'');
      grp.appendChild(opt);
    }
    ptSel.appendChild(grp);
  }
  // نقاط الجرد
  var invData=DB.siteInventory&&DB.siteInventory[siteId];
  if(invData){
    var pts=Object.values(invData);
    if(pts.length){
      var grp2=document.createElement('optgroup');
      grp2.label='📌 نقاط الجرد';
      for(var j=0;j<pts.length;j++){
        var opt2=document.createElement('option');
        opt2.value=pts[j].name;
        opt2.textContent=pts[j].name;
        grp2.appendChild(opt2);
      }
      ptSel.appendChild(grp2);
    }
  }
  // راديو
  var rdevs=DB.radioDevices||[];
  var siteRadio=[];
  for(var k=0;k<rdevs.length;k++){
    if(rdevs[k].location&&rdevs[k].location.indexOf(site.name)>=0) siteRadio.push(rdevs[k]);
  }
  if(siteRadio.length){
    var grp3=document.createElement('optgroup');

function saveFault(){
  const loc=val('floc');
  const ptSel=val('fpt'), ptCustom=val('fpt-custom');
  const pt = ptSel && ptSel!=='' ? ptSel : ptCustom;
  const rsn=val('frsn');
  if(!loc||!pt||!rsn){ toast('الموقع والنقطة والسبب مطلوبة','err'); return; }
  
  const visibleSites = getVisibleFieldSites();
  const visibleSiteIds = visibleSites.map(s=>s.id);
  const visibleSiteNms = visibleSites.map(s=>s.name);
  if(loc && !visibleSiteIds.includes(loc) && !visibleSiteNms.includes(loc)){
    toast('هذا الموقع غير متاح لك','err'); return;
  }
  
  // إيجاد الموقع الميداني المرتبط
  // استخرج اسم الموقع من الـ select
  const flocEl = document.getElementById('floc');
  const locName = flocEl ? (flocEl.options[flocEl.selectedIndex]?.getAttribute('data-name')||loc) : loc;
  const relatedSite = DB.fieldSites.find(s=>s.id===loc||s.name===loc||s.name===locName);
  const locFinal = relatedSite?.name || locName || loc;
  fbPush('faults',{
    location:locFinal,pointId:pt,camSN:val('fsn'),reason:rsn,
    desc:val('fdsc'),priority:val('fpri'),by:CU.name,date:ts(),status:'open',log:[],
    fieldSiteId: relatedSite?.id||null
  });
  logAct('إضافة عطل', loc+' — '+pt+' — '+rsn);
  if(relatedSite){
    pushFieldN('🔴 عطل جديد في '+loc+' — النقطة: '+pt, relatedSite.id, 'error');
  } else {
    pushN('🔴 عطل جديد في '+loc+' — النقطة: '+pt,'error');
  }
  closeModal(); toast('تم إرسال البلاغ');
}

function updFaultStatus(f, ri, status){
  // تحقق من صلاحية الوصول للموقع
  if(!canAccessFault(f)){ toast('⛔ لا صلاحية لتعديل هذا العطل','err'); return; }
  if(CU.role==='viewer'){ toast('⛔ السيد لديه صلاحية مشاهدة فقط','err'); return; }
  const st=FAULT_ST.find(x=>x.k===status);
  const log=[...(f.log||[]),{ico:st?.ico||'',label:st?.l||status,by:CU.name,date:ts()}];
  const upd={status,log};
  if(status==='resolved'){ upd.resolvedAt=ts(); upd._tsResolved=Date.now(); upd.resolvedBy=CU.name; upd.resolvedByRole=CU.role; }
  fbUpdate('faults/'+f.id, upd);
  logAct('تحديث عطل', f.location+'/'+f.pointId+' → '+(st?.l||status));
  // إشعار موجّه: المدير فقط + صاحب البلاغ (وليس للجميع)
  const msg = (st?.ico||'')+' عطل '+f.location+'/'+f.pointId+': '+(st?.l||status)+' — بواسطة '+CU.name;
  if(f.fieldSiteId){
    pushFieldN(msg, f.fieldSiteId, 'info');
  } else {
    // نُرسل إشعار للمدير فقط إذا كان المُحدِّث ليس المدير
    const targets = DB.users.filter(u=>u.role==='manager'||(u.name===f.by&&u.uid!==CU.uid));
    if(targets.length){
      targets.forEach(u=> fbPush('notifs',{text:msg,type:'info',time:ts(),read:false,targetUid:u.uid||null,_ts:Date.now()}));
    } else {
      pushN(msg,'info');
    }
  }
  toast('تم تحديث حالة العطل');
}

function doUpdFault(ri, status){
  updFaultStatus(DB.faults[ri], ri, status);
}

async function saveUser(idx){
  const name=val('unm'), role=val('urol');
  if(!name){ toast('أدخل الاسم','err'); return; }

  if(idx>=0){
    // تعديل مستخدم موجود
    const u=DB.users[idx];
    const uid=u.uid||u.id;
    await fbUpdate('users/'+uid,{name,role});
    closeModal(); toast('تم التحديث');
    return;
  }

  // إضافة مستخدم جديد عبر Firebase Auth REST API
  const email=val('uusr'), pw=val('upw');
  if(!email||!pw){ toast('البريد وكلمة المرور مطلوبان','err'); return; }
  if(pw.length<6){ toast('كلمة المرور 6 أحرف على الأقل','err'); return; }
  if(DB.users.find(u=>u.email===email)){ toast('البريد مستخدم مسبقاً','err'); return; }

  const btn=document.querySelector('.mft .btn-bl');
  if(btn){ btn.disabled=true; btn.textContent='⏳ جار الإنشاء...'; }

  try{
    // إنشاء المستخدم في Firebase Auth
    const apiKey = firebaseConfig.apiKey;
    const res = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${apiKey}`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email, password:pw, returnSecureToken:true})
    });
    const data = await res.json();
    if(data.error){ toast('❌ '+data.error.message,'err'); if(btn){btn.disabled=false;btn.textContent='💾 حفظ';} return; }

    const newUid = data.localId;
    // حفظ بيانات المستخدم في Realtime Database
    await fbSet('users/'+newUid,{
      uid:newUid, name, email, role,
      active:true, perms:null,
      createdBy:CU.name, createdAt:ts()
    });
    logAct('إضافة مستخدم', email+' — '+role);
    closeModal(); toast('✅ تم إنشاء الحساب بنجاح');
  } catch(e){
    toast('❌ خطأ: '+e.message,'err');
    if(btn){ btn.disabled=false; btn.textContent='💾 حفظ'; }
  }
}

function genPw(){
  const chars='ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789@#!';
  let pw='';
  for(let i=0;i<8;i++) pw+=chars[Math.floor(Math.random()*chars.length)];
  return pw;
}

async function doResetPassword(i){
  const u = DB.users[i];
  const newPw = document.getElementById('npw-input')?.value?.trim();
  if(!newPw || newPw.length < 6){ toast('كلمة المرور 6 أحرف على الأقل','err'); return; }

  const btn = document.querySelector('.mft .btn-bl');
  if(btn){ btn.disabled=true; btn.textContent='⏳ جار التطبيق...'; }

  try{
    // الطريقة الوحيدة من الـ client: نسجّل دخول المستخدم بكلمة مروره القديمة
    // لكن ليس لدينا كلمته القديمة — نستخدم Firebase Admin عبر REST
    // نستخدم signInWithEmailAndPassword لحساب المدير ثم نحدّث الحساب الآخر
    // عبر Cloudflare Worker (إذا متاح) أو نحفظها مؤقتاً + نرسل reset link

    const apiKey = firebaseConfig.apiKey;

    // محاولة 1: استخدام Cloudflare Worker لتحديث كلمة المرور
    let done = false;
    try{
      const CF_URL = typeof CF_WORKER !== 'undefined' ? CF_WORKER : '';
      if(CF_URL){
        const res = await fetch(CF_URL+'/resetPassword',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({uid: u.uid||u.id, newPassword: newPw, apiKey})
        });
        if(res.ok){ done=true; }
      }
    }catch(e){ console.warn('CF reset failed:', e); }

    if(!done){
      // محاولة 2: إرسال رابط إعادة التعيين + حفظ كلمة المرور مؤقتاً
      await fetch('https://identitytoolkit.googleapis.com/v1/accounts:sendOobCode?key='+apiKey,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({requestType:'PASSWORD_RESET', email: u.email})
      });
    }

    // في كلتا الحالتين — نحفظ كلمة المرور الجديدة في DB ليراها المستخدم
    await fbUpdate('users/'+(u.uid||u.id),{
      tempPw: newPw,
      tempPwSetAt: ts(),
      tempPwSetBy: CU.name
    });

    closeModal();
    toast('✅ كلمة المرور الجديدة: '+newPw+' — تم الحفظ');
    // إشعار للمستخدم
    pushN('🔑 '+u.name+': تم إعادة تعيين كلمة مرورك — راجع حسابك','warn');

  }catch(e){
    toast('❌ خطأ: '+e.message,'err');
    if(btn){ btn.disabled=false; btn.textContent='💾 تطبيق كلمة المرور'; }
  }
}
